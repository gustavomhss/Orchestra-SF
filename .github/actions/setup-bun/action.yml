name: "Setup Bun"
description: "Setup Bun with caching and install dependencies"
inputs:
  reuse-node:
    description: "Reuse a caller-prepared Node 24; its major is checked before use"
    required: false
    default: "false"
  install-flags:
    description: "Additional flags to pass to 'bun install'"
    required: false
    default: ""
  save:
    description: "Save dependency caches after a miss; enable only for a reusable-ref producer"
    required: false
    default: "false"
outputs:
  modules-cache-hit:
    description: "Whether the installed dependency cache matched the exact key"
    value: ${{ steps.modules-cache.outputs.cache-hit }}
  bun-cache-hit:
    description: "Whether the Bun package cache matched the exact key"
    value: ${{ steps.bun-cache.outputs.cache-hit }}
  modules-cache-key:
    description: "Exact installed dependency cache key used for restore and save"
    value: ${{ steps.keys.outputs.modules }}
runs:
  using: "composite"
  steps:
    # node-gyp@latest (invoked via bunx for native install scripts) requires Node >=22;
    # some runner images ship an older system Node on PATH
    - name: Validate prepared Node
      shell: bash
      env:
        REUSE_NODE: ${{ inputs.reuse-node }}
      run: |
        case "$REUSE_NODE" in
          true) node -e 'if (process.versions.node.split(".")[0] !== "24") throw new Error("CACHE_NODE_24_REQUIRED")' ;;
          false) ;;
          *) echo "::error::reuse-node must be true or false"; exit 2 ;;
        esac

    - name: Setup Node
      if: inputs.reuse-node != 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "24"

    - name: Get baseline download URL
      id: bun-url
      shell: bash
      run: |
        if [ "$RUNNER_ARCH" = "X64" ]; then
          V=$(node -p "require('./package.json').packageManager.split('@')[1]")
          case "$RUNNER_OS" in
            macOS)   OS=darwin ;;
            Linux)   OS=linux ;;
            Windows) OS=windows ;;
          esac
          echo "url=https://github.com/oven-sh/bun/releases/download/bun-v${V}/bun-${OS}-x64-baseline.zip" >> "$GITHUB_OUTPUT"
        elif [ "$RUNNER_OS-$RUNNER_ARCH" = "Windows-ARM64" ]; then
          V=$(node -p "require('./package.json').packageManager.split('@')[1]")
          echo "url=https://github.com/oven-sh/bun/releases/download/bun-v${V}/bun-windows-aarch64.zip" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ !steps.bun-url.outputs.url && 'package.json' || '' }}
        bun-download-url: ${{ steps.bun-url.outputs.url }}

    - name: Get cache directory
      id: cache
      shell: bash
      run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"

    # Computed once, before install: a hashFiles('**/...') key evaluated after install walks
    # node_modules (about 70 s on Windows) and can hash files inside it, so save would miss restore.
    # Includes the admitted source inputs and installer ABI. New inputs cannot
    # silently reuse an installed tree produced by a different installation recipe.
    - name: Fingerprint installed dependency inputs
      id: fingerprint
      shell: bash
      run: ORCHESTRA_CACHE_NODE_ABI="$(node -p 'process.versions.modules')" bun script/ci-cache-inputs.ts >> "$GITHUB_OUTPUT"

    - name: Compute dependency cache keys
      id: keys
      shell: bash
      run: |
        echo "bun=${{ runner.os }}-${{ runner.arch }}-bun-v3-${{ hashFiles('bun.lock') }}" >> "$GITHUB_OUTPUT"
        echo "modules=${{ runner.os }}-${{ runner.arch }}-modules-v5-${{ steps.fingerprint.outputs.fingerprint }}" >> "$GITHUB_OUTPUT"

    # Every platform reuses the installed tree: on Linux a restore takes about 15 s where `bun install` from Bun's
    # package cache took about 50 s, and Windows cannot reuse Bun's package cache at all (see the install step).
    # The fingerprint covers the admitted installation inputs; unsupported source hooks fail before restore.
    # Every workspace directory must be listed (native/omni/bindings/node sits one level deeper than the others): a
    # hit skips install, so an unlisted workspace restores without its links. Bump the modules key version whenever
    # this list changes, so no entry saved with the old list is restored.
    - name: Restore node_modules
      id: modules-cache
      if: inputs.install-flags == ''
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          node_modules
          packages/*/node_modules
          packages/*/*/node_modules
          apps/*/node_modules
          modules/*/node_modules
          modules/*/*/node_modules
          tooling/*/node_modules
          native/*/*/node_modules
          native/*/*/*/node_modules
        key: ${{ steps.keys.outputs.modules }}

    - name: Restore Bun dependencies
      id: bun-cache
      # Windows installs with --no-cache below, so only other platforms reuse Bun's package cache, and only when
      # the installed tree missed.
      if: runner.os != 'Windows' && steps.modules-cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.cache.outputs.dir }}
        # v3 isolates native architectures and invalidates the old OS-only entries.
        key: ${{ steps.keys.outputs.bun }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-bun-v3-

    - name: Install setuptools for distutils compatibility
      if: steps.modules-cache.outputs.cache-hit != 'true'
      run: python3 -m pip install setuptools || pip install setuptools || true
      shell: bash

    - name: Install dependencies
      id: install
      if: steps.modules-cache.outputs.cache-hit != 'true'
      run: |
        # Workaround for patched peer variants
        # e.g. ./patches/ for standard-openapi
        # https://github.com/oven-sh/bun/issues/28147
        if [ "$RUNNER_OS" = "Windows" ]; then
          # Bun can leave a patched package directory half-renamed on Windows.
          # The hoisted layout nests several copies of a patched package (e.g. @ai-sdk/openai-compatible),
          # and Bun applies the patch once per copy; concurrent renames into the same cache entry race
          # with ENOTEMPTY. Every attempt starts from an empty cache because the loser may leave it partial.
          cache_dir="$PWD/.bun-install-cache"
          trap 'rm -rf "$cache_dir"' EXIT
          for attempt in 1 2 3 4 5; do
            rm -rf "$cache_dir"
            rm -rf node_modules
            if bun install --no-cache --cache-dir "$cache_dir" --linker hoisted ${{ inputs.install-flags }} --frozen-lockfile; then
              exit 0
            fi
            echo "::warning::bun install attempt $attempt failed on Windows; retrying from an empty cache"
          done
          exit 1
        else
          bun install ${{ inputs.install-flags }} --frozen-lockfile
        fi
      shell: bash

    # Keep snapshot branches read-only: saving a 700 MB tree per ci-run ref evicts useful caches.
    # sf-ci opts in once in preflight, before product tests, and consumers wait for that producer.
    # The legacy warm refs remain compatible; a PR cache is reusable only within that PR ref.
    - name: Save Bun dependencies
      id: bun-save
      if: runner.os != 'Windows' && steps.modules-cache.outputs.cache-hit != 'true' && steps.bun-cache.outputs.cache-hit != 'true' && (inputs.save == 'true' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/consolidate/00-baseline-green' || github.ref == 'refs/heads/consolidate/90-integration')
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.cache.outputs.dir }}
        key: ${{ steps.keys.outputs.bun }}

    - name: Save node_modules
      id: modules-save
      if: inputs.install-flags == '' && steps.modules-cache.outputs.cache-hit != 'true' && (inputs.save == 'true' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/consolidate/00-baseline-green' || github.ref == 'refs/heads/consolidate/90-integration')
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          node_modules
          packages/*/node_modules
          packages/*/*/node_modules
          apps/*/node_modules
          modules/*/node_modules
          modules/*/*/node_modules
          tooling/*/node_modules
          native/*/*/node_modules
          native/*/*/*/node_modules
        key: ${{ steps.keys.outputs.modules }}

    - name: Report dependency cache reuse
      if: ${{ !cancelled() }}
      shell: bash
      env:
        MODULES_HIT: ${{ steps.modules-cache.outputs.cache-hit || 'false' }}
        BUN_HIT: ${{ steps.bun-cache.outputs.cache-hit || 'not-restored' }}
        CACHE_SAVE_REQUESTED: ${{ inputs.save == 'true' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/consolidate/00-baseline-green' || github.ref == 'refs/heads/consolidate/90-integration' }}
        MODULES_KEY: ${{ steps.keys.outputs.modules }}
        BUN_KEY: ${{ steps.keys.outputs.bun }}
        INSTALL_OUTCOME: ${{ steps.install.outcome || 'skipped' }}
        MODULES_SAVE_OUTCOME: ${{ steps.modules-save.outcome || 'skipped' }}
        BUN_SAVE_OUTCOME: ${{ steps.bun-save.outcome || 'skipped' }}
      run: |
        {
          printf '### Dependency cache\n\n'
          printf 'Save requested: %s. Install step: %s.\n\n' "$CACHE_SAVE_REQUESTED" "$INSTALL_OUTCOME"
          printf '| Cache | Exact hit | Save step | Key |\n| --- | --- | --- | --- |\n'
          printf '| node_modules | %s | %s | %s |\n' "$MODULES_HIT" "$MODULES_SAVE_OUTCOME" "$MODULES_KEY"
          printf '| Bun packages | %s | %s | %s |\n' "$BUN_HIT" "$BUN_SAVE_OUTCOME" "$BUN_KEY"
        } >> "$GITHUB_STEP_SUMMARY"
