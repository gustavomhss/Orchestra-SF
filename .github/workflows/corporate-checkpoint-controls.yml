name: corporate-checkpoint-controls

on:
  push:
    branches: [checkpoint-controls-ci]

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      ORCHESTRA_EXPERIMENTAL_OMNI_SPAWNER: strict
      ORCHESTRA_OMNI_CONTROL: declared
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact checkpoint source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: "d2e717ee900f88f0716b7092bc84e082f49798b3"
          fetch-depth: 0
          persist-credentials: false
      - name: Record source and changed paths
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "d2e717ee900f88f0716b7092bc84e082f49798b3"
          test "$(git rev-parse 'HEAD^{tree}')" = "73f08c3d105ce59002d9297a082efd42b99660b3"
          mkdir -m 700 "$RUNNER_TEMP/checkpoint-controls"
          git rev-parse HEAD 'HEAD^{tree}' origin/dev > "$RUNNER_TEMP/checkpoint-controls/refs.txt"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/checkpoint-controls/workflow-sha.txt"
          git diff --name-only "$(git merge-base HEAD origin/dev)" HEAD > "$RUNNER_TEMP/checkpoint-controls/changed-paths.txt"
          git diff --check "$(git merge-base HEAD origin/dev)" HEAD
          while IFS= read -r file; do sha256sum "$file"; done < "$RUNNER_TEMP/checkpoint-controls/changed-paths.txt" > "$RUNNER_TEMP/checkpoint-controls/source.sha256"
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/ripgrep
      - uses: ./.github/actions/omni-binaries
      - name: Own the invocation nonce
        run: |
          set -euo pipefail
          nonce=$(node -e "process.stdout.write(require('node:crypto').randomBytes(16).toString('hex'))")
          printf '%s\n' "$nonce" > "$RUNNER_TEMP/checkpoint-controls/omni-nonce.txt"
          printf 'ORCHESTRA_OMNI_CONTROL_NONCE=%s\n' "$nonce" >> "$GITHUB_ENV"
      - name: Exercise original Microsoft HTTP and real archive boundaries
        working-directory: modules/sucafina
        run: |
          set -euo pipefail
          GITHUB_ACTIONS=false bun test \
            ./Sucafinav1/test/corporate-checkpoint-http.test.ts \
            ./Sucafinav1/test/local-backups.test.ts \
            ./Sucafinav1/test/corporate-restore-retention.test.ts \
            ./Sucafinav1/test/corporate-recovery-register.test.ts \
            --timeout 30000 --reporter=junit "--reporter-outfile=$RUNNER_TEMP/checkpoint-controls/report.xml" \
            2>&1 | tee "$RUNNER_TEMP/checkpoint-controls/bun.log"
      - name: Typecheck module
        working-directory: modules/sucafina
        run: |
          set -euo pipefail
          bun typecheck 2>&1 | tee "$RUNNER_TEMP/checkpoint-controls/typecheck.log"
      - name: Canonical guards
        run: |
          set -euo pipefail
          bun run check:guards --base origin/dev 2>&1 | tee "$RUNNER_TEMP/checkpoint-controls/guards.log"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Verify original test report and write bounded component receipt
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, xml.etree.ElementTree as ET
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "checkpoint-controls"
          cases = list(ET.parse(root / "report.xml").getroot().iter("testcase"))
          assert cases and not any(c.find("failure") is not None or c.find("error") is not None for c in cases)
          skipped = [c.attrib.get("name") for c in cases if c.find("skipped") is not None]
          assert skipped == ["foreign-owned existing root rejects (requires root fixture privileges)"]
          selected = [c for c in cases if "corporate-checkpoint-http.test.ts" in c.attrib.get("file", "") or "corporate-checkpoint-http.test.ts" in c.attrib.get("classname", "")]
          if not selected:
              names = ("Microsoft HTTP capture", "Microsoft checkpoint requires", "Microsoft checkpoint rejects",
                  "a revoked authority at the real filesystem", "corporate capture retains")
              selected = [c for c in cases if any(c.attrib.get("name", "").startswith(name) for name in names)]
          assert len(selected) == 5 and not any(c.find("skipped") is not None for c in selected)
          nonce = (root / "omni-nonce.txt").read_text().strip()
          verdicts = re.findall(r"omni positive control \[" + re.escape(nonce) + r"\]: ([^\r\n]+)", (root / "bun.log").read_text())
          assert len(verdicts) == 1 and (verdicts[0].startswith("pass ") or verdicts[0].startswith("not applicable "))
          receipt = {"schema": "sf-corporate-checkpoint-controls-v1", "sourceSha": "d2e717ee900f88f0716b7092bc84e082f49798b3",
              "sourceTree": "73f08c3d105ce59002d9297a082efd42b99660b3", "workflowSha": os.environ["GITHUB_SHA"],
              "runId": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "tests": len(cases), "newCheckpointCases": len(selected), "skipped": skipped,
              "class": "MICROSOFT_HTTP_AND_FILESYSTEM_COMPONENT_CONTROLS", "identityProvider": "CONTROLLED_ENTRA_GRAPH",
              "productSeed": "DECLARED_SQLITE_FIXTURE", "installedTeamsProof": False, "independentApproval": False,
              "g10Closed": False, "productionCutover": False,
              "hashes": {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir() if p.is_file()}}
          (root / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps({"tests": len(cases), "newCheckpointCases": len(selected), "skipped": skipped}))
          PY
      - name: Preserve original evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: corporate-checkpoint-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checkpoint-controls
          if-no-files-found: error
          retention-days: 14
