name: Archived Tree-sitter proof
run-name: "Tree-sitter proof · artifact 14713077730"

on: workflow_dispatch

permissions:
  actions: read
  contents: read

concurrency:
  group: tree-sitter-proof-14713077730
  cancel-in-progress: false

jobs:
  prove:
    if: github.repository == 'gustavomhss/Orchestra-SF' && github.ref == 'refs/heads/tree-sitter-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the versioned probe
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Download and verify exact Linux archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          proof_root="$RUNNER_TEMP/tree-sitter-proof"
          mkdir -p "$proof_root/input"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14713077730/zip" > "$proof_root/original.zip"
          printf '%s  %s\n' c3a31e10b25e81cc1b6e8234f77ed16ed6ea86c4d3c7e6026b67f5fc6187e8e7 "$proof_root/original.zip" | sha256sum --check
          archive=orchestra-sf-entra-linux-x64-baseline.tar.gz
          receipt=orchestra-sf-entra-package-receipt.json
          for name in "$archive" "$receipt"; do
            unzip -p "$proof_root/original.zip" "$name" > "$proof_root/input/$name"
          done
          python3 sf/azure/vm/install-factory-distribution.py verify \
            --artifact "$proof_root/input/$archive" \
            --receipt "$proof_root/input/$receipt" \
            --candidate 761abac2f8ee4106db0347189ff304a4a79bf026 \
            --sha256 7a2ab7102528a7de1998b30635bb02e3907ea1afc033e07d71c12cc6906158e9

      - name: Extract TypeScript and Python symbols with the archived CLI
        env:
          CHECK_RUN_ID: ${{ job.check_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B .github/ci/archive-tree-sitter-proof.py "$RUNNER_TEMP/tree-sitter-proof"

      - name: Preserve the executed proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tree-sitter-14713077730-evidence
          path: ${{ runner.temp }}/tree-sitter-proof/evidence
          if-no-files-found: error
          retention-days: 7
