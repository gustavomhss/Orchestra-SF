name: G09 exact binary reproduction
run-name: G09 binary reproduction · 0869f0467d

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g09-elf-proof-0869
  cancel-in-progress: false

jobs:
  reproduce:
    if: "github.repository == 'gustavomhss/Orchestra-SF' && github.ref == 'refs/heads/g09-elf-proof'"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_REVISION: 0869f0467d7f89ae752c3cc2aa44c5f77c40d3e6
      MODELS_SHA256: c9c52b676045a7454843ce05cfba003467ce7e6e53c0fcdfb18bcf3ab44c6397
      ORIGINAL_BINARY_SHA256: ad3b7e8e52ea33497d0e88f21de9aef4d9c8abd68706be2512c07eafa2498d6d
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false

      - name: Setup Node
        id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15"

      - name: Setup Bun
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64-baseline.zip
          no-cache: true

      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile

      - name: Build native omni
        id: native
        working-directory: native/omni
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" != "x86_64" ]]; then
            printf '%s\n' "runner rejected" >&2
            exit 1
          fi
          rustup show active-toolchain || rustup toolchain install
          cargo build --locked --release -p hugr-omni-node -p omni-supervisor

      - name: Build Linux CLI at the selected candidate SHA
        working-directory: apps/cli
        env:
          ORCHESTRA_CHANNEL: dev
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          models="$RUNNER_TEMP/azure-entra-models.json"
          curl --fail --silent --show-error --max-time 60 --retry 2 https://models.dev/api.json --output "$models"
          jq -e 'type == "object" and length > 0' "$models" >/dev/null
          export MODELS_DEV_API_JSON="$models"
          ORCHESTRA_VERSION="$(jq -er '.version' package.json)"
          export ORCHESTRA_VERSION
          printf '%s  %s\n' "$MODELS_SHA256" "$models" | sha256sum --check
          bun script/build.ts --single --skip-install --target linux-x64-baseline

      - name: Check the reproduced executable and evidence ledger
        env:
          ORIGINAL_PRODUCER: "44911103813"
          ORIGINAL_ARTIFACT: "14709069818"
        shell: bash
        run: |
          set -euo pipefail
          export WITNESS_DIR="$RUNNER_TEMP/g09-binary-proof"
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path

          target = Path("apps/cli/dist")
          binary = target / "cli-linux-x64-baseline/bin/orchestra"
          ledger, = target.glob("compile-evidence-linux-x64-baseline-*.json")
          evidence = json.loads(ledger.read_text())
          with binary.open("rb") as f:
              actual = hashlib.file_digest(f, "sha256").hexdigest()
          original = os.environ["ORIGINAL_BINARY_SHA256"]
          assert evidence["schema"] == "orchestra-compile-evidence-v2"
          assert evidence["bun"] == "1.3.14" and evidence["target"] == "linux-x64-baseline"
          assert evidence["binary"]["sha256"] == actual
          assert evidence["inputs"] and evidence["metafile"]["outputs"] and evidence["analysisMetafile"]["outputs"]
          out = Path(os.environ["WITNESS_DIR"])
          out.mkdir()
          receipt = {
              "schema": "orchestra-g09-binary-reproduction-v1",
              "sourceSHA": os.environ["SOURCE_REVISION"],
              "modelsSHA256": os.environ["MODELS_SHA256"],
              "originalRun": os.environ["ORIGINAL_PRODUCER"],
              "originalArtifact": os.environ["ORIGINAL_ARTIFACT"],
              "originalBinarySHA256": original,
              "observedBinarySHA256": actual,
              "exactMatch": actual == original,
              "compileEvidenceSHA256": hashlib.sha256(ledger.read_bytes()).hexdigest(),
          }
          (out / "reproduction.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt))
          if actual != original:
              raise SystemExit("Reproduction did not match the original executable")
          (out / "compile-evidence.json").write_bytes(ledger.read_bytes())
          PYCODE

      - name: Preserve binary comparison and matching compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g09-0869-binary-reproduction
          path: ${{ runner.temp }}/g09-binary-proof
          if-no-files-found: ignore
