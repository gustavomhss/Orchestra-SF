name: Archived Tree-sitter proof
run-name: "Tree-sitter proof · artifact 14720407018"

on: workflow_dispatch

permissions:
  actions: read
  contents: read

concurrency:
  group: tree-sitter-proof-14720407018
  cancel-in-progress: false

jobs:
  prove:
    if: github.repository == 'gustavomhss/Orchestra-SF' && github.ref == 'refs/heads/team-tree-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the versioned probe
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Download and verify exact Linux archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          proof_root="$RUNNER_TEMP/tree-sitter-proof"
          mkdir -p "$proof_root/input"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14720407018/zip" > "$proof_root/original.zip"
          printf '%s  %s\n' b94e62d50aec2a06422ee69c5fc8c319cd20be1f9ef0e66898a7fd6f9c92b15c "$proof_root/original.zip" | sha256sum --check
          archive=orchestra-sf-entra-linux-x64-baseline.tar.gz
          receipt=orchestra-sf-entra-package-receipt.json
          for name in "$archive" "$receipt"; do
            unzip -p "$proof_root/original.zip" "$name" > "$proof_root/input/$name"
          done
          python3 sf/azure/vm/install-factory-distribution.py verify \
            --artifact "$proof_root/input/$archive" \
            --receipt "$proof_root/input/$receipt" \
            --candidate e32bd1186d966de218d49825aca00728d2e87175 \
            --sha256 04226af757d903dc496f6a5f5599864f325a278c5cf141216a5ce7a36bb3a9c1

      - name: Extract TypeScript and Python symbols with the archived CLI
        env:
          CHECK_RUN_ID: ${{ job.check_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B .github/ci/archive-tree-sitter-proof.py "$RUNNER_TEMP/tree-sitter-proof"

      - name: Preserve the executed proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tree-sitter-14720407018-evidence
          path: ${{ runner.temp }}/tree-sitter-proof/evidence
          if-no-files-found: error
          retention-days: 7
