name: G09 historical package proof
run-name: "G09 #581 · 44911103813"

on:
  workflow_dispatch:
    inputs:
      evidence_artifact_id:
        description: Optional artifact containing separately signed review.json and proofs.json
        type: string

permissions:
  contents: read
  actions: read

jobs:
  g09:
    if: github.repository == 'gustavomhss/Orchestra-SF' && github.ref == 'refs/heads/g09-581-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PACKAGE_SHA: 0869f0467d7f89ae752c3cc2aa44c5f77c40d3e6
      PRODUCER_SHA: a1109e8f42d0f15088679a4e2d48338e8a37186d
      ZIP_SHA: 9d02f7b2147dead61cb3a1fec6e161b8cbf39b7515f8b2a6c7377ea8582a8f68
      TAR_SHA: f6973ae1f18749aa93e776bec47eed36aca5e0144e51f4e033622bc094dd3c7e
    steps:
      - name: Check out G09 verifier
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: auditor
          persist-credentials: false
      - name: Check out exact package source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.PACKAGE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Check out original CI harness
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.PRODUCER_SHA }}
          path: producer
          persist-credentials: false
      - name: Collect original artifact by immutable ID
        env:
          GH_TOKEN: ${{ github.token }}
          SIDE_CAR_ARTIFACT_ID: ${{ inputs.evidence_artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/g09"
          install -d -m 0700 "$out"
          test "$(git -C auditor rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$PACKAGE_SHA"
          test "$(git -C producer rev-parse HEAD)" = "$PRODUCER_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44911103813" > "$out/producer-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14709069818" > "$out/producer-artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14709069818/zip" > "$out/original.zip"
          printf '%s  %s\n' "$ZIP_SHA" "$out/original.zip" | sha256sum --check
          for name in orchestra-sf-entra-linux-x64-baseline.tar.gz orchestra-sf-entra-package-receipt.json ci-validation.json; do
            unzip -p "$out/original.zip" "$name" > "$out/$name"
          done
          printf '%s  %s\n' "$TAR_SHA" "$out/orchestra-sf-entra-linux-x64-baseline.tar.gz" | sha256sum --check
          if [[ -n "$SIDE_CAR_ARTIFACT_ID" ]]; then
            [[ "$SIDE_CAR_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SIDE_CAR_ARTIFACT_ID/zip" > "$out/evidence.zip"
            for name in review.json proofs.json; do
              unzip -p "$out/evidence.zip" "$name" > "$out/$name"
              test "$(wc -c < "$out/$name")" -le 25000000
            done
          fi
          for identity in tool source producer; do
            case "$identity" in tool) checkout=auditor ;; source) checkout=candidate ;; producer) checkout=producer ;; esac
            git -C "$checkout" cat-file commit HEAD > "$out/$identity.commit"
            git -C "$checkout" ls-tree -r -z HEAD > "$out/$identity.tree"
          done
      - name: Verify tar and run only the G09 controls
        working-directory: auditor
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/g09"
          python3 -B ../candidate/sf/azure/vm/install-factory-distribution.py verify \
            --artifact "$out/orchestra-sf-entra-linux-x64-baseline.tar.gz" \
            --receipt "$out/orchestra-sf-entra-package-receipt.json" --candidate "$PACKAGE_SHA" --sha256 "$TAR_SHA"
          npm install --ignore-scripts --no-package-lock --no-save --prefix "$out/dependencies" typescript@5.9.3
          ln -s "$out/dependencies/node_modules" node_modules
          SF_PRODUCT_SOURCE_SHA="$GITHUB_SHA" SF_TEAMS_RESIDUE_COMMIT_FILE="$out/tool.commit" \
            SF_TEAMS_RESIDUE_TRACKED_FILE="$out/tool.tree" SF_TEAMS_RESIDUE_CONTROLS_FILE="$out/controls.json" \
            node --test script/sf-ci/team-profile-residue.test.mjs script/sf-ci/g09-581-package.test.mjs | tee "$out/controls.log"
      - name: Audit the unmodified #581 bytes
        env:
          G09_TRUST_JSON: ${{ vars.G09_TRUST_JSON }}
        shell: bash
        run: node --max-old-space-size=5120 auditor/script/sf-ci/g09-581.mjs candidate producer "$RUNNER_TEMP/g09"
      - name: Preserve diagnostic or signed G09 report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g09-581-evidence
          path: |
            ${{ runner.temp }}/g09/report.json
            ${{ runner.temp }}/g09/controls.json
            ${{ runner.temp }}/g09/controls.log
          if-no-files-found: error
