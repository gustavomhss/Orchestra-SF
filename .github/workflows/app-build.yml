name: Existing C17 tar · focused evidence
run-name: C17 tar 14722264806 · 33 Solid and 50 tsconfig readback

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  readback:
    if: github.repository == 'gustavomhss/Orchestra-SF' && github.ref == 'refs/heads/g09-slice-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SOURCE_SHA: 3ef84da65d6b8ad7cd3250412bbcabdf90924172
      ZIP_SHA: 84e5f993f0d32e91c3fcb7e815e40c3155c1c1c17b80c4d394d3eb57b2b151ec
      TAR_SHA: dc11455bbcce4565b24cdca53ce3e5ab05f883757f6c0765910a0e4c98147d83
    steps:
      - name: Check out the proof harness without credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: harness
          persist-credentials: false
      - name: Check out the exact product source without credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Install only the locked parser used for static verification
        run: npm install --ignore-scripts --no-package-lock --no-save --prefix "$RUNNER_TEMP/g09-tools" typescript@5.9.3
      - name: Read the original, immutable GitHub artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/g09-slice"
          install -d -m 0700 "$out"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14722264806" > "$out/origin.json"
          jq -e --arg digest "sha256:$ZIP_SHA"             '.id == 14722264806 and .digest == $digest and .expired == false and .workflow_run.id == 44944208924'             "$out/origin.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14722264806/zip" > "$out/original.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/136967815702" > "$out/producer-job.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/136967815702/logs" > "$out/producer-job.log"
          printf '%s  %s\n' "$ZIP_SHA" "$out/original.zip" | sha256sum --check
          for member in orchestra-sf-entra-linux-x64-baseline.tar.gz compile-provenance.json cli-source-map-index.json cli-source-maps.tar.gz; do
            unzip -p "$out/original.zip" "$member" > "$out/$member"
          done
          tarball="$out/orchestra-sf-entra-linux-x64-baseline.tar.gz"
          printf '%s  %s\n' "$TAR_SHA" "$tarball" | sha256sum --check
          tar -tzf "$tarball" > "$out/tar-members.txt"
          tar -xzOf "$tarball" bin/orchestra > "$out/orchestra"
          maps_sha="$(jq -er '.cliSourceMaps.sha256' "$out/compile-provenance.json")"
          printf '%s  %s\n' "$maps_sha" "$out/cli-source-maps.tar.gz" | sha256sum --check
      - name: Verify the exact config edges and packaged Solid identifier anchors
        env:
          CHECK_RUN_ID: ${{ job.check_run_id }}
          G09_PARSER_RESOLVER: ${{ runner.temp }}/g09-tools/package.json
        run: |
          set -euo pipefail
          test "$(git -C harness rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$CHECK_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          node harness/.github/ci/g09-slice-proof.mjs             candidate "$RUNNER_TEMP/g09-slice" "$RUNNER_TEMP/g09-slice/proof.json"
      - name: Preserve the exact per-ID receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: existing-tar-14722264806-solid-tsconfig
          path: ${{ runner.temp }}/g09-slice/proof.json
          if-no-files-found: error
          retention-days: 7
