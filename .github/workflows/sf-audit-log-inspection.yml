name: sf-original-sourcing9-context
on:
  push:
    branches: [audit-sourcing9-20261119]
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read completed Operations artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --allow-escape-sequences repos/gustavomhss/Orchestra-SF/actions/artifacts/14581832230/zip > "$RUNNER_TEMP/original.zip"
      - name: Inspect original bounded screens and transport outcomes
        run: |
          python3 - <<'PY'
          import base64, io, json, os, pathlib, re, urllib.parse, zipfile
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          lines = ["# Original Sourcing9 observation", "", "Read-only inspection of run44630165380, artifact14581832230. No product rerun or replay. Headers, cookies, credentials, body values and owner identifiers are excluded.", ""]
          selected = ["b41a7", "048f9"]
          sensitive = re.compile(r"authorization|cookie|password|credential|secret|bearer|nonce|access.token|[?&](?:code|token|key)=", re.I)
          reasons = re.compile(r"^[a-z][a-z0-9-]{1,95}$")
          matched = 0
          with zipfile.ZipFile(root / "original.zip") as archive:
              for name in archive.namelist():
                  if not any(part in name for part in selected): continue
                  if name.endswith("/error-context.md"):
                      lines += ["## Original screen " + name, ""]
                      original = archive.read(name).decode("utf-8", errors="replace").split("# Test source")[0]
                      for line in original.splitlines()[:500]:
                          if not sensitive.search(line): lines.append(line[:1000])
                      lines.append("")
                  if not name.endswith(".zip"): continue
                  matched += 1
                  lines += ["## Original transport " + name, ""]
                  with zipfile.ZipFile(io.BytesIO(archive.read(name))) as trace:
                      records, enum_errors = [], []
                      for filename in trace.namelist():
                          if filename.endswith(".trace"):
                              for raw in trace.read(filename).decode("utf-8", errors="replace").splitlines():
                                  try: item = json.loads(raw)
                                  except ValueError: continue
                                  if item.get("type") not in ["console", "event"]: continue
                                  text = str(item.get("text", ""))
                                  found = re.findall(r"\b(?:contract-mismatch|contract-unavailable|invalid-response|outcome-unknown|aborted|context-mismatch|network)\b", text)
                                  if found: enum_errors.append({"type": item.get("type"), "class": item.get("messageType"), "reasons": sorted(set(found))})
                          if not filename.endswith(".network"): continue
                          for raw in trace.read(filename).decode("utf-8", errors="replace").splitlines():
                              try: item = json.loads(raw)
                              except ValueError: continue
                              item = item.get("snapshot", item)
                              request, response = item.get("request", {}), item.get("response", {})
                              url = urllib.parse.urlsplit(request.get("url", ""))
                              query = urllib.parse.parse_qs(url.query)
                              if not (url.path.endswith("/api/ui/context") or query.get("sf") or query.get("upload") or "/api/ui/pages/" in url.path or request.get("method") == "POST"): continue
                              row = {"at": item.get("startedDateTime"), "path": url.path, "method": request.get("method"),
                                     "status": response.get("status"),
                                     "query": {k: query[k] for k in ["sf", "page", "year", "resource", "capabilityId", "upload"] if k in query}}
                              content = response.get("content", {})
                              sha = content.get("_sha1")
                              resource = next((p for p in trace.namelist() if sha and p.endswith("/" + sha)), None)
                              body = None
                              if resource:
                                  try: body = json.loads(trace.read(resource))
                                  except (ValueError, UnicodeError): pass
                              row["originalBodyCaptured"] = isinstance(body, dict)
                              if isinstance(body, dict):
                                  row["producerStatus"] = body.get("status") if reasons.fullmatch(str(body.get("status", ""))) else None
                                  if isinstance(body.get("ok"), bool): row["ok"] = body["ok"]
                                  if reasons.fullmatch(str(body.get("reason", ""))): row["reason"] = body["reason"]
                              records.append(row)
                      records.sort(key=lambda row: row.get("at") or "")
                      lines += [json.dumps({"network": records[-45:], "consoleEnums": enum_errors[-20:]}, ensure_ascii=False, indent=2), ""]
          lines += ["Matching original trace archives: " + str(matched)]
          result = "\n".join(lines) + "\n"
          payload = {"message": "docs(sf): retain original Sourcing9 screens and statuses", "branch": "audit-sourcing9-20261119", "content": base64.b64encode(result.encode()).decode()}
          (root / "payload.json").write_text(json.dumps(payload))
          print("Inspected original bounded screens/statuses only; no headers, body values or owner identifiers exported.")
          PY
      - name: Persist original observation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT repos/gustavomhss/Orchestra-SF/contents/docs/handoff/observed-sourcing9-44630165380.md --input "$RUNNER_TEMP/payload.json" > /dev/null
