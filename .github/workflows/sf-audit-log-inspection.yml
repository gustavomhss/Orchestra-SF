name: sf-native-screen-inspection
on:
  push:
    branches: [audit-logs-20261119]
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read the completed Planner detail artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --allow-escape-sequences repos/gustavomhss/Orchestra-SF/actions/artifacts/14565536261/zip > "$RUNNER_TEMP/ingress17.zip"
      - name: Extract only bounded screen context
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, re, zipfile
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          output = ["# Original native screen observations", "", "Read-only extraction from already completed Actions; no tests rerun.", ""]
          sensitive = re.compile(r"authorization|cookie|password|credential|secret|bearer|nonce|access.token|[?&](?:code|token|key)=", re.I)
          for name, run, artifact in [("ingress17", 44593983417, 14565536261)]:
              output += [f"## Run {run}; artifact {artifact}", ""]
              with zipfile.ZipFile(root / f"{name}.zip") as archive:
                  members = [item for item in archive.namelist() if item.endswith("/error-context.md")]
                  output += [f"Screen context files: {len(members)}", ""]
                  for member in members:
                      output += [f"### {member}", ""]
                      for line in archive.read(member).decode("utf-8", errors="replace").splitlines()[:420]:
                          if sensitive.search(line):
                              continue
                          output.append(line[:1200])
                      output.append("")
          text = "\n".join(output) + "\n"
          payload = {"message": "docs(sf): preserve original failed native screen observations", "branch": "audit-logs-20261119", "content": base64.b64encode(text.encode()).decode()}
          (root / "screen-payload.json").write_text(json.dumps(payload))
          print(f"Extracted {len(output)} bounded lines; no trace, headers or requests were read.")
          PY
      - name: Persist the observed screen context
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT repos/gustavomhss/Orchestra-SF/contents/docs/handoff/observed-native-screens-44593983417.md --input "$RUNNER_TEMP/screen-payload.json" > /dev/null
