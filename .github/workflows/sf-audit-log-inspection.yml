name: sf-native-screen-inspection
on:
  push:
    branches: [audit-logs-20261119]
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read the two original Playwright artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --allow-escape-sequences repos/gustavomhss/Orchestra-SF/actions/artifacts/14562244092/zip > "$RUNNER_TEMP/ingress16.zip"
          gh api --allow-escape-sequences repos/gustavomhss/Orchestra-SF/actions/artifacts/14563577838/zip > "$RUNNER_TEMP/wp10native1.zip"
      - name: Extract only bounded screen context
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, re, zipfile
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          output = ["# Original native screen observations", "", "Read-only extraction from already completed Actions; no tests rerun.", ""]
          sensitive = re.compile(r"authorization|cookie|password|credential|secret|bearer|nonce|access.token", re.I)
          for name, run, artifact in [("ingress16", 44591584962, 14562244092), ("wp10native1", 44590617991, 14563577838)]:
              output += [f"## Run {run}; artifact {artifact}", ""]
              with zipfile.ZipFile(root / f"{name}.zip") as archive:
                  members = [item for item in archive.namelist() if item.endswith("/error-context.md")]
                  output += [f"Screen context files: {len(members)}", ""]
                  for member in members:
                      output += [f"### {member}", ""]
                      for line in archive.read(member).decode("utf-8", errors="replace").splitlines()[:250]:
                          if sensitive.search(line):
                              continue
                          line = re.sub(r"([?&](?:code|token|key)=)[^&#\\s\\\"'<>]*", r"\\1[redacted]", line, flags=re.I)
                          output.append(line[:1200])
                      output.append("")
          text = "\n".join(output) + "\n"
          payload = {"message": "docs(sf): preserve original failed native screen observations", "branch": "audit-logs-20261119", "content": base64.b64encode(text.encode()).decode()}
          (root / "screen-payload.json").write_text(json.dumps(payload))
          print(f"Extracted {len(output)} bounded lines; no trace, headers or requests were read.")
          PY
      - name: Persist the observed screen context
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT repos/gustavomhss/Orchestra-SF/contents/docs/handoff/observed-native-screens-44591584962.md --input "$RUNNER_TEMP/screen-payload.json" > /dev/null
