name: sf-dashboard10-original-observations
on:
  push:
    branches: [audit-dashboard10-original-20261119]
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read original completed Dashboard artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --allow-escape-sequences repos/gustavomhss/Orchestra-SF/actions/artifacts/14579563600/zip > "$RUNNER_TEMP/dashboard.zip"
      - name: Extract original producer observations and page text
        run: |
          python3 - <<'PY'
          import base64, io, json, os, pathlib, re, zipfile
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          lines = ["# Dashboard10 original timeline", "", "Read-only source run44626339410, artifact14579563600, snapshot6126e6d7d6ac6d48f9a9315993d902c784872c7b. No rerun.", ""]
          sensitive = re.compile(r"authorization|cookie|password|credential|secret|bearer|nonce|access.token|idempotency[-_]?key|[?&](?:code|token|key)=", re.I)
          def clean(value):
              if isinstance(value, dict):
                  return {key: "[redacted]" if sensitive.search(key) else clean(item) for key, item in value.items()}
              if isinstance(value, list): return [clean(item) for item in value]
              if isinstance(value, str):
                  return "\n".join("[redacted]" if sensitive.search(line) else line for line in value.splitlines())
              return value
          seen = set()
          def bounded(value):
              if isinstance(value, dict):
                  return {key: bounded(item) for key, item in value.items() if key not in ["attachments", "stdout", "stderr", "body"]}
              if isinstance(value, list): return [bounded(item) for item in value]
              if isinstance(value, str): return value[:4000]
              return value
          def visit(value):
              if isinstance(value, list):
                  for item in value: visit(item)
              elif isinstance(value, dict):
                  title = value.get("title", "")
                  if isinstance(title, str) and title.startswith("installed Dashboard"):
                      rendered = json.dumps(clean(bounded(value)), ensure_ascii=False, indent=2)
                      if rendered not in seen:
                          seen.add(rendered)
                          lines.extend(["## Original Dashboard report", "", "```json", rendered, "```", ""])
                  for key, item in value.items():
                      if key != "attachments" and isinstance(item, (dict, list)): visit(item)
          with zipfile.ZipFile(root / "dashboard.zip") as archive:
              for name in archive.namelist():
                  if name.endswith("error-context.md"):
                      raw = archive.read(name).decode("utf-8", "replace")
                      if "# Page snapshot" in raw: raw = raw[raw.index("# Page snapshot"):]
                      if "# Test source" in raw: raw = raw[:raw.index("# Test source")]
                      lines.extend(["## Original final DOM: " + name, "", "```text", clean(raw[:24000]), "```", ""])
                  if not name.endswith("/playwright-report/index.html"): continue
                  html = archive.read(name).decode("utf-8", "replace")
                  payloads = re.findall(r"data:application/zip;base64,([A-Za-z0-9+/=]+)", html)
                  lines.extend(["Embedded payloads: " + str(len(payloads)), ""])
                  for payload in payloads[:1]:
                      with zipfile.ZipFile(io.BytesIO(base64.b64decode(payload))) as embedded:
                          for member in embedded.namelist():
                              if member.endswith(".json"): visit(json.loads(embedded.read(member)))
          text = "\n".join(lines) + "\n"
          if not seen: raise RuntimeError("No original Dashboard report found")
          if len(text) > 600000: raise RuntimeError("Original observation exceeds bounded audit limit")
          payload = {"message": "docs(sf): retain original Dashboard10 timeline", "branch": "audit-dashboard10-original-20261119", "content": base64.b64encode(text.encode()).decode()}
          (root / "proposal-payload.json").write_text(json.dumps(payload))
          print("Read " + str(len(seen)) + " original observations; redacted credential fields only.")
          PY
      - name: Persist original observation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT repos/gustavomhss/Orchestra-SF/contents/docs/handoff/observed-dashboard10-original-20261119.md --input "$RUNNER_TEMP/proposal-payload.json" > /dev/null
