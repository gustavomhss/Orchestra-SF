name: sf-proposal-screens-inspection
on:
  push:
    branches: [audit-proposal-screens-20261119]
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read completed proposal artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --allow-escape-sequences repos/gustavomhss/Orchestra-SF/actions/artifacts/14574791796/zip > "$RUNNER_TEMP/proposals5.zip"
      - name: Extract original failure screen and bounded steps
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, re, zipfile
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          lines = ["# Proposal native read observation", "", "Original run 44615301691, artifact 14574791796. Read-only diagnostic, no rerun and no product assertion changed.", ""]
          sensitive = re.compile(r"authorization|cookie|password|credential|secret|bearer|nonce|access.token|idempotency[-_]key|[?&](?:code|token|key)=", re.I)
          with zipfile.ZipFile(root / "proposals5.zip") as archive:
              names = archive.namelist()
              lines += ["## Original archive members", *[name for name in names if not sensitive.search(name)], ""]
              for member in [p for p in names if p.endswith("/error-context.md")]:
                  lines += [f"## {member}", ""]
                  for line in archive.read(member).decode("utf-8", errors="replace").splitlines()[:400]:
                      if not sensitive.search(line): lines.append(line[:1200])
                  lines.append("")
              for member in [p for p in names if p.endswith((".txt", ".log"))]:
                  lines += [f"## Original text attachment: {member}", ""]
                  content = archive.read(member).decode("utf-8", errors="replace").splitlines()
                  for line in content[-160:]:
                      clean = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", line)
                      if not sensitive.search(clean): lines.append(clean[:1200])
                  lines.append("")
              for member in [p for p in names if p.endswith(".json") and "playwright-runtime" in p]:
                  value = json.loads(archive.read(member))
                  found = []
                  def visit(value):
                      if isinstance(value, list):
                          for item in value: visit(item)
                      elif isinstance(value, dict):
                          if "title" in value and "duration" in value:
                              title = value.get("title", "")
                              if isinstance(title, str) and not sensitive.search(title):
                                  found.append({k: value[k] for k in ["title", "duration", "status", "category"] if k in value})
                          for key, item in value.items():
                              if key != "attachments" and isinstance(item, (dict, list)): visit(item)
                  visit(value)
                  lines += ["## Bounded step outcomes", json.dumps(found[-120:], ensure_ascii=False), ""]
          text = "\n".join(lines) + "\n"
          payload = {"message": "docs(sf): retain original proposal read failure observation", "branch": "audit-proposal-screens-20261119", "content": base64.b64encode(text.encode()).decode()}
          (root / "proposal-payload.json").write_text(json.dumps(payload))
          print("Extracted original screens, text attachments and bounded step names, excluding sensitive lines.")
          PY
      - name: Persist original observation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT repos/gustavomhss/Orchestra-SF/contents/docs/handoff/observed-proposal-read-44615301691.md --input "$RUNNER_TEMP/proposal-payload.json" > /dev/null
