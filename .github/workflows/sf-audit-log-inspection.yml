name: sf-proposal-screens-inspection
on:
  push:
    branches: [audit-proposal-screens-20261119]
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read completed proposal artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --allow-escape-sequences repos/gustavomhss/Orchestra-SF/actions/artifacts/14578835200/zip > "$RUNNER_TEMP/proposals6.zip"
      - name: Extract original producer observations and page text
        run: |
          python3 - <<'PY'
          import base64, io, json, os, pathlib, re, zipfile
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          lines = ["# Proposal gate6 original observations", "", "Read-only source run44621582202, artifact14578835200, snapshot7098d64ae0df041d5780b54e7ed047db1ff544d5. No rerun.", ""]
          sensitive = re.compile(r"authorization|cookie|password|credential|secret|bearer|nonce|access.token|idempotency[-_]?key|[?&](?:code|token|key)=", re.I)
          def clean(value):
              if isinstance(value, dict):
                  return {key: "[redacted]" if sensitive.search(key) else clean(item) for key, item in value.items()}
              if isinstance(value, list): return [clean(item) for item in value]
              if isinstance(value, str):
                  return "\n".join("[redacted]" if sensitive.search(line) else line for line in value.splitlines())
              return value
          seen = set()
          def attachment(item):
              if not isinstance(item, dict) or item.get("name") != "proposal-original-observation.json": return
              body = item.get("body")
              if not isinstance(body, str):
                  lines.extend(["Original attachment without inline body: " + json.dumps({key:item[key] for key in ["name","contentType","path"] if key in item}), ""])
                  return
              try: decoded = base64.b64decode(body, validate=True).decode("utf-8")
              except Exception: decoded = body
              if decoded in seen: return
              seen.add(decoded)
              observation = json.loads(decoded)
              lines.extend(["## Original journey observation " + str(len(seen)), "", "```json"])
              lines.extend(json.dumps(clean(observation), ensure_ascii=False, indent=2).splitlines())
              lines.extend(["```", ""])
          def visit(value):
              if isinstance(value, list):
                  for item in value: visit(item)
              elif isinstance(value, dict):
                  for item in value.get("attachments", []): attachment(item)
                  for key, item in value.items():
                      if key != "attachments" and isinstance(item, (dict, list)): visit(item)
          with zipfile.ZipFile(root / "proposals6.zip") as archive:
              for name in archive.namelist():
                  if not name.endswith("/playwright-report/index.html"): continue
                  html = archive.read(name).decode("utf-8", "replace")
                  payloads = re.findall(r"data:application/zip;base64,([A-Za-z0-9+/=]+)", html)
                  lines.extend(["Embedded payloads: " + str(len(payloads)), ""])
                  for payload in payloads[:1]:
                      with zipfile.ZipFile(io.BytesIO(base64.b64decode(payload))) as embedded:
                          for member in embedded.namelist():
                              if member.endswith(".json"): visit(json.loads(embedded.read(member)))
          text = "\n".join(lines) + "\n"
          if not seen: raise RuntimeError("No original observation attachments found")
          if len(text) > 600000: raise RuntimeError("Original observation exceeds bounded audit limit")
          payload = {"message": "docs(sf): retain original proposal gate6 producer observations", "branch": "audit-proposal-screens-20261119", "content": base64.b64encode(text.encode()).decode()}
          (root / "proposal-payload.json").write_text(json.dumps(payload))
          print("Read " + str(len(seen)) + " original observations; redacted credential fields only.")
          PY
      - name: Persist original observation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT repos/gustavomhss/Orchestra-SF/contents/docs/handoff/observed-proposal-original-44621582202.md --input "$RUNNER_TEMP/proposal-payload.json" > /dev/null
