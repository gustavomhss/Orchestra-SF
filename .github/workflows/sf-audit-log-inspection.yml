name: sf-dashboard-attachment-inspection
on:
  push:
    branches: [audit-dashboard-counters-20261119]
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read completed Dashboard artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --allow-escape-sequences repos/gustavomhss/Orchestra-SF/actions/artifacts/14569076992/zip > "$RUNNER_TEMP/dashboard4.zip"
      - name: Extract observer fields from named or hashed attachments
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, re, zipfile
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          output = ["# Dashboard observer from original Actions artifact", "", "Original run44601709564, artifact14569076992. No test rerun. Only the observer's fixed labels and counters are published; no request/response bodies, headers, authentication material or source values.", ""]
          sensitive = re.compile(r"authorization|cookie|password|credential|secret|bearer|nonce|access.token|[?&](?:code|token|key)=", re.I)
          found, inspected = [], []
          def save_observer(value, origin):
              if not isinstance(value, dict) or not isinstance(value.get("events"), list) or not isinstance(value.get("omitted"), int): return
              events = []
              for item in value["events"]:
                  if not isinstance(item, dict): continue
                  safe = {k: v for k, v in item.items() if k in ["id","event","method","path","mode","code","status","tab","contentType","action"] and isinstance(v, (str,int,float,bool)) and not sensitive.search(str(v))}
                  if safe: events.append(safe)
              found.append((origin, events, value["omitted"]))
          def inspect_attachments(value, origin):
              if isinstance(value, list):
                  for item in value: inspect_attachments(item, origin)
              elif isinstance(value, dict):
                  if value.get("name") == "dashboard-installed-transport.json" and isinstance(value.get("body"), str):
                      try: save_observer(json.loads(base64.b64decode(value["body"])), origin + " named body")
                      except Exception: pass
                  for item in value.values():
                      if isinstance(item, (list, dict)): inspect_attachments(item, origin)
          with zipfile.ZipFile(root / "dashboard4.zip") as archive:
              for member in archive.infolist():
                  if member.is_dir() or not member.filename.endswith(".json") or member.file_size > 16000000: continue
                  inspected.append(member.filename)
                  try: value = json.loads(archive.read(member))
                  except Exception: continue
                  save_observer(value, member.filename)
                  inspect_attachments(value, member.filename)
          output += [f"JSON files inspected: {len(inspected)}", f"Observer documents found: {len(found)}", ""]
          for origin, events, omitted in found:
              output += ["## " + origin, "", f"Omitted events: {omitted}", "", json.dumps(events, ensure_ascii=False, indent=2), ""]
          if not found: output += ["## Inspected JSON paths", "", "\n".join(inspected[:80]), ""]
          text = "\n".join(output) + "\n"
          payload = {"message": "docs(sf): retain original dashboard observer counters", "branch": "audit-dashboard-counters-20261119", "content": base64.b64encode(text.encode()).decode()}
          (root / "dashboard-observer-payload.json").write_text(json.dumps(payload))
          print(f"Observer documents found: {len(found)}; only whitelisted fields retained.")
          PY
      - name: Persist original observer counters
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT repos/gustavomhss/Orchestra-SF/contents/docs/handoff/observed-dashboard-counters-20261119.md --input "$RUNNER_TEMP/dashboard-observer-payload.json" > /dev/null
