name: sf-wp10-native6-original-diagnostics
on:
  push:
    branches: [audit-wp10-native6-20261119]
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read completed WP10 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --allow-escape-sequences repos/gustavomhss/Orchestra-SF/actions/artifacts/14582460843/zip > "$RUNNER_TEMP/wp4.zip"
      - name: Extract visible final state and original observer counters
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, re, zipfile
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          sensitive = re.compile(r"authorization|cookie:|set.cookie|password|credential|secret|bearer|nonce|access.token|[?&](?:code|token|key)=", re.I)
          output = ["# WP10 native6 original diagnostics", "", "Original run 44630493615. Artifact 14582460843. No test rerun. Visible synthetic corpus state and bounded observer counters only; no headers or authentication material.", ""]
          def clean(value, limit=24000):
              return "\n".join(line for line in str(value).splitlines() if not sensitive.search(line))[:limit]
          def walk(value, origin):
              if isinstance(value,list):
                  for item in value: walk(item,origin)
              elif isinstance(value,dict):
                  if value.get("name") == "wp10-composition-observations" and isinstance(value.get("body"),str):
                      try:
                          original = json.loads(base64.b64decode(value["body"]))
                          selected = {k:original.get(k) for k in ["stage","failure","observations","http","browserEvents"]}
                          output.extend(["## Original WP10 composition facts", "", clean(json.dumps(selected,ensure_ascii=False,indent=2),50000), ""])
                      except Exception: output.append("Original composition attachment could not be decoded.")
                  if value.get("name") == "dashboard-installed-transport.json" and isinstance(value.get("body"),str):
                      try:
                          observer = json.loads(base64.b64decode(value["body"]))
                          events = [{k:v for k,v in item.items() if k in ["id","event","method","path","mode","code","status","tab","contentType","action"] and isinstance(v,(str,int,float,bool)) and not sensitive.search(str(v))} for item in observer.get("events",[])[:200] if isinstance(item,dict)]
                          output.extend(["## " + origin + " original counters", "", json.dumps(events,ensure_ascii=False,indent=2), ""])
                      except Exception: pass
                  if isinstance(value.get("name"),str) and value["name"].endswith(".json") and isinstance(value.get("body"),str) and value["name"] != "dashboard-installed-transport.json":
                      output.extend(["## Original attachment " + clean(value["name"],200), ""])
                      try:
                          parsed = json.loads(base64.b64decode(value["body"]))
                          candidates = parsed if isinstance(parsed,list) else parsed.get("observations",parsed.get("events",[])) if isinstance(parsed,dict) else []
                          allowed = ["stage","page","action","record","version","httpStatus","contentType","failure","outcome","retried","capability","count"]
                          events = [{k:v for k,v in item.items() if k in allowed and isinstance(v,(str,int,float,bool)) and not sensitive.search(str(v))} for item in candidates if isinstance(item,dict)]
                          output.extend([json.dumps(events,ensure_ascii=False,indent=2)[:24000], ""])
                      except Exception: output.append("No scalar observer array in this attachment.")
                  for item in value.values():
                      if isinstance(item,(dict,list)): walk(item,origin)
          for archive_name in ["wp4"]:
              with zipfile.ZipFile(root / (archive_name + ".zip")) as archive:
                  for member in archive.infolist():
                      if member.is_dir() or member.file_size > 16000000: continue
                      if member.filename.endswith("error-context.md"):
                          raw = archive.read(member).decode("utf-8",errors="replace")
                          if "# Page snapshot" in raw: raw = raw[raw.index("# Page snapshot"):]
                          if "# Test source" in raw: raw = raw[:raw.index("# Test source")]
                          if "- main" in raw: raw = raw[raw.index("- main"):]
                          output.extend(["## " + archive_name + " / " + member.filename, "", clean(raw), ""])
                      elif member.filename.endswith(".json"):
                          try: walk(json.loads(archive.read(member)),archive_name + " / " + member.filename)
                          except Exception: pass
          text = "\n".join(output) + "\n"
          payload = {"message":"docs(sf): retain original WP10 native6 diagnostic state","branch":"audit-wp10-native6-20261119","content":base64.b64encode(text.encode()).decode()}
          (root / "dashboard-bi-diagnostic.json").write_text(json.dumps(payload))
          print("Original final DOM and whitelisted counters retained.")
          PY
      - name: Persist original diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT repos/gustavomhss/Orchestra-SF/contents/docs/handoff/observed-wp10-native6-20261119.md --input "$RUNNER_TEMP/dashboard-bi-diagnostic.json" > /dev/null
