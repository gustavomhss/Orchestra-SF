name: teams-evidence-diagnostic

# Work-in-progress validation. Its archive belongs to this exact push commit,
# not to a final qualifying PR and not to an installed Microsoft/Azure host.
on:
  push:
    branches:
      - "ci-evidence-*"

permissions:
  contents: read

env:
  CI: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SF_PRODUCT_SOURCE_SHA: ${{ github.sha }}

jobs:
  preflight:
    name: Verify actual source and evidence contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout the exact work-in-progress evidence source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Bind the diagnostic snapshot to its sole source parent
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux && test "$RUNNER_ARCH" = X64
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git show -s --format=%P HEAD)" = "fbb96f096b0dd57520ddef9eed0b12b94bc3bdd3"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/teams-evidence-diagnostic.yml"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          git show -s --format='snapshot=%H tree=%T parents=%P'
      - uses: ./.github/actions/setup-bun
      - name: Select the exact Node runtime after composite setup
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"
      - name: Execute source identity, browser-pool and residue controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.15.0"
          test "$(bun --version)" = "1.3.14"
          node --input-type=module -e 'import { candidateSource } from "./script/sf-ci/workflow-source.mjs"; candidateSource()'
          git status --porcelain=v1 --untracked-files=all --ignore-submodules=none
          git diff --stat
          set +e
          node --test script/sf-ci/gate.test.mjs script/sf-ci/browser-pool.test.mjs script/sf-ci/team-profile-residue.test.mjs \
            > "$RUNNER_TEMP/teams-evidence-contracts.log" 2>&1
          contracts_status=$?
          set -e
          cat "$RUNNER_TEMP/teams-evidence-contracts.log"
          test "$contracts_status" -eq 0
          git status --porcelain=v1 --untracked-files=all --ignore-submodules=none
          git diff --stat
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
      - name: Preserve exact observed contract output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: teams-evidence-contracts-${{ github.sha }}
          path: ${{ runner.temp }}/teams-evidence-contracts.log
          if-no-files-found: warn
          retention-days: 14

  teams-profile-artifact:
    name: teams-profile-artifact (actual SF production archive)
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      source-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      source-tree: ${{ steps.archive.outputs.source-tree }}
      archive-sha: ${{ steps.archive.outputs.archive-sha }}
      inventory-sha: ${{ steps.archive.outputs.inventory-sha }}
      receipt-sha: ${{ steps.archive.outputs.receipt-sha }}
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      ORCHESTRA_OMNI_CONTROL: declared
      ORCHESTRA_EXPERIMENTAL_OMNI_SPAWNER: strict
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15"
      - name: Setup Bun 1.3.14 x64 baseline
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64-baseline.zip
          no-cache: true
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Build real Linux Omni companions
        working-directory: native/omni
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          rustup show active-toolchain || rustup toolchain install
          cargo build --locked --release -p hugr-omni-node -p omni-supervisor
      - name: Assemble and inspect the exact Sucafina production bytes outside checkout
        id: archive
        env:
          SF_ARTIFACT_OUTPUT: ${{ runner.temp }}/teams-profile-artifact
        run: |
          set -euo pipefail
          test "$SOURCE_REVISION" = "$(git rev-parse --verify HEAD)"
          mkdir -p "$SF_ARTIFACT_OUTPUT"
          set +e
          bun sf/ci/assemble-orchestra-web.mjs "$SF_ARTIFACT_OUTPUT/orchestra-sf.tar.gz" \
            > "$SF_ARTIFACT_OUTPUT/assembler.log" 2>&1
          assembler_status=$?
          set -e
          tail -n 100 "$SF_ARTIFACT_OUTPUT/assembler.log"
          test "$assembler_status" -eq 0
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, writeFileSync } from "node:fs"
          import { createHash } from "node:crypto"
          import { execFileSync } from "node:child_process"
          import path from "node:path"
          const out = process.env.SF_ARTIFACT_OUTPUT
          const receipt = JSON.parse(readFileSync(path.join(out, "orchestra-sf.tar.gz.receipt.json"), "utf8"))
          const tree = execFileSync("git", ["rev-parse", "--verify", "HEAD^{tree}"], { encoding: "utf8" }).trim()
          const archive = readFileSync(path.join(out, "orchestra-sf.tar.gz"))
          const digest = createHash("sha256").update(archive).digest("hex")
          if (receipt.schema !== "sf-teams-production-artifact-v1" || receipt.proofRole !== "sf-production-archive" ||
              receipt.sourceSHA !== process.env.SOURCE_REVISION || receipt.sourceTreeSHA !== tree ||
              receipt.archiveSha256 !== digest || receipt.archiveBytes !== archive.length ||
              receipt.brand !== "sucafina" || receipt.channel !== "prod" || receipt.extractedVerified !== true)
            throw new Error("SF_TEAMS_ARTIFACT_PRODUCER_BINDING_INVALID")
          writeFileSync(path.join(out, "producer.json"), JSON.stringify({
            schema: "sf-teams-artifact-producer-v1", proofRole: "sf-production-archive",
            repository: process.env.GITHUB_REPOSITORY, sourceSHA: process.env.SOURCE_REVISION,
            sourceTreeSHA: tree, archiveSha256: digest, runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT, eventName: process.env.GITHUB_EVENT_NAME,
            workflowSHA: process.env.GITHUB_SHA, job: "teams-profile-artifact",
          }, null, 2) + "\n", { flag: "wx" })
          const inventoryHash = createHash("sha256").update(readFileSync(path.join(out, "orchestra-sf.tar.gz.inventory.json"))).digest("hex")
          const receiptHash = createHash("sha256").update(readFileSync(path.join(out, "orchestra-sf.tar.gz.receipt.json"))).digest("hex")
          appendFileSync(process.env.GITHUB_OUTPUT, "source-tree=" + tree + "\narchive-sha=" + digest +
            "\ninventory-sha=" + inventoryHash + "\nreceipt-sha=" + receiptHash + "\n")
          NODE
      - name: Upload immutable production archive and actual inventory
        id: upload
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: teams-profile-artifact-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/teams-profile-artifact/
          if-no-files-found: error
          retention-days: 14


  teams-profile-residue:
    name: teams-profile-residue (exact source and production archive)
    needs: [teams-profile-artifact]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
      actions: read
    env:
      SF_TEAMS_RESIDUE_ARTIFACT_ID: ${{ needs.teams-profile-artifact.outputs.artifact-id }}
    steps:
      - name: Checkout the identical product candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Select Node 24.15 for SF qualification
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"
      - name: Bind actual Git objects before executing controls
        id: evidence
        env:
          SF_TEAMS_RESIDUE_ROOT: ${{ runner.temp }}/teams-profile-residue
          SF_TEAMS_RESIDUE_ARCHIVE_ROOT: ${{ runner.temp }}/teams-profile-residue/archive
          SF_TEAMS_RESIDUE_COMMIT_FILE: ${{ runner.temp }}/teams-profile-residue/source.commit
          SF_TEAMS_RESIDUE_TRACKED_FILE: ${{ runner.temp }}/teams-profile-residue/source.tree
          SF_TEAMS_RESIDUE_CONTROLS_FILE: ${{ runner.temp }}/teams-profile-residue/controls.json
          SF_TEAMS_RESIDUE_INVENTORY_FILE: ${{ runner.temp }}/teams-profile-residue/archive/orchestra-sf.tar.gz.inventory.json
          SF_TEAMS_RESIDUE_RECEIPT_FILE: ${{ runner.temp }}/teams-profile-residue/archive/orchestra-sf.tar.gz.receipt.json
          SF_TEAMS_RESIDUE_PROVENANCE_FILE: ${{ runner.temp }}/teams-profile-residue/provenance.json
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$RUNNER_OS" = Linux && test "$RUNNER_ARCH" = X64
          test "$(node --version)" = "v24.15.0"
          test "$(bun --version)" = "1.3.14"
          test "$SF_PRODUCT_SOURCE_SHA" = "$(git rev-parse HEAD)"
          node --input-type=module -e 'import { candidateSource } from "./script/sf-ci/workflow-source.mjs"; candidateSource()'
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          mkdir -m 700 "$SF_TEAMS_RESIDUE_ROOT"
          mkdir -m 700 "$SF_TEAMS_RESIDUE_ARCHIVE_ROOT"
          for residue_path_name in SF_TEAMS_RESIDUE_ROOT SF_TEAMS_RESIDUE_ARCHIVE_ROOT SF_TEAMS_RESIDUE_COMMIT_FILE SF_TEAMS_RESIDUE_TRACKED_FILE SF_TEAMS_RESIDUE_CONTROLS_FILE SF_TEAMS_RESIDUE_INVENTORY_FILE SF_TEAMS_RESIDUE_RECEIPT_FILE SF_TEAMS_RESIDUE_PROVENANCE_FILE; do
            printf '%s=%s\n' "$residue_path_name" "${!residue_path_name}" >> "$GITHUB_ENV"
          done
          git cat-file commit "$SF_PRODUCT_SOURCE_SHA" > "$SF_TEAMS_RESIDUE_COMMIT_FILE"
          git ls-tree -rz --full-tree "$SF_PRODUCT_SOURCE_SHA" > "$SF_TEAMS_RESIDUE_TRACKED_FILE"
          printf 'SF_CHECKOUT_TREE_SHA=%s\n' "$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
      - name: Execute all planted residue controls on the identical source
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node --test script/sf-ci/team-profile-residue.test.mjs > "$SF_TEAMS_RESIDUE_ROOT/controls.log" 2>&1
          controls_status=$?
          set -e
          cat "$SF_TEAMS_RESIDUE_ROOT/controls.log"
          test "$controls_status" -eq 0
      - name: Download only the immutable archive produced in this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.teams-profile-artifact.outputs.artifact-id }}
          path: ${{ env.SF_TEAMS_RESIDUE_ARCHIVE_ROOT }}
      - name: Independently verify artifact API identity and downloaded bytes
        env:
          GH_READ_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.teams-profile-artifact.outputs.artifact-digest }}
          EXPECTED_SOURCE_TREE: ${{ needs.teams-profile-artifact.outputs.source-tree }}
          EXPECTED_ARCHIVE_SHA: ${{ needs.teams-profile-artifact.outputs.archive-sha }}
          EXPECTED_INVENTORY_SHA: ${{ needs.teams-profile-artifact.outputs.inventory-sha }}
          EXPECTED_RECEIPT_SHA: ${{ needs.teams-profile-artifact.outputs.receipt-sha }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, writeFileSync } from "node:fs"
          import { createHash } from "node:crypto"
          import path from "node:path"
          import { candidateSource } from "./script/sf-ci/workflow-source.mjs"
          const fail = () => { throw new Error("SF_TEAMS_RESIDUE_ACTUAL_ARTIFACT_BINDING_INVALID") }
          const sourceSHA = candidateSource(), sourceTreeSHA = process.env.SF_CHECKOUT_TREE_SHA
          const id = process.env.SF_TEAMS_RESIDUE_ARTIFACT_ID
          const normalize = (value) => typeof value === "string" && /^(?:sha256:)?[a-f0-9]{64}$/.test(value)
            ? value.startsWith("sha256:") ? value : "sha256:" + value : fail()
          const expectedDigest = normalize(process.env.EXPECTED_ARTIFACT_DIGEST)
          if (!/^[1-9][0-9]*$/.test(id ?? "") || sourceTreeSHA !== process.env.EXPECTED_SOURCE_TREE ||
              !/^[a-f0-9]{40}$/.test(sourceTreeSHA ?? "")) fail()
          const url = "https://api.github.com/repos/" + process.env.GITHUB_REPOSITORY + "/actions/artifacts/" + id
          const headers = { Authorization: "Bearer " + process.env.GH_READ_TOKEN, Accept: "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "Orchestra-SF-residue-verifier" }
          const response = await fetch(url, { headers, signal: AbortSignal.timeout(30000) })
          if (!response.ok) fail()
          const artifact = await response.json()
          if (String(artifact.id) !== id || artifact.name !== "teams-profile-artifact-" + sourceSHA ||
              artifact.expired !== false || normalize(artifact.digest) !== expectedDigest ||
              String(artifact.workflow_run?.id) !== process.env.GITHUB_RUN_ID ||
              artifact.workflow_run?.head_sha !== sourceSHA ||
              String(artifact.workflow_run?.repository_id) !== process.env.GITHUB_REPOSITORY_ID ||
              !Number.isSafeInteger(artifact.size_in_bytes) || artifact.size_in_bytes <= 0) fail()
          // Verify the actual GitHub ZIP as well as the separately declared inner tar.
          const download = await fetch(url + "/zip", { headers, signal: AbortSignal.timeout(180000) })
          if (!download.ok || !download.body) fail()
          const zipped = createHash("sha256")
          let zipBytes = 0
          for await (const chunk of download.body) {
            zipBytes += chunk.length
            if (zipBytes > artifact.size_in_bytes) fail()
            zipped.update(chunk)
          }
          if (zipBytes !== artifact.size_in_bytes || "sha256:" + zipped.digest("hex") !== expectedDigest) fail()
          const root = process.env.SF_TEAMS_RESIDUE_ARCHIVE_ROOT
          const digest = (filename) => createHash("sha256").update(readFileSync(path.join(root, filename))).digest("hex")
          const archiveSha256 = digest("orchestra-sf.tar.gz")
          const inventorySha256 = digest("orchestra-sf.tar.gz.inventory.json")
          const receiptSha256 = digest("orchestra-sf.tar.gz.receipt.json")
          if (archiveSha256 !== process.env.EXPECTED_ARCHIVE_SHA ||
              inventorySha256 !== process.env.EXPECTED_INVENTORY_SHA ||
              receiptSha256 !== process.env.EXPECTED_RECEIPT_SHA) fail()
          const producer = JSON.parse(readFileSync(path.join(root, "producer.json"), "utf8"))
          if (producer.schema !== "sf-teams-artifact-producer-v1" || producer.proofRole !== "sf-production-archive" ||
              producer.repository !== process.env.GITHUB_REPOSITORY || producer.sourceSHA !== sourceSHA ||
              producer.sourceTreeSHA !== sourceTreeSHA || producer.archiveSha256 !== archiveSha256 ||
              producer.runId !== process.env.GITHUB_RUN_ID || producer.runAttempt !== process.env.GITHUB_RUN_ATTEMPT ||
              producer.workflowSHA !== process.env.GITHUB_SHA || producer.eventName !== process.env.GITHUB_EVENT_NAME ||
              producer.job !== "teams-profile-artifact") fail()
          const provenance = {
            schema: "teams-profile-residue-provenance-v1", runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT, workflowSHA: process.env.GITHUB_SHA,
            sourceSHA, sourceTreeSHA, producerJob: "teams-profile-artifact",
            artifact: { id, name: artifact.name, digest: expectedDigest, workflowRunId: String(artifact.workflow_run.id),
              headSha: artifact.workflow_run.head_sha, expired: false },
            archiveSha256, inventorySha256, receiptSha256,
          }
          writeFileSync(process.env.SF_TEAMS_RESIDUE_PROVENANCE_FILE, JSON.stringify(provenance, null, 2) + "\n",
            { flag: "wx", mode: 0o600 })
          appendFileSync(process.env.GITHUB_ENV, "SF_TEAMS_RESIDUE_ARTIFACT_DIGEST=" + expectedDigest + "\n")
          console.log("SF_TEAMS_RESIDUE_ARTIFACT_BOUND " + JSON.stringify({ sourceSHA, sourceTreeSHA, artifactId: id,
            artifactDigest: expectedDigest, archiveSha256, zipBytes }))
          NODE
      - name: Audit every tracked byte and actual packed member
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          test "$SF_PRODUCT_SOURCE_SHA" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          set +e
          bun script/sf-ci/team-profile-residue.mjs --source . \
            --archive "$SF_TEAMS_RESIDUE_ARCHIVE_ROOT/orchestra-sf.tar.gz" \
            --manifest sf/ci/team-profile-residue.json \
            --output "$SF_TEAMS_RESIDUE_ROOT/team-profile-residue.json" \
            > "$SF_TEAMS_RESIDUE_ROOT/audit.log" 2>&1
          status=$?
          set -e
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          printf '{"exitCode":%d}\n' "$status" > "$SF_TEAMS_RESIDUE_ROOT/command-status.json"
          cat "$SF_TEAMS_RESIDUE_ROOT/audit.log"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
      - name: Preserve residue evidence including an unqualified diagnostic
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: teams-profile-evidence-G09
          path: |
            ${{ env.SF_TEAMS_RESIDUE_ROOT }}/*.json
            ${{ env.SF_TEAMS_RESIDUE_ROOT }}/*.log
          if-no-files-found: error
          retention-days: 14
      - name: Fail closed unless the audit actually qualified
        if: ${{ !cancelled() }}
        env:
          ACTUAL_EXIT: ${{ steps.audit.outputs.exit_code }}
        run: |
          set -euo pipefail
          test "$ACTUAL_EXIT" = 0
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs"
          import path from "node:path"
          const report = JSON.parse(readFileSync(path.join(process.env.SF_TEAMS_RESIDUE_ROOT, "team-profile-residue.json"), "utf8"))
          if (report.status !== "PASS" || report.counts.unclassified !== 0 || report.counts.activeLegacy !== 0 ||
              report.counts.orphan !== 0 || report.binding.sourceSHA !== process.env.SF_PRODUCT_SOURCE_SHA ||
              report.binding.sourceTreeSHA !== process.env.SF_CHECKOUT_TREE_SHA ||
              report.artifact.artifact.id !== process.env.SF_TEAMS_RESIDUE_ARTIFACT_ID ||
              report.artifact.artifact.digest !== process.env.SF_TEAMS_RESIDUE_ARTIFACT_DIGEST)
            throw new Error("SF_TEAMS_RESIDUE_NOT_QUALIFIED")
          NODE

