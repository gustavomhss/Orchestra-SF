name: astra-wp00-check

# WP00's explicit product SHA lives only in a one-file check snapshot.
# Product tests continue to use the existing test-ci.yml protocol.
on:
  push:
    branches: [astra-check-wp00]

permissions:
  contents: read

concurrency:
  group: astra-wp00-check
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout check envelope
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact product and envelope
        id: product
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const input = JSON.parse(readFileSync('.astra-wp00-check.json', 'utf8'))
          if (Object.keys(input).sort().join(',') !== 'devSha,productSha' ||
              ![input.productSha, input.devSha].every(value => typeof value === 'string' && /^[a-f0-9]{40}$/.test(value)))
            throw new Error('Invalid WP00 check envelope')
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim()
          if (git('rev-parse', 'HEAD') !== process.env.GITHUB_SHA || git('rev-parse', 'HEAD^') !== input.productSha)
            throw new Error('The check must descend directly from the declared product SHA')
          if (git('diff-tree', '--no-commit-id', '--name-status', '-r', input.productSha, 'HEAD') !== 'A\t.astra-wp00-check.json')
            throw new Error('The check snapshot changed product blobs')
          git('merge-base', '--is-ancestor', '7631b186e4249abd0fc24c7d10beb62355db3f3b', input.productSha)
          appendFileSync(process.env.GITHUB_OUTPUT, `sha=${input.productSha}\ndev=${input.devSha}\n`)
          NODE

      - name: Checkout exact product
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ steps.product.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record product and guard base
        env:
          PRODUCT_SHA: ${{ steps.product.outputs.sha }}
          DEV_SHA: ${{ steps.product.outputs.dev }}
          EVIDENCE: ${{ runner.temp }}/astra-wp00-evidence
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git rev-parse origin/dev)" = "$DEV_SHA"
          mkdir -p "$EVIDENCE"
          git merge-base HEAD origin/dev > "$EVIDENCE/merge-base.txt"
          git rev-parse HEAD HEAD^{tree} origin/dev > "$EVIDENCE/revisions.txt"

      - name: Setup Bun
        id: setup
        uses: ./.github/actions/setup-bun

      - name: Validate surgical requests with canonical validators
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          EVIDENCE: ${{ runner.temp }}/astra-wp00-evidence
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, realpathSync, statSync, writeFileSync } from 'node:fs'
          import path from 'node:path'
          import { validateRequest, omniControlScope } from './script/test-ci-request.ts'
          import { locateTestPackage } from './script/test-ci-location.ts'
          const selections = JSON.parse(readFileSync('modules/sucafina/Sucafinav1/docs/product-campaign/wp00/ci-selection.json', 'utf8'))
          const isFile = file => (statSync(file, { throwIfNoEntry: false })?.isFile() ?? false) &&
            realpathSync(file).startsWith(realpathSync('.') + path.sep)
          const requests = Object.fromEntries(Object.entries(selections).map(([name, input]) => {
            const request = validateRequest(input, isFile, selector => locateTestPackage('.', selector))
            if (request.package !== 'sucafina' || request.directory !== 'modules/sucafina' || request.runner !== 'bun' ||
                request.args.length === 0 || new Set(request.args).size !== request.args.length ||
                request.args.some(file => !/^Sucafinav1\/test\/product\/wp\d{2}\/[^\s]+\.test\.ts$/.test(file) || !isFile(`${request.directory}/${file}`)))
              throw new Error(`Non-surgical selection: ${name}`)
            return [name, { request, omniControlScope: omniControlScope(request) }]
          }))
          writeFileSync(path.join(process.env.EVIDENCE, 'requests.json'), JSON.stringify(requests, null, 2))
          NODE

      - name: Typecheck Sucafina
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: modules/sucafina
        run: |
          set -o pipefail
          bun typecheck 2>&1 | tee "$RUNNER_TEMP/astra-wp00-evidence/typecheck.log"

      - name: Guard product against origin/dev
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -o pipefail
          bun run check:guards --base origin/dev 2>&1 | tee "$RUNNER_TEMP/astra-wp00-evidence/guards.log"

      - name: Upload exact-check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: astra-wp00-check-${{ github.run_attempt }}
          path: ${{ runner.temp }}/astra-wp00-evidence
          if-no-files-found: error
          retention-days: 14
