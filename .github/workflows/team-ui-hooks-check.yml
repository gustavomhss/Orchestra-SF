name: Team UI hook controls
on:
  push:
    branches: ["team-hooks-check"]
permissions:
  contents: read
concurrency:
  group: team-ui-hooks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  component:
    if: github.repository == 'gustavomhss/Orchestra-SF' && github.repository_id == '1455724710'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ORCHESTRA_OMNI_CONTROL: declared
      ORCHESTRA_EXPERIMENTAL_OMNI_SPAWNER: strict
      ORCHESTRA_CHANNEL: prod
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: "2463128352b0af2bf875eaec583fa7254576ebac"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15"
      - name: Bind exact source and integrated dependencies
        run: |
          set -euo pipefail
          hooks_output="$RUNNER_TEMP/team-ui-hooks-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$hooks_output"
          printf 'SF_TEAM_HOOKS_EVIDENCE=%s\n' "$hooks_output" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "2463128352b0af2bf875eaec583fa7254576ebac"
          test "$(git rev-parse 'HEAD^{tree}')" = "ed6d87fc0989aa98030c42c120e4d4c414200267"
          test "$(git rev-parse HEAD^)" = "9d57d077d5c06a21f7bced97eba5806cee8a8f95"
          test "$(git rev-parse "$GITHUB_SHA^")" = "2463128352b0af2bf875eaec583fa7254576ebac"
          test "$(git diff --name-only HEAD "$GITHUB_SHA")" = ".github/workflows/team-ui-hooks-check.yml"
          git rev-parse origin/dev > "$hooks_output/guard-base.sha"
          git merge-base HEAD origin/dev > "$hooks_output/guard-merge-base.sha"
          python3 - <<'PY'
          import json, subprocess
          changed = subprocess.check_output(["git", "diff", "--name-only", "9d57d077d5c06a21f7bced97eba5806cee8a8f95", "HEAD"], text=True).splitlines()
          if sorted(changed) != sorted(["packages/app-shell/src/pages/team-profile.tsx","packages/app-shell/src/context/team-profile-navigation.ts","packages/app-shell/test-browser/team-domain-hooks.test.ts"]):
              raise SystemExit("TEAM_HOOK_SOURCE_SCOPE_CHANGED")
          expected = {"packages/app-shell/src/pages/team-profile.tsx":"4cbf101248c4fc77d8aebeade65801f8696840e7","packages/app-shell/src/context/team-profile-navigation.ts":"98ffa251ca26d52eca1ad2b527b654b3bc8561ec","packages/app-shell/test-browser/team-domain-hooks.test.ts":"dd26571d4a35fcba14ff818d6300a350fe2b6cc9","packages/app-shell/src/orchestra/chapters/sucafina/context/contracts.ts":"0e26e6556c78597e2f3f6481dc817ba492c1b25f","packages/app-shell/src/orchestra/chapters/sucafina/context/drafts.ts":"2ba1ebfe0a8fefb26d4132ad7db2a43d023afab2","packages/app-shell/src/orchestra/chapters/sucafina/context/index.tsx":"580a81a78cb6429e5b739eb35b8bb7063985698a","packages/app-shell/src/orchestra/chapters/sucafina/host/draft-revalidation-availability.ts":"ed8f25b73cf3d9a3b2a49061edc03bcc20a33008","packages/app-shell/src/orchestra/chapters/sucafina/host/draft-revalidation-budget.ts":"f362a8e4b54808a3f61ae92cf2e418ff33ae6a5a","packages/app-shell/src/orchestra/chapters/sucafina/host/draft-revalidation-vendor.ts":"c861fa927df1ccbd6fb00c6ec885fac7908832b5","packages/app-shell/src/orchestra/chapters/sucafina/host/team-domain-route.ts":"16754544582682d5899194850fa4dd97acd560bc","packages/app-shell/src/orchestra/chapters/sucafina/host/team-domain.tsx":"0d89f417c878fdc6dc254fe7c8dcf76b27fadf56","packages/app-shell/test-browser/sucafina-team-domain.test.ts":"14c2a2e29dbfa28937d3ba663ab3ffd991bf4992","packages/app-shell/src/orchestra/chapters/sucafina/procurement/contracts/index.tsx":"b5d8462a54e20082f99de70d97ef67168e5f0aea","packages/app-shell/src/orchestra/chapters/sucafina/dashboard/opex/surface.tsx":"e61340a944a735dc1906895036c70156b83c6500","packages/client/src/sucafina/team-domain.ts":"222b08bbd3ab7e0583b38afd2924c3f458b6b09d","packages/client/package.json":"672a2a3fd8aa2dbedf8c5c3afa870c30a77f37bf","packages/app-shell/test-browser/team-profile-navigation.test.ts":"9780153d3616a8eaec4c1ca830b97947fbca329d","packages/app-shell/test-browser/team-profile.test.ts":"5dcd04f422f337958c7882923646a53d113e538c","packages/app-shell/test-browser/team-session-page.test.ts":"7982fac4199c21b589700098a25b4fc14eabe04c","packages/app-shell/test-browser/team-profile-configuration.test.ts":"f3c6d56db2928d3fe8eee18c6597eda20ccf648b"}
          for path, blob in expected.items():
              if subprocess.check_output(["git", "rev-parse", "HEAD:" + path], text=True).strip() != blob:
                  raise SystemExit("TEAM_HOOK_DEPENDENCY_CHANGED:" + path)
          print(json.dumps({"sourceSha": "2463128352b0af2bf875eaec583fa7254576ebac", "sourceTree": "ed6d87fc0989aa98030c42c120e4d4c414200267", "verifiedBlobs": expected}))
          PY
      - uses: ./.github/actions/setup-bun
        id: install
        with:
          reuse-node: "true"
      - name: Exercise integrated domain hooks and original Team UI controls
        id: dom
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/app-shell
        run: |
          set -euo pipefail
          export ORCHESTRA_OMNI_CONTROL_NONCE="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(16).toString("hex"))')"
          bun test --conditions=browser --preload ../../script/test-omni-control.ts --preload ./happydom.ts --timeout 15000 --reporter=junit --reporter-outfile "$SF_TEAM_HOOKS_EVIDENCE/team-hooks.junit.xml" ./test-browser/team-domain-hooks.test.ts ./test-browser/team-profile-navigation.test.ts ./test-browser/team-profile.test.ts ./test-browser/team-session-page.test.ts ./test-browser/team-profile-configuration.test.ts 2>&1 | tee "$SF_TEAM_HOOKS_EVIDENCE/team-hooks.log"
      - name: Typecheck App Shell through its original package command
        id: types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/app-shell
        run: |
          set -euo pipefail
          bun typecheck 2>&1 | tee "$SF_TEAM_HOOKS_EVIDENCE/app-shell-types.log"
      - name: Check canonical guards against origin dev
        id: guards
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail
          bun run check:guards --base origin/dev 2>&1 | tee "$SF_TEAM_HOOKS_EVIDENCE/guards.log"
      - name: Preserve complete component receipt
        if: success() && steps.dom.outcome == 'success' && steps.types.outcome == 'success' && steps.guards.outcome == 'success'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          import xml.etree.ElementTree as ET
          output = Path(os.environ["SF_TEAM_HOOKS_EVIDENCE"])
          expected = ["the public Team navigation seam preserves canonical domain deep links and drops record refs on owner change","the real Team shell preserves a closed CAP05 login return and admits its original leaf after F02","product links mount all three original Team leaves through the shell with fresh complete F02 reads","focus keeps the owner registry while Team picker cancellation retains drafts and confirmation drops old record intent","history hides a private leaf before consent and a cancelled traversal restores the same unsent draft","domain and real Chat navigation both honor the existing discard dialog without sending either draft","an uncertain domain POST survives focus without replay and logout retires the private owner","fresh revocation purges a domain draft and late old-Team page responses cannot publish in a replacement owner","the three context entry paths retain their closed selection and Team intent contract","foreign, duplicate, partial, legacy and malformed Team URLs are refused without a default intent","the URL writer changes only the admitted profile intent and never shares state between window URLs","native new-chat and Session ID paths require complete same-origin Team intent across login return URLs","logout suppresses focus revalidation and the next account starts without the old Team","an explicit Team deep link is revalidated before display and after a remount","A B A records only confirmed choices and history traversal rereads each intended owner","history navigation cancels a pending picker intent instead of preserving it into the new entry","a foreign history entry fences an in-flight Team response even when no popstate was delivered","a valid URL cannot authorize a different Team returned by the context producer","an administrator without a Team can enable, disable and remove profiles with the exact opaque CAS revision","a ready Team projection cannot substitute the principal in its business stamp","an administrative conflict requires an explicit new read and never reuses the revision from the conflict","a late administrative catalog cannot survive a principal change or open administration for the next account","logout aborts an administrative write and discards its late response before another account","the real native composer creates once and renders admitted messages plus namespace-checked stream text","Team A B A uses the native discard dialog, keeps a cancelled draft and never displays another Team's draft","focus quarantines a new draft until fresh context and namespace reads, then a changed generation removes it","history traversal rereads a session and keeps different same-Team in-memory drafts apart","an uncertain prompt survives ephemeral refresh, blocks leaving and reconciles only by reads before logout clears personal URL intent","revocation scrubs the real transcript and draft while retaining the explicit refused Team and session URL","late private HTTP data cannot reappear after the current principal changes","an administrator without a Team edits shared preferences with exact read revision and preserves agent settings","a missing document has no invented model and cannot save an empty configuration","configuration conflict invalidates the catalog and requires an explicit read without using the conflict revision","a connection lost after configuration POST keeps an unknown outcome and never resends","revoked administration on configuration read revalidates the page and exposes no form","navigation aborts a dispatched configuration write and rejects a late success","the configuration SDK refuses foreign profiles, retries and oversized writes before network dispatch"]
          cases = ET.parse(output / "team-hooks.junit.xml").getroot().findall(".//testcase")
          if sorted(x.attrib.get("name") for x in cases) != sorted(expected):
              raise SystemExit("TEAM_HOOK_JUNIT_INVENTORY_MISMATCH")
          if any(x.find(tag) is not None for x in cases for tag in ("failure", "error", "skipped")):
              raise SystemExit("TEAM_HOOK_NON_PASS_CASE")
          logs = (output / "team-hooks.log").read_text()
          if len(re.findall(r'omni positive control \[[0-9a-f]{32}\]: (?:pass|not applicable)', logs)) != 1:
              raise SystemExit("TEAM_HOOK_OMNI_CONTROL_MISSING")
          if subprocess.check_output(["git", "diff", "--name-only"], text=True).strip():
              raise SystemExit("TEAM_HOOK_SOURCE_MODIFIED_DURING_CHECKS")
          sources = {"packages/app-shell/src/pages/team-profile.tsx":"4cbf101248c4fc77d8aebeade65801f8696840e7","packages/app-shell/src/context/team-profile-navigation.ts":"98ffa251ca26d52eca1ad2b527b654b3bc8561ec","packages/app-shell/test-browser/team-domain-hooks.test.ts":"dd26571d4a35fcba14ff818d6300a350fe2b6cc9","packages/app-shell/src/orchestra/chapters/sucafina/context/contracts.ts":"0e26e6556c78597e2f3f6481dc817ba492c1b25f","packages/app-shell/src/orchestra/chapters/sucafina/context/drafts.ts":"2ba1ebfe0a8fefb26d4132ad7db2a43d023afab2","packages/app-shell/src/orchestra/chapters/sucafina/context/index.tsx":"580a81a78cb6429e5b739eb35b8bb7063985698a","packages/app-shell/src/orchestra/chapters/sucafina/host/draft-revalidation-availability.ts":"ed8f25b73cf3d9a3b2a49061edc03bcc20a33008","packages/app-shell/src/orchestra/chapters/sucafina/host/draft-revalidation-budget.ts":"f362a8e4b54808a3f61ae92cf2e418ff33ae6a5a","packages/app-shell/src/orchestra/chapters/sucafina/host/draft-revalidation-vendor.ts":"c861fa927df1ccbd6fb00c6ec885fac7908832b5","packages/app-shell/src/orchestra/chapters/sucafina/host/team-domain-route.ts":"16754544582682d5899194850fa4dd97acd560bc","packages/app-shell/src/orchestra/chapters/sucafina/host/team-domain.tsx":"0d89f417c878fdc6dc254fe7c8dcf76b27fadf56","packages/app-shell/test-browser/sucafina-team-domain.test.ts":"14c2a2e29dbfa28937d3ba663ab3ffd991bf4992","packages/app-shell/src/orchestra/chapters/sucafina/procurement/contracts/index.tsx":"b5d8462a54e20082f99de70d97ef67168e5f0aea","packages/app-shell/src/orchestra/chapters/sucafina/dashboard/opex/surface.tsx":"e61340a944a735dc1906895036c70156b83c6500","packages/client/src/sucafina/team-domain.ts":"222b08bbd3ab7e0583b38afd2924c3f458b6b09d","packages/client/package.json":"672a2a3fd8aa2dbedf8c5c3afa870c30a77f37bf","packages/app-shell/test-browser/team-profile-navigation.test.ts":"9780153d3616a8eaec4c1ca830b97947fbca329d","packages/app-shell/test-browser/team-profile.test.ts":"5dcd04f422f337958c7882923646a53d113e538c","packages/app-shell/test-browser/team-session-page.test.ts":"7982fac4199c21b589700098a25b4fc14eabe04c","packages/app-shell/test-browser/team-profile-configuration.test.ts":"f3c6d56db2928d3fe8eee18c6597eda20ccf648b"}
          receipt = {
              "schema": "sf-team-ui-hooks-component-v1", "status": "COMPONENT_CONTROLS_VERIFIED",
              "source": {"sha": "2463128352b0af2bf875eaec583fa7254576ebac", "tree": "ed6d87fc0989aa98030c42c120e4d4c414200267"},
              "integratedBase": {"sha": "9d57d077d5c06a21f7bced97eba5806cee8a8f95", "tree": "9607c1cb9ecc937fe21c7411bdaac20329f645cf"},
              "dependencies": {"teamDomainUiSource": "c02a600e4bfe0eb0362f5698ad2d099a10262751", "clientBlob": "222b08bbd3ab7e0583b38afd2924c3f458b6b09d", "clientExportBlob": "672a2a3fd8aa2dbedf8c5c3afa870c30a77f37bf", "alreadyInBase": True},
              "workflowSnapshot": {"sha": os.environ["GITHUB_SHA"], "singleParent": "2463128352b0af2bf875eaec583fa7254576ebac"},
              "run": {"id": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"]},
              "sources": [{"path": path, "gitBlob": blob, "sha256": hashlib.sha256(Path(path).read_bytes()).hexdigest()} for path, blob in sources.items()],
              "reports": {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in output.iterdir() if path.is_file()},
              "tests": len(cases), "newControls": 8, "originalControls": 29, "failures": 0, "skips": 0,
              "proofScope": ["original Team shell and F02 reader", "original domain and Chat clients over controlled HTTP", "original leaves and draft registries", "preserved profile/navigation/Chat/configuration controls"],
              "microsoftObservation": "CONTROLLED_COMPONENT_BOUNDARY", "factoryHTTPExercised": False,
              "installed": False, "g08Closed": False, "productionCutover": False,
          }
          (output / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps({"source": receipt["source"], "tests": len(cases), "installed": False, "g08Closed": False}))
          PY
      - name: Upload component evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: team-ui-hooks-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/team-ui-hooks-${{ github.run_id }}-${{ github.run_attempt }}/
