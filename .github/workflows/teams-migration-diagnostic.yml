name: teams-migration-diagnostic

# A bounded diagnostic only. This is not a final qualification gate.
on:
  push:
    branches:
      - "ci-teams-migration-diagnostic-*"

permissions:
  contents: read

env:
  CI: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source and record identity
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux && test "$RUNNER_ARCH" = X64
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git show -s --format=%P HEAD)" = "0a0faef738298151717fdaf09e178d315b0a3b21"
          test "$(git rev-parse HEAD^)" = "0a0faef738298151717fdaf09e178d315b0a3b21"
          git diff --exit-code
          git diff --cached --exit-code
          git show -s --format='source=%H tree=%T parents=%P'
      - name: Setup canonical Bun dependencies
        uses: ./.github/actions/setup-bun
      - name: Run original cut case with bounded diagnostic process
        shell: bash
        working-directory: modules/sucafina
        env:
          ORCHESTRA_EXPERIMENTAL_OMNI_SPAWNER: "1"
        run: |
          set -euo pipefail
          test "$(bun --version)" = "1.3.14"
          test "$(node --version)" = "v24.15.0"
          timeout --signal=TERM --kill-after=5s 90s bun test ./Sucafinav1/test/teams-profile/core-migration.test.ts --timeout 30000 -t "full explicit owners are additive" 2>&1 | tee "$RUNNER_TEMP/teams-migration-diagnostic.log"
      - name: Upload observed diagnostic output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: teams-migration-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/teams-migration-diagnostic.log
          if-no-files-found: error
          retention-days: 7
