name: g08-private-preflight

on:
  push:
    branches: ["teams-qa-reconcile"]
  workflow_dispatch:
    inputs:
      mode:
        description: "Controls only, or the already reserved private installed QA host (current Teams subset only)"
        type: choice
        options: ["controls", "installed"]
        default: "controls"
        required: true
      private_root:
        description: "Existing runner-owned 0700 private directory, outside checkout; installed mode only"
        type: string
        required: false
      invocation_id:
        description: "32-hex nonce from the owner-prepared private plan; installed mode only"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: g08-private-${{ github.ref }}
  cancel-in-progress: false

jobs:
  executor-controls:
    if: github.repository == 'gustavomhss/Orchestra-SF' && github.repository_id == '1455724710' && (github.event_name == 'push' || inputs.mode == 'controls')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      SF_G08_LIST_ONLY: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: "37745ae6893a131a68cf1a535498d32b1874b172"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15"
      - name: Bind tooling source without claiming an installed candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "37745ae6893a131a68cf1a535498d32b1874b172"
          test "$(git rev-parse 'HEAD^{tree}')" = "18c67f6520e07e7a2d8f3248c0bf749badd17aa7"
          proof_output="$RUNNER_TEMP/g08-tooling-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$proof_output"
          printf 'SF_G08_TOOLING_EVIDENCE=%s\n' "$proof_output" >> "$GITHUB_ENV"
          printf 'SF_G08_CANDIDATE_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          printf 'SF_G08_CANDIDATE_TREE=%s\n' "$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
      - name: Exercise evidence admission and fail-closed report controls
        run: |
          set -euo pipefail
          node --test --test-reporter=tap script/sf-ci/g08-private-evidence.test.mjs 2>&1 | tee "$SF_G08_TOOLING_EVIDENCE/contracts.tap"
      - name: Exercise private-file and read-only host observer controls
        run: |
          set -euo pipefail
          python3 script/sf-ci/test_g08_installed_preflight.py 2>&1 | tee "$SF_G08_TOOLING_EVIDENCE/host-controls.txt"
          bash -n script/sf-ci/g08-private-run.sh
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/ripgrep
      - name: Typecheck the isolated installed QA executor through its package script
        working-directory: packages/app-shell/e2e/sucafina/g08
        run: |
          set -euo pipefail
          bun typecheck 2>&1 | tee "$SF_G08_TOOLING_EVIDENCE/typecheck.log"
      - name: Exercise the real landing, administration and native draft DOM with controlled transport
        working-directory: packages/app-shell
        env:
          ORCHESTRA_OMNI_CONTROL: declared
          ORCHESTRA_EXPERIMENTAL_OMNI_SPAWNER: strict
          ORCHESTRA_CHANNEL: prod
        run: |
          set -euo pipefail
          export ORCHESTRA_OMNI_CONTROL_NONCE="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(16).toString("hex"))')"
          bun test --conditions=browser --preload ../../script/test-omni-control.ts --preload ./happydom.ts --reporter=junit --reporter-outfile "$SF_G08_TOOLING_EVIDENCE/landing-dom.junit.xml" ./e2e/sucafina/g08/landing-contract.test.ts 2>&1 | tee "$SF_G08_TOOLING_EVIDENCE/landing-dom.log"
      - name: Load the real Playwright fixture and list every case without attaching a browser
        working-directory: packages/app-shell
        run: bunx --no-install playwright test --config e2e/sucafina/g08/playwright.config.ts --list
      - name: Require the exact nine Teams cases and preserve all separate groups
        run: node script/sf-ci/g08-private-evidence.mjs verify-list "$SF_G08_TOOLING_EVIDENCE/list.json"
      - name: Check all guards against origin dev
        run: |
          set -euo pipefail
          bun run check:guards --base origin/dev 2>&1 | tee "$SF_G08_TOOLING_EVIDENCE/guards.log"
      - name: Bind reconciliation evidence to its actual source
        run: |
          set -euo pipefail
          git rev-parse HEAD 'HEAD^{tree}' > "$SF_G08_TOOLING_EVIDENCE/source-refs.txt"
          printf '%s\n' "$GITHUB_SHA" > "$SF_G08_TOOLING_EVIDENCE/workflow-sha.txt"
          git diff --name-only "31295e3a745c4ddffe49b921207671de976b1446" HEAD > "$SF_G08_TOOLING_EVIDENCE/changed-paths.txt"
          while IFS= read -r file; do sha256sum "$file"; done < "$SF_G08_TOOLING_EVIDENCE/changed-paths.txt" > "$SF_G08_TOOLING_EVIDENCE/source.sha256"
          git diff --check "31295e3a745c4ddffe49b921207671de976b1446" HEAD
          test -z "$(git status --porcelain --untracked-files=no)"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, xml.etree.ElementTree as ET
          root = pathlib.Path(os.environ["SF_G08_TOOLING_EVIDENCE"])
          cases = list(ET.parse(root / "landing-dom.junit.xml").getroot().iter("testcase"))
          assert len(cases) == 8
          assert not any(c.find(tag) is not None for c in cases for tag in ("failure", "error", "skipped"))
          tap = (root / "contracts.tap").read_text()
          assert re.search(r"^# tests 134$", tap, re.M)
          assert re.search(r"^# pass 134$", tap, re.M)
          for key in ("fail", "cancelled", "skipped", "todo"):
              assert re.search(r"^# " + key + r" 0$", tap, re.M)
          python = (root / "host-controls.txt").read_text()
          assert "Ran 28 tests" in python and re.search(r"^OK$", python, re.M)
          paths = (root / "changed-paths.txt").read_text().splitlines()
          assert len(paths) == 9
          receipt = {"schema": "sf-g08-reconciliation-controls-v1", "status": "CONTROLS_PASSED_NOT_LIVE",
              "sourceSha": "37745ae6893a131a68cf1a535498d32b1874b172", "sourceTree": "18c67f6520e07e7a2d8f3248c0bf749badd17aa7",
              "workflowSha": os.environ["GITHUB_SHA"], "runId": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"], "node": 134, "python": 28, "dom": len(cases),
              "playwright": "NINE_LISTED_NOT_RUN", "installed": False, "finalCandidate": False,
              "g08Closed": False, "productionCutover": False,
              "hashes": {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir() if p.is_file()}}
          (root / "reconciliation-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps({k: v for k, v in receipt.items() if k != "hashes"}))
          PY
      - name: Preserve tooling evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g08-executor-controls-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/g08-tooling-evidence-${{ github.run_id }}-${{ github.run_attempt }}/

  installed-teams-current:
    if: github.repository == 'gustavomhss/Orchestra-SF' && github.repository_id == '1455724710' && github.event_name == 'workflow_dispatch' && inputs.mode == 'installed'
    runs-on: [self-hosted, Linux, X64, orchestra-sf-g08-qa]
    environment: g08-isolated-qa
    timeout-minutes: 40
    env:
      CI: "true"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      SF_G08_PRIVATE_ROOT: ${{ inputs.private_root }}
      SF_G08_INVOCATION_ID: ${{ inputs.invocation_id }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: "37745ae6893a131a68cf1a535498d32b1874b172"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15"
      - uses: ./.github/actions/setup-bun
      - name: Check guards against origin dev before touching browser sessions
        run: bun run check:guards --base origin/dev
      - name: Verify installed bytes and execute only the reserved private current Teams subset
        id: installed
        run: bash script/sf-ci/g08-private-run.sh
      - name: Publish only the allowlisted current Teams subset receipt
        if: success() && steps.installed.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g08-current-installed-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: g08-public/receipt.json
