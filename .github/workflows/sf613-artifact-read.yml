                "wave five analytics: question catalog and original contextual BI",
            ]
            ANALYTICS_FAMILIES = ("SF_ANALYTICS_SOURCE", "SF_ANALYTICS_CAPTURE",
                                  "SF_DESIGN_DIAGNOSTICS", "SF_ANALYTICS_SCOPE")
            E6_FAMILY = "SF_PREVIEW_E6"
            E6_SCHEMA = "sf-preview-cases-e6-v1"
            E6_READY = json.loads("{\"installed\":1,\"windowMs\":60000,\"checkpointMs\":10000,\"maximumLines\":8,\"maximumLineBytes\":4096,\"numberCap\":999999999,\"metrics\":[\"request.total\",\"baseline.markedRead\",\"criterion.markedRead\",\"baseline.childPrepare\",\"baseline.rootPrepare\",\"criterion.childPrepare\",\"criterion.rootPrepare\"],\"eventLabels\":[\"baseline.providerEntered\",\"baseline.bodyEntered\",\"baseline.casesSelected\",\"baseline.fullFallbackUnregistered\",\"baseline.fullFallbackMapDeclined\",\"baseline.bodyExitWithoutDecision\",\"criterion.providerEntered\",\"criterion.bodyEntered\",\"criterion.casesSelected\",\"criterion.fullFallbackUnregistered\",\"criterion.fullFallbackMapDeclined\",\"criterion.bodyExitWithoutDecision\",\"baseline.childCopyFactory\",\"baseline.childCloneStaged\",\"baseline.childLoadSnapshot\",\"baseline.childSourceRoot\",\"baseline.childAclRoot\",\"criterion.childCopyFactory\",\"criterion.childCloneStaged\",\"criterion.childLoadSnapshot\",\"criterion.childSourceRoot\",\"criterion.childAclRoot\",\"nativePrepareWithoutOwner\",\"nativePrepareAfterBodyStarted\"],\"columns\":[\"metric\",\"calls\",\"settled\",\"throws\",\"pending\",\"totalTenthMsOrNull\",\"maxTenthMsOrNull\",\"overflowMask\"],\"openColumns\":[\"ordinal\",\"kind\",\"consumer\",\"parentRead\",\"readPhase\",\"stage\",\"branch\",\"ageTenthMsOrNull\"],\"readPhases\":[\"none\",\"first\",\"again\"],\"stages\":[\"marked\",\"preparing\",\"body\",\"bodyExited\"],\"readBranches\":[\"none\",\"cases\",\"fullUnregistered\",\"fullMapDeclined\"],\"prepareBranches\":[\"none\",\"copyFactory\",\"cloneStaged\",\"loadSnapshot\",\"sourceRoot\",\"aclRoot\"],\"limits\":[64,64,16],\"healthColumns\":[\"errors\",\"clockErrors\",\"droppedLines\",\"backpressure\",\"numericOverflow\",\"requestMatch\",\"requestMismatch\",\"contextLoss\"],\"meaning\":\"read calls start after selector; read elapsed null; native elapsed inclusive pre-body Dashboard preparation; native entry identity required; decisions follow prepared arguments; parent is birth owner; open partial; skipped not timer delivery; row0 lifetime not outcome; health pre-write\"}")
            # Caps are admission limits, not assertions about a future artifact or process count.
            CORE_CAP = {"summary": 128 * 1024, "e6": 128 * 1024,
                        "inventory": 256 * 1024, "receipt": 128 * 1024}
            CAP = {
                "apiBytes": 16 * 1024 * 1024, "entries": 20000, "archives": 64,
                "entryBytes": 128 * 1024 * 1024, "expandedBytes": 1024 * 1024 * 1024,
                "depth": 3, "jsonBytes": 32 * 1024 * 1024,
                "htmlBytes": 64 * 1024 * 1024, "normalizedRequestBytes": 32 * 1024,
                "logBytes": 1536 * 1024, "mainLogReviewCapBytes": 2 * 1024 * 1024,
                "chunkBytes": 24 * 1024,
            }
            ROOT = pathlib.Path(os.environ["RUNNER_TEMP"]) / "sf613-artifact-read"
            ROOT.mkdir(mode=0o700, exist_ok=False)
            (ROOT / "api").mkdir(mode=0o700)
            (ROOT / "derived").mkdir(mode=0o700)
            (ROOT / "originals").mkdir(mode=0o700)
            os.umask(0o077)
            RECEIPT = {
                "schema": 1, "kind": "original-artifact-receipt", "qualification": False,
                "status": "STARTED", "source": SOURCE, "sourceTree": SOURCE_TREE,
                "snapshot": SNAPSHOT, "snapshotTree": SNAPSHOT_TREE,
                "originalRun": ORIGINAL_RUN, "originalAttempt": ORIGINAL_ATTEMPT,
                "artifactId": ARTIFACT_ID, "caps": CAP, "checks": [],
                "pending": [], "failures": [], "parsers": {}, "logExports": [],
            }
            FILES = []
            ARCHIVES = []
            TOTAL_EXPANDED = 0
            TOTAL_ENTRIES = 0
            LOG_BYTES = 0
            API_COUNT = 0
            CORE_LINES_WRITTEN = 0
            
            class ReceiptFailure(Exception):
                def __init__(self, code):
                    self.code = code
                    super().__init__(code)
            
            def need(value, code):
                if not value:
                    raise ReceiptFailure(code)
            
            def digest(data):
                return hashlib.sha256(data).hexdigest()
            
            def canonical(value):
                return (json.dumps(value, ensure_ascii=True, sort_keys=True, indent=2) + "\n").encode("ascii")
            
            def write_bytes(path, data):
                path.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
                with open(path, "xb") as handle:
                    handle.write(data)
            
            def save_json(relative, value):
                data = canonical(value)
                write_bytes(ROOT / relative, data)
                return {"path": relative, "bytes": len(data), "sha256": digest(data)}
            
            def checked(code):
                RECEIPT["checks"].append(code)
            
            def pending(code, detail=None):
                item = {"code": code}
                if detail is not None:
                    item["detail"] = detail
                RECEIPT["pending"].append(item)
            
            def wire_line(prefix, value):
                raw = (prefix + " " + json.dumps(value, ensure_ascii=True, separators=(",", ":")) + "\n").encode("ascii")
                need(len(raw) <= 32768, "LOG_LINE_EXCEEDS_32_KIB")
                return raw
            
            def write_wire(raw):
                global LOG_BYTES
                need(isinstance(raw, bytes) and len(raw) <= 32768
                     and LOG_BYTES + len(raw) <= CAP["logBytes"], "LOG_PREFLIGHT_BUDGET_CHANGED")
                written = sys.stdout.buffer.write(raw)
                need(written == len(raw), "LOG_SHORT_WRITE")
                sys.stdout.buffer.flush()
                LOG_BYTES += len(raw)
            
            class NoRedirect(urllib.request.HTTPRedirectHandler):
                def redirect_request(self, req, fp, code, msg, headers, newurl):
                    return None
            
            NO_REDIRECT = urllib.request.build_opener(NoRedirect())
            TOKEN = os.environ.get("GH_TOKEN", "")
            
            def bounded_read(handle, limit):
                chunks = []
                count = 0
                while True:
                    block = handle.read(min(1024 * 1024, limit + 1 - count))
                    if not block:
                        break
                    count += len(block)
                    need(count <= limit, "HTTP_BODY_CAP")
                    chunks.append(block)
                return b"".join(chunks)
            
            def api(route, label):
                global API_COUNT
                need(route.startswith("/") and "\n" not in route, "API_ROUTE_INVALID")
                request = urllib.request.Request(
                    "https://api.github.com/repos/" + REPO + route,
                    headers={"Authorization": "Bearer " + TOKEN,
                             "Accept": "application/vnd.github+json",
                             "X-GitHub-Api-Version": "2022-11-28",
                             "User-Agent": "sf613-original-artifact-reader"},
                )
                try:
                    with NO_REDIRECT.open(request, timeout=45) as response:
                        need(response.status == 200, "API_STATUS")
                        raw = bounded_read(response, CAP["apiBytes"])
                except urllib.error.HTTPError as error:
                    raise ReceiptFailure("API_HTTP_" + str(error.code)) from None
                except (urllib.error.URLError, TimeoutError):
                    raise ReceiptFailure("API_TRANSPORT") from None
                API_COUNT += 1
                write_bytes(ROOT / "api" / (label + ".json"), raw)
                try:
                    return json.loads(raw)
                except (ValueError, UnicodeError):
                    raise ReceiptFailure("API_JSON_INVALID") from None
            
            def pages(route, key, prefix):
                all_rows = []
                total = None
                for number in range(1, 21):
                    separator = "&" if "?" in route else "?"
                    data = api(route + separator + "per_page=100&page=" + str(number), prefix + "-" + str(number))
                    need(isinstance(data, dict) and isinstance(data.get(key), list), "API_COLLECTION_SHAPE")
                    if total is None:
                        total = data.get("total_count")
                        need(isinstance(total, int) and 0 <= total <= 2000, "API_COLLECTION_TOTAL")
                    need(data.get("total_count") == total, "API_COLLECTION_CHANGED")
                    all_rows.extend(data[key])
                    if len(all_rows) >= total:
                        need(len(all_rows) == total, "API_COLLECTION_COUNT")
                        return all_rows
                    need(len(data[key]) == 100, "API_COLLECTION_INCOMPLETE")
                raise ReceiptFailure("API_COLLECTION_PAGE_CAP")
            
            def check_parameters():
                # A parametric draft must stop before any API call or artifact acquisition.
                conclusions = {"success", "failure", "cancelled", "timed_out", "action_required",
                               "neutral", "skipped", "stale"}
                for value in (SNAPSHOT, SNAPSHOT_TREE):
                    need(isinstance(value, str) and re.fullmatch(r"[a-f0-9]{40}", value) is not None,
                         "PARAMETER_SNAPSHOT_UNBOUND")
                for value in (BRANCH, ORIGINAL_BRANCH, ARTIFACT_NAME, EXPECTED_PLATFORM, EXPECTED_ARCH):
                    need(isinstance(value, str) and 0 < len(value) <= 200
                         and not value.startswith("UNBOUND") and re.fullmatch(r"[A-Za-z0-9._/-]+", value) is not None,
                         "PARAMETER_TEXT_UNBOUND")
                need(ORIGINAL_BRANCH.startswith("ci-run-"), "PARAMETER_ORIGINAL_BRANCH")
                need(EXPECTED_PLATFORM == "linux" and EXPECTED_ARCH in ("x64", "arm64"),
                     "PARAMETER_REQUEST_PLATFORM")
                for value in (ORIGINAL_RUN, MAIN_JOB, CLEANUP_JOB, ARTIFACT_ID, ARTIFACT_BYTES):
                    need(type(value) is int and value > 0, "PARAMETER_ID_OR_SIZE_UNBOUND")
                need(MAIN_JOB != CLEANUP_JOB and ORIGINAL_ATTEMPT == 1, "PARAMETER_ATTEMPT_OR_JOBS")
                for value in (ORIGINAL_CONCLUSION, MAIN_CONCLUSION, CLEANUP_CONCLUSION, TEST_STEP_CONCLUSION):
                    need(value in conclusions, "PARAMETER_CONCLUSION_UNBOUND")
                need(isinstance(ARTIFACT_SHA, str) and re.fullmatch(r"[a-f0-9]{64}", ARTIFACT_SHA) is not None,
                     "PARAMETER_ARTIFACT_DIGEST_UNBOUND")
                need(len(ORIGINAL_CODE_OVERLAYS) == 8 and
                     len({pin["path"] for pin in ORIGINAL_CODE_OVERLAYS}) == 8,
                     "PARAMETER_OVERLAY_PATHS")
                for pin in ORIGINAL_CODE_OVERLAYS:
                    need(pin["status"] in ("added", "modified", "A", "M")
                         and re.fullmatch(r"[a-f0-9]{40}", pin["gitBlob"]) is not None,
                         "PARAMETER_OVERLAY_BLOB_UNBOUND")
                need(isinstance(EXPECTED_RESULTS, list) and len(EXPECTED_RESULTS) == 2,
                     "PARAMETER_RESULTS_UNBOUND")
                for index, expected in enumerate(EXPECTED_RESULTS):
                    need(isinstance(expected, dict) and set(expected) == {"title", "statuses", "requiredError"}
                         and expected["title"] == TITLES[index], "PARAMETER_RESULT_SHAPE")
                    statuses = expected["statuses"]
                    need(isinstance(statuses, list) and 0 < len(statuses) <= 5
                         and len(set(statuses)) == len(statuses)
                         and all(status in ("passed", "failed", "timedOut", "skipped", "interrupted")
                                 for status in statuses), "PARAMETER_RESULT_STATUSES")
                    error = expected["requiredError"]
                    need(error is None or isinstance(error, dict)
                         and bool(error) and set(error) <= {"timeout60000", "waitForResponse", "source"},
                         "PARAMETER_REQUIRED_ERROR")
                    if error is not None:
                        for key in ("timeout60000", "waitForResponse"):
                            if key in error:
                                need(type(error[key]) is bool, "PARAMETER_ERROR_FLAG")
                        if "source" in error and error["source"] is not None:
                            position = error["source"]
                            need(isinstance(position, dict) and set(position) == {"file", "line", "column"}
                                 and position["file"] == "design-wave-five-analytics.spec.ts"
                                 and type(position["line"]) is int and position["line"] > 0
                                 and type(position["column"]) is int and position["column"] > 0,
                                 "PARAMETER_ERROR_POSITION")
                need(isinstance(PARITY_EXPECTATIONS, dict)
                     and set(PARITY_EXPECTATIONS) == {"analytics", "e6", "union"}, "PARAMETER_PARITIES_UNBOUND")
                for name, families in (("analytics", ANALYTICS_FAMILIES), ("e6", (E6_FAMILY,)),
                                       ("union", ANALYTICS_FAMILIES + (E6_FAMILY,))):
                    expected = PARITY_EXPECTATIONS[name]
                    need(isinstance(expected, dict) and set(expected) == {"bytes", "sha256", "counts"}
                         and type(expected["bytes"]) is int and 0 <= expected["bytes"] <= CAP["jsonBytes"] * 4
                         and isinstance(expected["sha256"], str)
                         and re.fullmatch(r"[a-f0-9]{64}", expected["sha256"]) is not None,
                         "PARAMETER_PARITY_SHAPE")
                    need(isinstance(expected["counts"], dict) and set(expected["counts"]) == set(families)
                         and all(type(value) is int and 0 <= value <= CAP["jsonBytes"]
                                 for value in expected["counts"].values()), "PARAMETER_PARITY_COUNTS")
                need(PARITY_EXPECTATIONS["e6"]["bytes"] <= CORE_CAP["e6"], "PARAMETER_E6_WIRE_CAP")
            
            
            def check_original_and_reader():
                check_parameters()
                need(bool(TOKEN), "GITHUB_TOKEN_REQUIRED")
                driver = os.environ.get("GITHUB_SHA", "")
                run_id = os.environ.get("GITHUB_RUN_ID", "")
                attempt = os.environ.get("GITHUB_RUN_ATTEMPT", "")
                need(os.environ.get("GITHUB_ACTIONS") == "true" and os.environ.get("RUNNER_OS") == "Linux",
                     "HOSTED_LINUX_REQUIRED")
                need(os.environ.get("GITHUB_REPOSITORY") == REPO and os.environ.get("GITHUB_EVENT_NAME") == "push",
                     "READER_EVENT_REQUIRED")
                need(os.environ.get("GITHUB_REF") == "refs/heads/" + BRANCH, "READER_REF_REQUIRED")
                need(re.fullmatch(r"[a-f0-9]{40}", driver) is not None and driver != SOURCE,
                     "READER_DRIVER_SHA_REQUIRED")
                need(run_id.isdecimal() and attempt == "1", "READER_FIRST_ATTEMPT_REQUIRED")
                event_raw = pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_bytes()
                need(len(event_raw) <= CAP["apiBytes"], "EVENT_CAP")
                event = json.loads(event_raw)
                need(event.get("after") == driver and event.get("ref") == "refs/heads/" + BRANCH
                     and event.get("repository", {}).get("full_name") == REPO, "READER_EVENT_BINDING")
                write_bytes(ROOT / "api" / "reader-event.json", event_raw)
                current_run = api("/actions/runs/" + run_id + "/attempts/1", "reader-run")
                need(current_run.get("head_sha") == driver and current_run.get("event") == "push"
                     and current_run.get("run_attempt") == 1 and current_run.get("head_branch") == BRANCH
                     and current_run.get("repository", {}).get("full_name") == REPO,
                     "READER_API_BINDING")
                need(str(current_run.get("path", "")).split("@")[0] == WORKFLOW, "READER_WORKFLOW_PATH")
                current_commit = api("/git/commits/" + driver, "reader-commit")
                need([p.get("sha") for p in current_commit.get("parents", [])] == [SOURCE],
                     "READER_SOLE_PARENT")
                source_commit = api("/git/commits/" + SOURCE, "source-commit")
                need(source_commit.get("tree", {}).get("sha") == SOURCE_TREE, "SOURCE_TREE")
                delta = api("/compare/" + SOURCE + "..." + driver, "reader-delta")
                need(delta.get("ahead_by") == 1 and delta.get("behind_by") == 0
                     and delta.get("total_commits") == 1, "READER_COMMIT_DELTA")
                changes = delta.get("files")
                need(isinstance(changes, list) and len(changes) == 1
                     and changes[0].get("filename") == WORKFLOW and changes[0].get("status") == "added",
                     "READER_EXACT_ONE_WORKFLOW_ADDITION")
                ref = api("/git/ref/heads/" + BRANCH, "reader-ref")
                need(ref.get("object", {}).get("sha") == driver, "READER_REF_DRIFT")
                RECEIPT["reader"] = {
                    "driver": driver, "driverTree": current_commit["tree"]["sha"],
                    "run": int(run_id), "attempt": 1, "event": "push", "branch": BRANCH,
                    "workflow": WORKFLOW, "workflowBlob": changes[0]["sha"],
                    "soleParent": SOURCE, "noCheckout": True, "repositoryCodeExecuted": False,
                }
                snapshot = api("/git/commits/" + SNAPSHOT, "original-snapshot-commit")
                need(snapshot.get("tree", {}).get("sha") == SNAPSHOT_TREE
                     and [p.get("sha") for p in snapshot.get("parents", [])] == [SOURCE],
                     "ORIGINAL_SNAPSHOT_BINDING")
                original_delta = api("/compare/" + SOURCE + "..." + SNAPSHOT, "original-snapshot-delta")
                original_changes = original_delta.get("files", [])
                need(original_delta.get("ahead_by") == 1 and original_delta.get("behind_by") == 0
                     and original_delta.get("total_commits") == 1 and len(original_changes) == 9
                     and {(item.get("filename"), item.get("status"), item.get("sha")) for item in original_changes} == {
                         (".ci-run.json", "added", REQUEST_BLOB),
                         *((pin["path"], "added" if pin["status"] in ("A", "added") else "modified", pin["gitBlob"])
                           for pin in ORIGINAL_CODE_OVERLAYS),
                     }, "ORIGINAL_EXACT_NINE_DIAGNOSTIC_OVERLAYS")
                original_run = api("/actions/runs/" + str(ORIGINAL_RUN) + "/attempts/1", "original-run")
                need(original_run.get("id") == ORIGINAL_RUN and original_run.get("run_attempt") == 1
                     and original_run.get("head_sha") == SNAPSHOT and original_run.get("event") == "push"
                     and original_run.get("status") == "completed" and original_run.get("conclusion") == ORIGINAL_CONCLUSION
                     and original_run.get("head_branch") == ORIGINAL_BRANCH
                     and str(original_run.get("path", "")).split("@")[0] == ".github/workflows/test-ci.yml"
                     and original_run.get("repository", {}).get("full_name") == REPO,
