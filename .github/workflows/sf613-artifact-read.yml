name: SF613 original Analytics artifact receipt

on:
  push:
    branches: [sf613-artifact-e6]

permissions:
  contents: read
  actions: read

concurrency:
  group: sf613-artifact-e6-${{ github.sha }}
  cancel-in-progress: false

jobs:
