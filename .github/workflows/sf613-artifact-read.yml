                        if cost <= budget:
                            budget -= cost
                            retained_files[report["file"]] = report
                retained_rows.sort(key=lambda row: (row["file"], row["line"]))
                TRACE_ROWS[:] = retained_rows
                retained_witness = hashlib.sha256()
                for row in retained_rows:
                    retained_witness.update(trace_witness(row))
                identity_omissions = sum(value["local"] is None for row in retained_rows for value in row["identities"].values())
                if identity_omissions:
                    pending("TRACE_IDENTITY_ORDINAL_CAP", {"values": identity_omissions, "perFileCap": CAP["summaryRows"] * 8})
                result["files"] = [retained_files[key] for key in sorted(retained_files)]
                result["rows"] = retained_rows
                result["retainedRows"] = len(retained_rows)
                result["coverage"].update({
                    "fileReportsRetained": len(retained_files), "fileReportsOmitted": len(reports) - len(retained_files),
                    "identityOrdinalOmissions": identity_omissions,
                    "bi06NetworkRows": sum(row["kind"] == "network" and row["target"]["viewId"] == "BI06" for row in retained_rows),
                    "biOptionsNetworkRows": sum(row["kind"] == "network" and row["operation"] == "bi-options" for row in retained_rows),
                    "localizedContextDeclarations": sum((row["kind"] == "context-options" and row["locale"] == "pt-BR")
                                                         or any(value["safe"] == "pt-BR" for value in row["locales"].values())
                                                         for row in retained_rows)})
                result["retention"].update({"byteCapOmittedByPriority": byte_counts, "retainedByPriority": retained_counts,
                                            "byteCapOmittedWitnessSha256": byte_witness.hexdigest(),
                                            "retainedWitnessSha256": retained_witness.hexdigest()})
                need(selected_total == sum(row_cap_counts) + sum(byte_counts) + len(retained_rows), "TRACE_RETENTION_CONSERVATION")
                if sum(byte_counts) or len(retained_files) != len(reports):
                    pending("TRACE_SAFE_BYTE_CAP", {"cap": TRACE_EXPORT_BYTES, "omittedRows": sum(byte_counts),
                                                   "omittedFileReports": len(reports) - len(retained_files)})
                need(len(canonical(result)) <= TRACE_EXPORT_BYTES, "TRACE_SERIALIZED_BYTE_CAP")
                RECEIPT["parsers"]["trace"] = save_json("derived/trace-safe.json", result)
                RECEIPT["parsers"]["trace"].update({"files": len(candidates), "selectedRows": selected_total,
                                                  "retainedRows": len(retained_rows), "rawByteCap": TRACE_EXPORT_BYTES,
                                                  "runtimeBinding": "explicit attachment and archive ancestry; shared ancestry remains ambiguous"})
            
            def inventory_error_context_and_pngs():
                contexts = [item for item in FILES if not item["directory"] and item["path"].endswith("error-context.md")]
                RECEIPT["parsers"]["errorContexts"] = [
                    {"file": item["id"], "bytes": item["bytes"], "sha256": item["sha256"],
                     "rawPreserved": True, "logText": "PENDING_ORIGINAL_TEXT_EXPORT"} for item in contexts
                ]
                if not contexts:
                    pending("ORIGINAL_ERROR_CONTEXT_ABSENT")
                pngs = []
                for suffix in PNG_SUFFIXES:
                    matches = locate_suffix(suffix, outer_only=True)
                    if len(matches) != 1:
                        pending("ORIGINAL_TARGET_PNG_CARDINALITY", {"suffix": suffix, "matches": len(matches)})
                        continue
                    item = matches[0]
                    raw = read_file(item, CAP["entryBytes"])
                    need(raw.startswith(b"\x89PNG\r\n\x1a\n") and len(raw) >= 33
                         and raw[12:16] == b"IHDR", "TARGET_PNG_SIGNATURE")
                    width = int.from_bytes(raw[16:20], "big")
                    height = int.from_bytes(raw[20:24], "big")
                    need(0 < width <= 20000 and 0 < height <= 20000, "TARGET_PNG_DIMENSIONS")
                    pngs.append({"file": item["id"], "suffix": suffix, "bytes": item["bytes"],
                                 "sha256": item["sha256"], "width": width, "height": height,
                                 "originalPng": True, "jpegPreviewSubstituted": False})
                RECEIPT["parsers"]["targetPngs"] = pngs
            
            def log_bytes_payload(name, raw, mime, original, reserve=65536, record=True):
                encoded = base64.b64encode(raw).decode("ascii")
                pieces = [encoded[i:i + CAP["chunkBytes"]] for i in range(0, len(encoded), CAP["chunkBytes"])]
                metadata = {"name": name, "bytes": len(raw), "sha256": digest(raw), "mime": mime,
                            "original": original, "encoding": "base64", "chunks": len(pieces)}
                lines = [{"schema": 1, **metadata, "index": i + 1, "data": piece} for i, piece in enumerate(pieces)]
                planned = sum(len(("SF613_ARTIFACT_BYTES " + json.dumps(row, ensure_ascii=True, separators=(",", ":")) + "\n").encode("ascii"))
                              for row in lines)
                if any(len(("SF613_ARTIFACT_BYTES " + json.dumps(row, ensure_ascii=True, separators=(",", ":")) + "\n").encode("ascii")) > 32768
                       for row in lines) or LOG_BYTES + planned + reserve > CAP["logBytes"]:
                    if record:
                        RECEIPT["logExports"].append({**metadata, "status": "PENDING_LOG_BUDGET",
                                                      "reason": "all bytes retained in artifact; no partial base64 emitted"})
                    return False
                for row in lines:
                    need(emit("SF613_ARTIFACT_BYTES", row), "LOG_BUDGET_CHANGED")
                if record:
                    RECEIPT["logExports"].append({**metadata, "status": "COMPLETE"})
                return True
            
            def ensure_inventory():
                if "inventory" not in RECEIPT:
                    inventory = {"schema": 1, "archives": ARCHIVES, "files": FILES}
                    RECEIPT["inventory"] = save_json("derived/inventory.json", inventory)
                return RECEIPT["inventory"]
            
            def emit_bounded_evidence():
                inventory = ensure_inventory()
                safe = {
                    "schema": 1, "qualification": False, "source": SOURCE, "sourceTree": SOURCE_TREE,
                    "snapshot": SNAPSHOT, "snapshotTree": SNAPSHOT_TREE, "run": ORIGINAL_RUN,
                    "artifact": RECEIPT["artifact"],
                    "selection": RECEIPT["parsers"].get("selection"),
                    "runtime": RECEIPT["parsers"].get("runtime"),
                    "htmlArchives": RECEIPT["parsers"].get("htmlArchives", []),
                    "errorContexts": RECEIPT["parsers"].get("errorContexts", []),
                    "targetPngs": RECEIPT["parsers"].get("targetPngs", []),
                }
                summary = canonical(safe)
                write_bytes(ROOT / "derived" / "safe-summary.json", summary)
                log_bytes_payload("safe-summary.json", summary, "application/json", False, reserve=65536 + TRACE_LOG_RESERVE)
                inventory_raw = (ROOT / inventory["path"]).read_bytes()
                need(len(inventory_raw) == inventory["bytes"] and digest(inventory_raw) == inventory["sha256"],
