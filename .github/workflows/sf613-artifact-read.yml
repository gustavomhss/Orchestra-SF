            def storage_url_allowed(url):
                value = urllib.parse.urlsplit(url)
                host = (value.hostname or "").lower()
                suffixes = (".blob.core.windows.net", ".githubusercontent.com", ".amazonaws.com")
                return (value.scheme == "https" and not value.username and not value.password
                        and value.port in (None, 443) and any(host.endswith(suffix) for suffix in suffixes))
            
            def download_original():
                request = urllib.request.Request(
                    "https://api.github.com/repos/" + REPO + "/actions/artifacts/" + str(ARTIFACT_ID) + "/zip",
                    headers={"Authorization": "Bearer " + TOKEN, "Accept": "application/vnd.github+json",
                             "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "sf613-original-artifact-reader"},
                )
                try:
                    response = NO_REDIRECT.open(request, timeout=45)
                except urllib.error.HTTPError as error:
                    need(error.code == 302, "ARTIFACT_DOWNLOAD_REDIRECT_REQUIRED")
                    location = error.headers.get("Location", "")
                    error.close()
                else:
                    response.close()
                    raise ReceiptFailure("ARTIFACT_DOWNLOAD_REDIRECT_REQUIRED")
                need(storage_url_allowed(location), "ARTIFACT_STORAGE_ORIGIN")
                # A separate request/opener receives no GitHub Authorization, cookie or referer.
                for redirect_count in range(4):
                    unsigned = urllib.request.Request(location, headers={"User-Agent": "sf613-original-artifact-reader"})
                    try:
                        response = NO_REDIRECT.open(unsigned, timeout=120)
                    except urllib.error.HTTPError as error:
                        need(error.code in (301, 302, 303, 307, 308) and redirect_count < 3,
                             "ARTIFACT_STORAGE_HTTP")
                        location = urllib.parse.urljoin(location, error.headers.get("Location", ""))
                        error.close()
                        need(storage_url_allowed(location), "ARTIFACT_STORAGE_REDIRECT_ORIGIN")
                        continue
                    except (urllib.error.URLError, TimeoutError):
                        raise ReceiptFailure("ARTIFACT_STORAGE_TRANSPORT") from None
                    with response:
                        need(response.status == 200, "ARTIFACT_STORAGE_STATUS")
                        hasher = hashlib.sha256()
                        size = 0
                        with open(ROOT / "original.zip", "xb") as output:
                            while True:
                                block = response.read(1024 * 1024)
                                if not block:
                                    break
                                size += len(block)
                                need(size <= ARTIFACT_BYTES, "ARTIFACT_TOO_LARGE")
                                output.write(block)
                                hasher.update(block)
                        need(size == ARTIFACT_BYTES and hasher.hexdigest() == ARTIFACT_SHA,
                             "ARTIFACT_BYTES_OR_SHA256")
                        RECEIPT["artifact"]["verifiedBytes"] = size
                        RECEIPT["artifact"]["verifiedSha256"] = hasher.hexdigest()
                        RECEIPT["artifact"]["downloadCount"] = 1
                        checked("original_zip_bytes_and_sha256")
                        return
                raise ReceiptFailure("ARTIFACT_REDIRECT_CAP")
            
            # Phase 2: read archive bytes only; never use extractall, shell, imports or executable entries.
            def path_parts(name, directory):
                need(isinstance(name, str) and name and "\x00" not in name and "\\" not in name
                     and not name.startswith("/") and not re.match(r"^[A-Za-z]:", name),
                     "ZIP_PATH_INVALID")
                pieces = name.rstrip("/").split("/") if directory else name.split("/")
                need(bool(pieces) and all(part not in ("", ".", "..") for part in pieces),
                     "ZIP_PATH_TRAVERSAL")
                need(all(len(part.encode("utf-8")) <= 255 for part in pieces), "ZIP_COMPONENT_CAP")
                need(len(name.encode("utf-8")) <= 4096, "ZIP_PATH_CAP")
                return pieces
            
            def inspect_zip(source_file, label, depth, parent_file=None):
                global TOTAL_EXPANDED, TOTAL_ENTRIES
                need(depth <= CAP["depth"] and len(ARCHIVES) < CAP["archives"], "NESTED_ZIP_CAP")
                archive_index = len(ARCHIVES)
                output_root = ROOT / "originals" / ("archive-" + str(archive_index).zfill(3))
                output_root.mkdir(mode=0o700)
                source_hasher = hashlib.sha256()
                source_size = 0
                with open(source_file, "rb") as original_zip:
                    while True:
                        block = original_zip.read(1024 * 1024)
                        if not block:
                            break
                        source_hasher.update(block)
                        source_size += len(block)
                archive = {"index": archive_index, "label": label, "depth": depth,
                           "sourcePath": str(pathlib.Path(source_file).relative_to(ROOT)),
                           "sourceBytes": source_size, "sourceSha256": source_hasher.hexdigest(),
                           "parentFile": parent_file, "entries": 0, "crcVerified": 0,
                           "expandedBytes": 0, "status": "STARTED"}
                ARCHIVES.append(archive)
                nested = []
                with zipfile.ZipFile(source_file, "r") as source:
                    entries = source.infolist()
                    need(len(entries) + TOTAL_ENTRIES <= CAP["entries"], "ZIP_ENTRY_COUNT_CAP")
                    seen = set()
                    for entry in entries:
                        name = entry.filename
                        need(entry.orig_filename == name, "ZIP_RAW_PATH_ALTERED")
                        directory = entry.is_dir()
                        pieces = path_parts(name, directory)
                        normalized = "/".join(pieces)
                        need(normalized not in seen, "ZIP_DUPLICATE_PATH")
                        seen.add(normalized)
                        kind = stat.S_IFMT(entry.external_attr >> 16)
                        need(kind in (0, stat.S_IFDIR if directory else stat.S_IFREG),
                             "ZIP_SPECIAL_FILE_OR_SYMLINK")
                        need((entry.flag_bits & 1) == 0, "ZIP_ENCRYPTED_ENTRY")
                        need(entry.compress_type in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED),
                             "ZIP_COMPRESSION_UNSUPPORTED")
                        need(0 <= entry.file_size <= CAP["entryBytes"], "ZIP_ENTRY_SIZE_CAP")
                        need(TOTAL_EXPANDED + entry.file_size <= CAP["expandedBytes"], "ZIP_EXPANDED_CAP")
                        destination = output_root.joinpath(*pieces)
                        need(output_root == destination.parent or output_root in destination.parents,
                             "ZIP_DESTINATION_ESCAPE")
                        TOTAL_ENTRIES += 1
                        file_id = len(FILES)
                        item = {
                            "id": file_id, "archive": archive_index, "path": name, "directory": directory,
                            "compressedBytes": entry.compress_size, "declaredBytes": entry.file_size,
                            "expectedCrc32": format(entry.CRC, "08x"),
                            "storedPath": str(destination.relative_to(ROOT)),
                        }
                        FILES.append(item)
                        if directory:
                            need(entry.file_size == 0 and entry.CRC == 0, "ZIP_DIRECTORY_PAYLOAD")
                            with source.open(entry, "r") as original:
                                need(original.read(1) == b"", "ZIP_DIRECTORY_PAYLOAD")
                            destination.mkdir(mode=0o700, parents=True, exist_ok=True)
                            item.update({"bytes": 0, "sha256": digest(b""), "crc32": "00000000", "crcVerified": True})
                        else:
                            destination.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
                            hasher = hashlib.sha256()
                            crc = 0
                            size = 0
                            # zipfile checks the local header and EOF CRC as well; calculate independently.
                            with source.open(entry, "r") as original, open(destination, "xb") as target:
                                while True:
                                    block = original.read(1024 * 1024)
                                    if not block:
                                        break
                                    size += len(block)
                                    TOTAL_EXPANDED += len(block)
                                    need(size <= entry.file_size and size <= CAP["entryBytes"]
                                         and TOTAL_EXPANDED <= CAP["expandedBytes"], "ZIP_ACTUAL_EXPANSION_CAP")
                                    target.write(block)
                                    hasher.update(block)
                                    crc = zlib.crc32(block, crc)
                            need(size == entry.file_size and (crc & 0xffffffff) == entry.CRC, "ZIP_CRC_OR_SIZE")
                            item.update({"bytes": size, "sha256": hasher.hexdigest(),
                                         "crc32": format(crc & 0xffffffff, "08x"), "crcVerified": True})
                            with open(destination, "rb") as header:
                                magic = header.read(4)
                            if name.lower().endswith(".zip") or magic in (b"PK\x03\x04", b"PK\x05\x06"):
                                nested.append((destination, "zip-entry", file_id))
                        archive["entries"] += 1
                        archive["crcVerified"] += 1
                        archive["expandedBytes"] += entry.file_size
                archive["status"] = "CRC_VERIFIED"
                for destination, nested_label, file_id in nested:
                    inspect_zip(destination, nested_label, depth + 1, file_id)
                return archive_index
            
            def read_file(item, limit):
                need(not item["directory"] and item["bytes"] <= limit, "PARSER_INPUT_CAP")
                data = (ROOT / item["storedPath"]).read_bytes()
                need(len(data) == item["bytes"] and digest(data) == item["sha256"], "EXTRACTED_FILE_CHANGED")
                return data
            
            def locate_suffix(suffix, outer_only=False):
                rows = [row for row in FILES if not row["directory"]
                        and (not outer_only or row["archive"] == 0)
                        and (row["path"] == suffix or row["path"].endswith("/" + suffix))]
                return rows
            
            def one_original_json(suffix):
                rows = locate_suffix(suffix, outer_only=True)
                need(len(rows) == 1, "ORIGINAL_JSON_CARDINALITY_" + suffix.replace(".", "_"))
                raw = read_file(rows[0], CAP["jsonBytes"])
                try:
                    data = json.loads(raw)
                except (ValueError, UnicodeError):
                    raise ReceiptFailure("ORIGINAL_JSON_PARSE") from None
                return rows[0], raw, data
            
            def strict_json(raw, code):
                def pairs(values):
                    out = {}
                    for key, value in values:
                        need(key not in out, code + "_DUPLICATE_KEY")
                        out[key] = value
                    return out
                def constant(_value):
                    raise ReceiptFailure(code + "_NONFINITE")
                try:
                    return json.loads(raw.decode("utf-8", errors="strict"), object_pairs_hook=pairs,
                                      parse_constant=constant)
                except (ValueError, UnicodeError):
                    raise ReceiptFailure(code + "_PARSE") from None
            
            def parse_normalized_request():
                rows = locate_suffix("test-ci-evidence/request.json", outer_only=True)
                need(len(rows) == 1, "NORMALIZED_REQUEST_CARDINALITY")
                item = rows[0]
                raw = read_file(item, CAP["normalizedRequestBytes"])
                wrapper = strict_json(raw, "NORMALIZED_REQUEST")
                need(isinstance(wrapper, dict) and set(wrapper) == {"request", "platform", "arch", "sha"},
                     "NORMALIZED_REQUEST_WRAPPER")
                need(wrapper["request"] == REQUEST_VALUE and wrapper["sha"] == SNAPSHOT
                     and wrapper["platform"] == EXPECTED_PLATFORM and wrapper["arch"] == EXPECTED_ARCH,
                     "NORMALIZED_REQUEST_BINDING")
                # workflow test-ci.yml writes this wrapper after validateRequest. Preserve the
                # received bytes, not a reconstruction of the normalized request or the source overlay.
                RECEIPT["parsers"]["normalizedRequest"] = {
                    "file": item["id"], "path": item["path"], "bytes": len(raw), "sha256": digest(raw),
                    "encoding": "base64", "original": True, "data": base64.b64encode(raw).decode("ascii"),
                    "request": wrapper["request"], "platform": wrapper["platform"], "arch": wrapper["arch"],
                    "sha": wrapper["sha"], "sourceRequestBlob": REQUEST_BLOB,
                    "sourceRequestSha256": REQUEST_SHA, "normalizationWriterPins": SOURCE_SELECTION_PINS[2:],
                    "meaning": "Literal normalized wrapper received from this artifact; sha binds executed S, not the helper source label.",
                }
                checked("normalized_request_literal_bytes_and_snapshot_binding")
            
            def marker_parity(name, lines):
                families = {"analytics": ANALYTICS_FAMILIES, "e6": (E6_FAMILY,),
                            "union": ANALYTICS_FAMILIES + (E6_FAMILY,)}[name]
                raw = (("\n".join(lines) + "\n") if lines else "").encode("utf-8")
                expected = PARITY_EXPECTATIONS[name]
                counts = {family: sum(line.startswith(family + " ") for line in lines) for family in families}
                same = len(raw) == expected["bytes"] and digest(raw) == expected["sha256"] and counts == expected["counts"]
                result = {"bytes": len(raw), "sha256": digest(raw), "lines": len(lines), "counts": counts,
                          "matchesOriginalMainSequence": same, "expected": expected,
                          "order": "case/result order, stdout then stderr; no chronological interleaving is inferred"}
                RECEIPT["parsers"].setdefault("markerParities", {})[name] = result
                need(same, "RUNTIME_ORIGINAL_" + name.upper() + "_PARITY")
                return result
            
            def unpack_html_reports():
                reports = locate_suffix("playwright-report/index.html", outer_only=True)
                if not reports:
                    pending("HTML_REPORT_ABSENT")
                    return
                parsed = []
                for item in reports:
                    raw = read_file(item, CAP["htmlBytes"])
                    text = raw.decode("utf-8")
                    # Read only the embedded archive string. No HTML/JavaScript is evaluated.
                    found = re.findall(r'data:application/zip;base64,([A-Za-z0-9+/=\r\n]+)', text)
                    if not found:
                        assignments = re.findall(r'playwrightReportBase64\s*=\s*["\x27]([A-Za-z0-9+/=\r\n]+)["\x27]', text)
                        found = assignments
                    need(len(found) <= 1, "HTML_REPORT_ARCHIVE_AMBIGUOUS")
                    if not found:
                        pending("HTML_REPORT_EMBEDDED_ARCHIVE_UNRECOGNIZED", {"file": item["id"]})
                        continue
                    encoded = re.sub(r"[\r\n]", "", found[0])
                    need(len(encoded) <= CAP["htmlBytes"], "HTML_REPORT_BASE64_CAP")
                    decoded = base64.b64decode(encoded, validate=True)
                    need(len(decoded) <= CAP["htmlBytes"] and decoded.startswith(b"PK"), "HTML_REPORT_ZIP")
                    filename = ROOT / "originals" / ("html-embedded-" + str(item["id"]) + ".zip")
                    write_bytes(filename, decoded)
                    nested_id = inspect_zip(filename, "html-report-embedded", 1, item["id"])
                    parsed.append({"htmlFile": item["id"], "zipBytes": len(decoded),
                                   "zipSha256": digest(decoded), "archive": nested_id})
                RECEIPT["parsers"]["htmlArchives"] = parsed
            
            def tests_from_report(report):
                tests = []
                visited = 0
                def visit(suite, trail, depth):
                    nonlocal visited
                    visited += 1
                    need(visited <= 10000 and depth <= 32 and isinstance(suite, dict), "REPORT_SUITE_CAP")
                    for spec in suite.get("specs", []):
                        need(isinstance(spec, dict), "REPORT_SPEC_SHAPE")
                        for test in spec.get("tests", []):
                            need(isinstance(test, dict), "REPORT_TEST_SHAPE")
                            tests.append((spec, test, trail))
                    for child in suite.get("suites", []):
                        visit(child, trail + [suite.get("title", "")], depth + 1)
                need(isinstance(report, dict) and isinstance(report.get("suites"), list), "REPORT_ROOT_SHAPE")
                for suite in report["suites"]:
                    visit(suite, [], 0)
                return tests
            
            def report_configuration(report, tests, label):
                config = report.get("config", {})
                need(isinstance(config, dict) and config.get("workers") == 1, label + "_WORKERS")
                projects = config.get("projects")
                need(isinstance(projects, list) and bool(projects), label + "_PROJECTS")
                selected = {test.get("projectId") or test.get("projectName") for _, test, _ in tests}
                checked_projects = []
                for project in projects:
                    if project.get("id") in selected or project.get("name") in selected or len(projects) == 1:
                        need(project.get("retries") == 0 and project.get("repeatEach") == 1,
                             label + "_RETRY_REPEAT")
                        need(project.get("id") in (None, "chromium") and project.get("name") == "chromium",
                             label + "_CHROMIUM_PROJECT")
                        checked_projects.append({"id": project.get("id"), "name": project.get("name"),
                                                 "retries": 0, "repeatEach": 1})
                need(bool(checked_projects), label + "_SELECTED_PROJECT")
                return {"workers": 1, "projects": checked_projects}
            
            def error_summary(errors):
                out = []
                for error in errors:
                    if not isinstance(error, dict):
                        continue
                    message = str(error.get("message", ""))
                    stack = str(error.get("stack", ""))
                    combined = message + "\n" + stack
                    position = re.search(r"design-wave-five-analytics\.spec\.ts:(\d+):(\d+)", combined)
                    out.append({
                        "timeout60000": bool(re.search(r"Timeout\s+60000ms|60000\s*ms", combined)),
                        "waitForResponse": "waitForResponse" in combined,
                        "source": {"file": "design-wave-five-analytics.spec.ts",
                                   "line": int(position.group(1)), "column": int(position.group(2))} if position else None,
                        "messageBytes": len(message.encode("utf-8")), "messageSha256": digest(message.encode("utf-8")),
                        "stackBytes": len(stack.encode("utf-8")), "stackSha256": digest(stack.encode("utf-8")),
                    })
                return out
            
            def marker_stream(results, case_ordinal):
                all_lines = []
                streams = []
                pattern = re.compile(r"^(?:\x1b\[[0-?]*[ -/]*[@-~])*"
                                     r"(SF_ANALYTICS_SOURCE|SF_ANALYTICS_CAPTURE|SF_DESIGN_DIAGNOSTICS|SF_ANALYTICS_SCOPE|SF_PREVIEW_E6) (.*)$")
                for result_ordinal, result in enumerate(results, 1):
                    for field in ("stdout", "stderr"):
                        chunks = []
                        size = 0
                        for chunk in result.get(field, []):
                            need(isinstance(chunk, dict), "RUNTIME_STDIO_CHUNK_SHAPE")
                            if isinstance(chunk.get("text"), str) and "buffer" not in chunk:
                                raw = chunk["text"].encode("utf-8")
                            elif isinstance(chunk.get("buffer"), str) and "text" not in chunk:
                                encoded = chunk["buffer"]
                                need(len(encoded) <= (CAP["jsonBytes"] * 4 // 3 + 4), "RUNTIME_STDIO_BASE64_CAP")
                                raw = base64.b64decode(encoded, validate=True)
                            else:
                                raise ReceiptFailure("RUNTIME_STDIO_CHUNK_ENCODING")
                            size += len(raw)
                            need(size <= CAP["jsonBytes"], "RUNTIME_STDIO_STREAM_CAP")
                            chunks.append(raw)
                        # Decode only after concatenating one stream: a chunk may split a UTF-8 character.
                        stream_raw = b"".join(chunks)
                        text = stream_raw.decode("utf-8", errors="strict")
                        lines = []
                        for line in text.splitlines():
                            match = pattern.match(line)
                            if match:
                                lines.append(match.group(1) + " " + match.group(2))
                        marker_raw = (("\n".join(lines) + "\n") if lines else "").encode("utf-8")
                        marker_path = ("derived/runtime-case-" + str(case_ordinal) + "-result-"
                                       + str(result_ordinal) + "-" + field + "-semantic-markers.lf.log")
                        write_bytes(ROOT / marker_path, marker_raw)
                        streams.append({"case": case_ordinal, "result": result_ordinal, "stream": field,
                                        "bytes": len(stream_raw), "sha256": digest(stream_raw),
                                        "markerBytes": len(marker_raw), "markerSha256": digest(marker_raw),
                                        "markerPath": marker_path, "markerLines": len(lines)})
                        all_lines.extend(lines)
                return {"lines": all_lines, "streams": streams}
            
            def parse_runtime_and_selection():
                selection_item, selection_raw, selection = one_original_json("playwright-selection.json")
                runtime_item, runtime_raw, runtime = one_original_json("playwright-runtime.json")
                selected = tests_from_report(selection)
                executed = tests_from_report(runtime)
                need(len(selected) == 2 and len(executed) == 2, "ORIGINAL_TWO_TESTS")
                need([spec.get("title") for spec, _, _ in selected] == TITLES
                     and [spec.get("title") for spec, _, _ in executed] == TITLES,
                     "ORIGINAL_TEST_TITLES_AND_ORDER")
                selection_config = report_configuration(selection, selected, "SELECTION")
                runtime_config = report_configuration(runtime, executed, "RUNTIME")
                cases = []
                markers = []
                for index, (spec, test, _) in enumerate(executed):
                    results = test.get("results")
                    need(isinstance(results, list) and len(results) == 1, "ORIGINAL_SINGLE_RESULT")
                    result = results[0]
                    need(result.get("retry", 0) == 0 and test.get("expectedStatus", "passed") == "passed",
                         "ORIGINAL_RESULT_ATTEMPT")
                    worker_index = result.get("workerIndex")
                    parallel_index = result.get("parallelIndex")
                    need(type(worker_index) is int and worker_index >= 0
                         and type(parallel_index) is int and parallel_index == 0,
                         "ORIGINAL_SINGLE_PARALLEL_WORKER")
                    status = result.get("status")
                    need(status in EXPECTED_RESULTS[index]["statuses"], "ORIGINAL_RESULT_VERDICT")
                    errors = result.get("errors", [])
                    if not errors and isinstance(result.get("error"), dict):
                        errors = [result["error"]]
                    captured = marker_stream(results, index + 1)
                    markers.extend(captured["lines"])
                    cases.append({
                        "title": TITLES[index], "status": status, "retry": 0,
                        "workerIndex": worker_index, "parallelIndex": result.get("parallelIndex"),
                        "stdioStreams": captured["streams"],
                        "durationMs": result.get("duration"), "startTime": result.get("startTime"),
                        "errors": error_summary(errors),
                        "attachmentCount": len(result.get("attachments", [])),
                    })
                for index, case in enumerate(cases):
                    required = EXPECTED_RESULTS[index]["requiredError"]
                    if required is not None:
                        need(any(all(error.get(key) == value for key, value in required.items())
                                 for error in case["errors"]), "ORIGINAL_REQUIRED_ERROR_BINDING")
                marker_raw = (("\n".join(markers) + "\n") if markers else "").encode("utf-8")
                write_bytes(ROOT / "derived" / "runtime-semantic-markers.lf.log", marker_raw)
                parity = marker_parity("union", markers)
                RECEIPT["parsers"]["selection"] = {
                    "file": selection_item["id"], "bytes": len(selection_raw), "sha256": digest(selection_raw),
                    "tests": 2, "titles": TITLES, "config": selection_config,
                }
                RECEIPT["parsers"]["runtime"] = {
                    "file": runtime_item["id"], "bytes": len(runtime_raw), "sha256": digest(runtime_raw),
                    "tests": 2, "config": runtime_config, "cases": cases,
                    "verdict": {"counts": {status: sum(case["status"] == status for case in cases)
                                           for status in ("passed", "failed", "timedOut", "skipped", "interrupted")},
                                "expectedResults": EXPECTED_RESULTS,
                                "meaning": "Actual statuses and bounded error fields only; no UI stage completion is inferred from status."},
                    "semanticMarkers": parity,
                }
                # Original JSON files are retained verbatim. No arbitrary report text is dumped to logs.
                RECEIPT["logExports"].extend([
                    {"file": selection_item["id"], "format": "original-json",
                     "status": "PENDING_ORIGINAL_JSON_LOG_EXPORT", "reason": "unclassified original strings retained in artifact"},
                    {"file": runtime_item["id"], "format": "original-json",
                     "status": "PENDING_ORIGINAL_JSON_LOG_EXPORT", "reason": "raw report retained in artifact; derived strict summary is logged"},
                ])
                checked("original_selection_runtime_and_bound_verdicts")
                return markers
            
            def ensure_inventory():
                if "inventory" not in RECEIPT:
                    inventory = {"schema": 1, "archives": ARCHIVES, "files": FILES}
                    RECEIPT["inventory"] = save_json("derived/inventory.json", inventory)
                return RECEIPT["inventory"]
            
            def wire_uint(value, maximum=999999999):
                return type(value) is int and 0 <= value <= maximum
            
            def wire_nullable_uint(value, maximum=999999999):
                return value is None or wire_uint(value, maximum)
            
            def validate_e6_line(line):
                raw = (line + "\n").encode("ascii", errors="strict")
                need(len(raw) <= 4096 and re.fullmatch(rb"[\x20-\x7e]*\n", raw) is not None,
                     "E6_ASCII_LINE_CAP")
                value = strict_json(raw[len(E6_FAMILY) + 1:-1], "E6")
                common = {"schema", "source", "sourceTree", "qualification", "pid", "sequence", "kind"}
                need(isinstance(value, dict) and common <= set(value), "E6_COMMON_SHAPE")
                need(value["schema"] == E6_SCHEMA and value["source"] == SOURCE
                     and value["sourceTree"] == SOURCE_TREE and value["qualification"] is False,
                     "E6_SOURCE_BINDING")
                need(wire_uint(value["pid"]) and wire_uint(value["sequence"], 8) and value["sequence"] >= 1,
                     "E6_PID_SEQUENCE_WIDTH")
                kind = value["kind"]
                if kind == "ready":
                    need(set(value) == common | set(E6_READY)
                         and canonical({key: value[key] for key in E6_READY}) == canonical(E6_READY),
                         "E6_READY_LEGEND")
                    return value
                need(isinstance(value.get("health"), list) and len(value["health"]) == 8
                     and all(wire_uint(number) for number in value["health"])
                     and type(value.get("suspended")) is bool, "E6_HEALTH_SHAPE")
                if kind == "observer-error":
                    need(set(value) == common | {"reason", "suspended", "health"}
                         and value["reason"] == "clock-unavailable" and value["suspended"] is True,
                         "E6_OBSERVER_ERROR_SHAPE")
                    return value
                need(value.get("request") == 1 and type(value.get("request")) is int
                     and wire_nullable_uint(value.get("utcMs"), 8640000000000000), "E6_REQUEST_CLOCK")
                if kind == "start":
                    need(set(value) == common | {"request", "utcMs", "monoTenthMs", "timer", "suspended", "health"}
                         and wire_uint(value["monoTenthMs"]) and wire_uint(value["timer"], 1),
                         "E6_START_SHAPE")
                    return value
                need(kind in ("checkpoint", "window", "final")
                     and set(value) == common | {"request", "utcMs", "elapsedTenthMs", "lateTenthMs",
                                                "slot", "skipped", "suspended", "rows", "events",
                                                "open", "openOmitted", "health"}, "E6_SNAPSHOT_SHAPE")
                need(wire_nullable_uint(value["elapsedTenthMs"]) and wire_nullable_uint(value["lateTenthMs"])
                     and wire_uint(value["slot"], 5) and wire_uint(value["skipped"])
                     and wire_uint(value["openOmitted"]), "E6_SNAPSHOT_WIDTHS")
                rows = value["rows"]
                need(isinstance(rows, list) and len(rows) <= 7, "E6_ROW_COUNT")
                metrics = []
                for row in rows:
                    need(isinstance(row, list) and len(row) == 8 and wire_uint(row[0], 6)
                         and all(wire_uint(row[index]) for index in (1, 2, 3))
                         and wire_nullable_uint(row[4]) and wire_nullable_uint(row[5])
                         and wire_nullable_uint(row[6]) and wire_uint(row[7], 31), "E6_ROW_WIDTHS")
                    if row[0] in (1, 2):
                        need(row[5] is None and row[6] is None, "E6_MARKED_READ_HAS_NO_ELAPSED")
                    metrics.append(row[0])
                need(len(set(metrics)) == len(metrics), "E6_ROW_IDENTIFIERS")
                need(isinstance(value["events"], list) and len(value["events"]) == 24
                     and all(wire_uint(number) for number in value["events"]), "E6_EVENT_WIDTHS")
                need(isinstance(value["open"], list) and len(value["open"]) <= 16, "E6_OPEN_CAP")
                for opened in value["open"]:
                    need(isinstance(opened, list) and len(opened) == 8
                         and wire_uint(opened[0]) and opened[0] >= 1
                         and type(opened[1]) is int and opened[1] in (1, 2)
                         and type(opened[2]) is int and opened[2] in (1, 2)
                         and wire_uint(opened[3])
                         and type(opened[4]) is int and opened[4] in (1, 2)
                         and wire_uint(opened[5], 3)
                         and wire_uint(opened[6], 3 if opened[1] == 1 else 5)
                         and wire_nullable_uint(opened[7]), "E6_OPEN_WIDTHS")
                # Deliberately no health==0, settled==calls, final-required, timer-success,
                # contiguous sequence, PID cardinality or causal/temporal assertion here.
                return value
            
            def parse_e6_lines(markers):
                analytics = [line for line in markers if not line.startswith(E6_FAMILY + " ")]
                e6_lines = [line for line in markers if line.startswith(E6_FAMILY + " ")]
                analytics_parity = marker_parity("analytics", analytics)
                e6_parity = marker_parity("e6", e6_lines)
                streams = []
                reconstructed = []
                observed = []
                for case_ordinal, case in enumerate(RECEIPT["parsers"]["runtime"]["cases"], 1):
                    for source in case["stdioStreams"]:
                        marker_raw = (ROOT / source["markerPath"]).read_bytes()
                        need(len(marker_raw) == source["markerBytes"] and digest(marker_raw) == source["markerSha256"],
                             "E6_DERIVED_STREAM_CHANGED")
                        stream_lines = marker_raw.decode("utf-8", errors="strict").splitlines()
                        need(len(stream_lines) == source["markerLines"], "E6_DERIVED_STREAM_COUNT")
                        records = []
                        selected = []
                        for marker_ordinal, line in enumerate(stream_lines, 1):
                            if not line.startswith(E6_FAMILY + " "):
                                continue
                            value = validate_e6_line(line)
                            literal = line + "\n"
                            records.append({"markerOrdinal": marker_ordinal, "line": literal})
                            selected.append(line)
                            reconstructed.append(line)
                            item = {"case": case_ordinal, "result": source["result"], "stream": source["stream"],
                                    "markerOrdinal": marker_ordinal, "pid": value["pid"],
                                    "sequence": value["sequence"], "kind": value["kind"]}
                            if "health" in value:
                                item["health"] = value["health"]
                                item["suspended"] = value["suspended"]
                                item["overflowRows"] = [row[0] for row in value.get("rows", []) if row[7] != 0]
                            observed.append(item)
                        raw = (("\n".join(selected) + "\n") if selected else "").encode("ascii")
                        streams.append({
                            "case": case_ordinal, "title": case["title"], "result": source["result"],
                            "stream": source["stream"], "sourceBytes": source["bytes"],
                            "sourceSha256": source["sha256"], "unionBytes": source["markerBytes"],
                            "unionSha256": source["markerSha256"], "unionLines": source["markerLines"],
                            "e6Bytes": len(raw), "e6Sha256": digest(raw), "e6Lines": len(records), "records": records,
                        })
                need(reconstructed == e6_lines, "E6_STREAM_SEQUENCE_BINDING")
                summary = {
                    "schema": E6_SCHEMA, "source": SOURCE, "sourceTree": SOURCE_TREE,
                    "snapshot": SNAPSHOT, "snapshotTree": SNAPSHOT_TREE,
                    "records": len(observed), "streams": len(streams), "observed": observed,
                    "analyticsParity": analytics_parity, "e6Parity": e6_parity,
                    "unionParity": RECEIPT["parsers"]["markerParities"]["union"],
                    "meaning": "Each record is located in an actual case/result/stdio stream. PID alone is not a cross-stream or cross-case identity. Sequence gaps and negative health remain evidence, not successful coverage.",
                }
                RECEIPT["parsers"]["e6"] = summary
                ledger = {
                    "schema": 1, "kind": "e6-original-runtime-lines", "qualification": False,
                    "source": SOURCE, "sourceTree": SOURCE_TREE, "snapshot": SNAPSHOT, "snapshotTree": SNAPSHOT_TREE,
                    "run": ORIGINAL_RUN, "attempt": ORIGINAL_ATTEMPT,
                    "runtime": {key: RECEIPT["parsers"]["runtime"][key] for key in ("file", "bytes", "sha256")},
                    "parities": RECEIPT["parsers"]["markerParities"], "streams": streams,
                    "limits": [
                        "Only the SF_PREVIEW_E6 lines are copied verbatim, with their LF, from normalized runtime streams; original runtime stdout/stderr hashes identify the surrounding bytes.",
                        "Analytics, E6 and union parity are separate mandatory matches to the original main sequence; stdio streams have no inferred interleaving.",
                        "No zero-health, successful timer, complete final, healthy pending, unique PID or case outcome is assumed. Absence of E6 is exported as absence when the bound originals also contain none.",
                        "The helper source labels C9r1; executed S is bound separately by Git overlays, API metadata and literal normalized request.json.sha.",
                    ],
                }
                raw = canonical(ledger)
                need(len(raw) <= CORE_CAP["e6"], "E6_LEDGER_RAW_CAP")
                write_bytes(ROOT / "derived" / "e6-lines.json", raw)
                checked("e6_original_lines_per_runtime_stream_and_separate_parities")
                return raw
            
            def prepare_core_export(key, name, raw, mime, original):
                need(key in CORE_CAP and isinstance(raw, bytes) and 0 < len(raw) <= CORE_CAP[key],
                     "CORE_RAW_CAP_" + key)
                encoded = base64.b64encode(raw).decode("ascii")
                pieces = [encoded[i:i + CAP["chunkBytes"]] for i in range(0, len(encoded), CAP["chunkBytes"])]
                metadata = {"name": name, "bytes": len(raw), "sha256": digest(raw), "mime": mime,
                            "original": original, "encoding": "base64", "chunks": len(pieces)}
                lines = []
                for index, piece in enumerate(pieces, 1):
                    envelope = {"schema": 1, **metadata, "index": index}
                    # Bound all metadata plus empty data and transport prefix/LF, not just one field.
                    need(len(wire_line("SF613_ARTIFACT_BYTES", {**envelope, "data": ""})) <= 1024,
                         "CORE_CHUNK_METADATA_CAP")
                    need(0 < len(piece) <= CAP["chunkBytes"], "CORE_BASE64_CHUNK_CAP")
                    lines.append(wire_line("SF613_ARTIFACT_BYTES", {**envelope, "data": piece}))
                return {"key": key, "metadata": metadata, "lines": lines}
            
            def finalize_core(e6_raw):
                global CORE_LINES_WRITTEN
                inventory = ensure_inventory()
                inventory_raw = (ROOT / inventory["path"]).read_bytes()
                need(len(inventory_raw) == inventory["bytes"] and digest(inventory_raw) == inventory["sha256"],
                     "INVENTORY_BYTES_CHANGED")
                RECEIPT["apiReads"] = API_COUNT
                RECEIPT["archiveSummary"] = {
                    "archives": len(ARCHIVES), "entries": TOTAL_ENTRIES,
                    "crcVerified": sum(1 for row in FILES if row.get("crcVerified")),
                    "expandedBytes": TOTAL_EXPANDED,
                    "allEntriesVerified": bool(FILES) and all(row.get("crcVerified") is True for row in FILES),
                }
                need(RECEIPT["archiveSummary"]["allEntriesVerified"] is True and not RECEIPT["failures"],
                     "CORE_REQUIRED_VALIDATION_FAILURE")
                summary = canonical({
                    "schema": 1, "kind": "e6-original-core-summary", "qualification": False,
                    "source": SOURCE, "sourceTree": SOURCE_TREE, "snapshot": SNAPSHOT, "snapshotTree": SNAPSHOT_TREE,
                    "run": ORIGINAL_RUN, "attempt": ORIGINAL_ATTEMPT, "artifact": RECEIPT["artifact"],
                    "selection": RECEIPT["parsers"]["selection"], "runtime": RECEIPT["parsers"]["runtime"],
                    "normalizedRequest": RECEIPT["parsers"]["normalizedRequest"],
                    "e6": RECEIPT["parsers"]["e6"], "markerParities": RECEIPT["parsers"]["markerParities"],
                    "htmlArchives": RECEIPT["parsers"].get("htmlArchives", []),
                    "archiveSummary": RECEIPT["archiveSummary"], "limits": RECEIPT["limits"],
                })
                write_bytes(ROOT / "derived" / "safe-summary.json", summary)
                first_three = [
                    ("summary", "safe-summary.json", summary, "application/json", False),
                    ("e6", "e6-lines.json", e6_raw, "application/json", False),
                    ("inventory", "inventory.json", inventory_raw, "application/json", False),
                ]
                prepared = [prepare_core_export(*item) for item in first_three]
                RECEIPT["coreEmission"] = {
                    "state": "PLANNED_REQUIRES_SUCCESS_TERMINAL",
                    "order": [item["metadata"]["name"] for item in prepared] + ["receipt.json"],
                    "firstThree": [item["metadata"] for item in prepared],
                    "rawCaps": CORE_CAP, "beforeBytes": LOG_BYTES,
                    "exactPreflight": "All four immutable payloads and the terminal are encoded and jointly checked after this receipt is frozen, before the first core chunk.",
                    "completion": "Only the later SF613_ARTIFACT_RECEIPT terminal, every complete hash-verified export and a successful reader job attest complete transport.",
                    "selfReference": "This receipt has no own hash. Its original bytes/hash are attested by the terminal.",
                }
                RECEIPT["readerExitCodePlanned"] = 0
                # Freeze once. No later mutation of this object can alter exported receipt_raw.
                receipt_raw = canonical(RECEIPT)
                prepared.append(prepare_core_export("receipt", "receipt.json", receipt_raw, "application/json", False))
                need([item["key"] for item in prepared] ==
                     ["summary", "e6", "inventory", "receipt"], "CORE_EXACT_FOUR_EXPORTS")
                core_lines = tuple(line for item in prepared for line in item["lines"])
                core_bytes = sum(len(line) for line in core_lines)
                before_bytes = LOG_BYTES
                final = {
                    "schema": 1, "kind": "e6-core-terminal", "qualification": False,
                    "status": "ORIGINAL_BYTES_VERIFIED", "coreBytesComplete": True, "receiptBase64Complete": True,
                    "coreFiles": 4, "coreChunks": len(core_lines),
                    "corePayloadBytes": sum(item["metadata"]["bytes"] for item in prepared),
                    "coreLogBytes": core_bytes, "logBytesBeforeCore": before_bytes,
                    "logBytesBeforeTerminal": before_bytes + core_bytes,
                    "emitterCapBytes": CAP["logBytes"], "mainLogReviewCapBytes": CAP["mainLogReviewCapBytes"],
                    "receiptBytes": len(receipt_raw), "receiptSha256": digest(receipt_raw),
                    "exports": [item["metadata"] for item in prepared],
                    "entries": TOTAL_ENTRIES, "crcVerified": RECEIPT["archiveSummary"]["crcVerified"],
                    "expandedBytes": TOTAL_EXPANDED, "pending": len(RECEIPT["pending"]),
                    "failures": [], "readerExitCode": 0,
                }
                terminal_raw = wire_line("SF613_ARTIFACT_RECEIPT", final)
                total_bytes = before_bytes + core_bytes + len(terminal_raw)
                need(total_bytes <= CAP["logBytes"], "CORE_JOINT_LOG_BUDGET")
                plan = {"schema": 1, "coreFiles": 4, "coreChunks": len(core_lines),
                        "beforeBytes": before_bytes, "coreLogBytes": core_bytes,
                        "terminalBytes": len(terminal_raw), "totalEmitterBytes": total_bytes,
                        "capBytes": CAP["logBytes"], "mainLogReviewCapBytes": CAP["mainLogReviewCapBytes"],
                        "terminalSha256": digest(terminal_raw), "exports": final["exports"]}
                # Disk preservation also completes before any core line can be emitted.
                write_bytes(ROOT / "receipt.json", receipt_raw)
                save_json("derived/core-emission-plan.json", plan)
                for raw in core_lines:
                    write_wire(raw)
                    CORE_LINES_WRITTEN += 1
                need(LOG_BYTES == before_bytes + core_bytes and CORE_LINES_WRITTEN == len(core_lines),
                     "CORE_EMITTED_COUNT_MISMATCH")
                write_wire(terminal_raw)
                need(LOG_BYTES == total_bytes, "CORE_FINAL_EMITTED_BYTES_MISMATCH")
            
            def report_failure(code, error_type=None):
                # No exception text/traceback: it could contain a signed URL. Never emit a success terminal here.
                failure = {"code": code}
                if error_type is not None:
                    failure["type"] = error_type
                RECEIPT["status"] = "RECEIPT_FAILED"
                RECEIPT["failures"].append(failure)
                RECEIPT["readerExitCode"] = 1
                RECEIPT["apiReads"] = API_COUNT
                receipt_meta = None
                try:
                    failure_raw = canonical(RECEIPT)
                    if len(failure_raw) <= CORE_CAP["receipt"]:
                        write_bytes(ROOT / "failure-receipt.json", failure_raw)
                        receipt_meta = {"bytes": len(failure_raw), "sha256": digest(failure_raw)}
                except Exception:
                    pass
                terminal = {
                    "schema": 1, "kind": "e6-core-terminal", "qualification": False, "status": "RECEIPT_FAILED",
                    "coreBytesComplete": False, "receiptBase64Complete": False, "readerExitCode": 1,
                    "coreChunksWritten": CORE_LINES_WRITTEN, "logBytesBeforeTerminal": LOG_BYTES,
                    "failures": [failure], "failureReceipt": receipt_meta,
                    "limit": "No complete core is accepted without all four exports, success terminal and successful job.",
                }
                try:
                    write_wire(wire_line("SF613_ARTIFACT_RECEIPT", terminal))
                except Exception:
                    # A broken stdout may prevent even a failure terminal; process exit remains nonzero.
                    pass
            
            def main():
                check_original_and_reader()
                download_original()
                inspect_zip(ROOT / "original.zip", "original-artifact", 0)
                unpack_html_reports()
                checked("all_discovered_zip_entries_crc_sha256_and_safe_paths")
                parse_normalized_request()
                markers = parse_runtime_and_selection()
                e6_raw = parse_e6_lines(markers)
                RECEIPT["status"] = "ORIGINAL_BYTES_VERIFIED"
                RECEIPT["qualification"] = False
                RECEIPT["limits"] = [
                    "This reader acquires the one bound original artifact once, has no checkout and executes no repository product, tests, observers or samplers.",
                    "C9r1 source labels, executed diagnostic S/Ts and reader D are separate identities. Source API checks and nine exact overlays bind S; normalized request.json.sha must equal S.",
                    "Four core exports are jointly mandatory: safe runtime/selection plus literal normalized request, E6 original lines by runtime stream, complete inventory/CRCs and receipt. PNG, CPU and trace analysis/export are omitted, never their inventory entries.",
                    "Analytics, E6 and union parities are separate exact matches to the preserved original main. A reader success does not qualify either original case or the candidate.",
                    "Case statuses, error fields, PIDs, sequence gaps, suspended flags, health, pending rows and missing records are evidence. No healthy observation or final record is assumed.",
                    "E6 calls begin at the post-selector mark; native preparations are inclusive pre-body Dashboard intervals only. Counts are not SQL/CPU counts, elapsed totals are not additive, and open rows are partial.",
                    "No chronology is inferred across stdio streams or clocks. PID is scoped to the recorded case/result/stream and is not proof of shared Request across unrelated records.",
                    "Raw normalized request bytes are exported inside safe-summary only after validating the known wrapper/selection. Raw runtime/selection JSON and all original entries remain in the receipt artifact; arbitrary error text and secrets are not printed.",
                    "The 1.5 MiB emitter cap is checked on exact encoded bytes; complete captured Actions main must separately fit 2 MiB. Neither cap asserts a future artifact fits.",
                    "Receipt transport is complete only with four full hash-verified exports, matching success terminal and successful reader job. Failed or truncated transport supplies no complete core.",
                ]
                finalize_core(e6_raw)
            
            exit_code = 0
            try:
                main()
            except ReceiptFailure as error:
                exit_code = 1
                report_failure(error.code)
            except Exception as error:
                exit_code = 1
                report_failure("UNEXPECTED_READER_ERROR", type(error).__name__)
            sys.exit(exit_code)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          
          raw = os.environ.pop("SF613_ARTIFACT_READER_SOURCE").encode("utf-8")
          expected = os.environ.pop("SF613_ARTIFACT_READER_SHA256")
          if hashlib.sha256(raw).hexdigest() != expected:
              raise RuntimeError("READER_SOURCE_SHA256_MISMATCH")
          target = pathlib.Path(os.environ["RUNNER_TEMP"]).resolve() / "sf613-artifact-reader.py"
          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          if target == workspace or workspace in target.parents:
              raise RuntimeError("READER_SOURCE_MUST_BE_OUTSIDE_WORKSPACE")
          with target.open("xb") as handle:
              handle.write(raw)
          exec(compile(raw, str(target), "exec"),
               {"__name__": "__main__", "__file__": str(target)})
          PY

      - name: Preserve original bytes and receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, same pin as original producer
        with:
          name: sf613-analytics-original-45862446570-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sf613-artifact-read
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
