                    "crcVerified": sum(1 for row in FILES if row.get("crcVerified")),
                    "expandedBytes": TOTAL_EXPANDED,
                    "allEntriesVerified": bool(FILES) and all(row.get("crcVerified") is True for row in FILES),
                }
                ensure_inventory()
                RECEIPT["readerExitCode"] = exit_code
                RECEIPT["logBytesBeforeFinalReceipt"] = LOG_BYTES
                receipt_raw = canonical(RECEIPT)
                write_bytes(ROOT / "receipt.json", receipt_raw)
                receipt_emitted = log_bytes_payload("receipt.json", receipt_raw, "application/json",
                                                   False, reserve=4096, record=False)
                final = {"schema": 1, "qualification": False, "status": RECEIPT["status"],
                         "receiptBase64Complete": receipt_emitted,
                         "receiptBytes": len(receipt_raw), "receiptSha256": digest(receipt_raw),
                         "entries": TOTAL_ENTRIES, "crcVerified": RECEIPT["archiveSummary"]["crcVerified"],
                         "expandedBytes": TOTAL_EXPANDED, "pending": len(RECEIPT["pending"]),
                         "failures": RECEIPT["failures"], "readerExitCode": exit_code}
                need(emit("SF613_ARTIFACT_RECEIPT", final), "FINAL_RECEIPT_LOG_CAP")
            sys.exit(exit_code)
        shell: bash
        run: |
          set -euo pipefail
