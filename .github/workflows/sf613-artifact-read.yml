                RECEIPT["status"] = "ORIGINAL_BYTES_VERIFIED"
                RECEIPT["qualification"] = False
                RECEIPT["limits"] = [
                    "This job receives existing evidence only; it has no checkout and executes no repository product, tests or observers.",
                    "The original execution used snapshot A with one original request overlay over source C14 S. No literal-S execution, performance qualification or final candidate qualification is inferred.",
                    "UI42 failed at the first 60 s waiter; UI43/UI44 were not reached; case2 failed in localized BI06 acquisition. No cancellation cause is inferred.",
                    "Pending exports or unsupported structures remain explicit; an artifact hash does not manufacture missing evidence.",
                    "No credentials, headers, cookies, full signed URL, request/response body or raw error message is emitted by this reader.",
                ]
            
            exit_code = 0
            try:
