                exit_code = 1
                RECEIPT["status"] = "RECEIPT_FAILED"
                RECEIPT["failures"].append({"code": error.code})
            except Exception as error:
                exit_code = 1
                RECEIPT["status"] = "RECEIPT_FAILED"
                # Exception text/traceback can contain a signed URL; emit only the class.
                RECEIPT["failures"].append({"code": "UNEXPECTED_READER_ERROR", "type": type(error).__name__})
