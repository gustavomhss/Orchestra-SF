                    raw = read_file(FILES[png["file"]], CAP["entryBytes"])
                    log_bytes_payload("original-png-" + str(png["file"]) + ".png", raw, "image/png", True)
            
            def main():
                check_original_and_reader()
                download_original()
                inspect_zip(ROOT / "original.zip", "original-artifact", 0)
                unpack_html_reports()
                checked("all_discovered_zip_entries_crc_sha256_and_safe_paths")
