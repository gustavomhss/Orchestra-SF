                main = next(j for j in jobs if j["id"] == MAIN_JOB)
                need(any(step.get("name") == "Run tests" and step.get("conclusion") == TEST_STEP_CONCLUSION
                         for step in main.get("steps", [])), "ORIGINAL_TEST_STEP")
                artifact = api("/actions/artifacts/" + str(ARTIFACT_ID), "original-artifact")
                listed = pages("/actions/runs/" + str(ORIGINAL_RUN) + "/artifacts", "artifacts", "original-artifacts")
                matches = [a for a in listed if a.get("id") == ARTIFACT_ID]
                need(len(matches) == 1, "ARTIFACT_RUN_MEMBERSHIP")
                for data in [artifact, matches[0]]:
                    need(data.get("id") == ARTIFACT_ID and data.get("name") == ARTIFACT_NAME
                         and data.get("size_in_bytes") == ARTIFACT_BYTES
                         and data.get("digest") == "sha256:" + ARTIFACT_SHA
                         and data.get("expired") is False, "ARTIFACT_METADATA_BINDING")
                    binding = data.get("workflow_run", {})
                    need(binding.get("id") == ORIGINAL_RUN and binding.get("head_sha") == SNAPSHOT,
