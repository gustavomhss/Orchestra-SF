name: g08-proof-provenance

on:
  push:
    branches: ["g08-proof-source"]
    paths:
      - "script/sf-ci/g08-proof-provenance.mjs"
      - "script/sf-ci/g08-proof-provenance.test.mjs"
      - ".github/workflows/g08-proof-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: g08-proof-controls-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controls:
    if: github.repository == 'gustavomhss/Orchestra-SF' && github.repository_id == '1455724710'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ORCHESTRA_OMNI_CONTROL: declared
      ORCHESTRA_EXPERIMENTAL_OMNI_SPAWNER: strict
      ORCHESTRA_CHANNEL: prod
      GH_TOKEN: ""
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15"
      - name: Bind the three source paths and hosted control output
        run: |
          set -euo pipefail
          umask 077
          proof_output="$RUNNER_TEMP/g08-proof-controls-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          zip_fixture_root="$RUNNER_TEMP/g08-proof-zips-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$proof_output" "$zip_fixture_root"
          printf 'SF_G08_PROVENANCE_EVIDENCE=%s\n' "$proof_output" >> "$GITHUB_ENV"
          printf 'SF_G08_PROVENANCE_ZIPS=%s\n' "$zip_fixture_root" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD > "$proof_output/source.sha"
          git rev-parse 'HEAD^{tree}' > "$proof_output/source.tree"
          git rev-parse origin/dev > "$proof_output/guard-base.sha"
          git diff --name-only origin/dev...HEAD > "$proof_output/changed-paths.txt"
          git diff --check origin/dev...HEAD
      - uses: ./.github/actions/setup-bun
        id: install
        with:
          reuse-node: "true"
      - name: Prepare the original Omni control
        uses: ./.github/actions/omni-binaries
      - name: Generate independent ZIP fixtures with the Python standard library
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, json, os, pathlib, zipfile, zlib
          root = pathlib.Path(os.environ["SF_G08_PROVENANCE_ZIPS"])
          receipt = (json.dumps({"schema":"sf-g08-zip-control-v1","source":"standard-library-control","installed":False}, separators=(",",":")) + "\n").encode()
          (root / "receipt.raw").write_bytes(receipt)
          (root / "receipt.json").write_bytes(receipt)
          (root / "fixture-manifest.json").write_text(json.dumps({"receiptCrc32":format(zlib.crc32(receipt) & 0xffffffff,"08x")}) + "\n")
          class Streaming(io.BytesIO):
              def seekable(self): return False
              def seek(self, *args): raise io.UnsupportedOperation("streaming-control")
          for name, method, stream in [("stored",zipfile.ZIP_STORED,False),("deflated",zipfile.ZIP_DEFLATED,False),("streamed",zipfile.ZIP_DEFLATED,True)]:
              output = Streaming() if stream else io.BytesIO()
              with zipfile.ZipFile(output,"w",compression=method) as archive:
                  archive.writestr("receipt.json",receipt)
              (root / (name + ".zip")).write_bytes(output.getvalue())
          for name, member, mode, second, zip64 in [
              ("two-files","receipt.json",0o100600,True,False),
              ("wrong-path","../receipt.json",0o100600,False,False),
              ("symlink","receipt.json",0o120777,False,False),
              ("zip64","receipt.json",0o100600,False,True),
          ]:
              output = io.BytesIO()
              with zipfile.ZipFile(output,"w",compression=zipfile.ZIP_DEFLATED) as archive:
                  entry = zipfile.ZipInfo(member); entry.create_system = 3; entry.external_attr = mode << 16
                  with archive.open(entry,"w",force_zip64=zip64) as writer: writer.write(receipt)
                  if second: archive.writestr("extra.json",b"{}")
              (root / (name + ".zip")).write_bytes(output.getvalue())
          PY
      - name: Exercise original parsers, authority refusals and completed producer controls
        run: |
          set -euo pipefail
          export ORCHESTRA_OMNI_CONTROL_NONCE="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(16).toString("hex"))')"
          printf '%s\n' "$ORCHESTRA_OMNI_CONTROL_NONCE" > "$SF_G08_PROVENANCE_EVIDENCE/omni-nonce.txt"
          bun test --preload ./script/test-guard.ts --preload ./script/test-omni-control.ts --reporter=junit --reporter-outfile "$SF_G08_PROVENANCE_EVIDENCE/controls.junit.xml" ./script/sf-ci/g08-proof-provenance.test.mjs 2>&1 | tee "$SF_G08_PROVENANCE_EVIDENCE/controls.log"
      - name: Check all original guards
        run: |
          set -euo pipefail
          bun run check:guards --base origin/dev 2>&1 | tee "$SF_G08_PROVENANCE_EVIDENCE/guards.log"
      - name: Publish the synthetic one-file control through the original GitHub artifact service
        id: zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g08-provenance-zip-control-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.SF_G08_PROVENANCE_ZIPS }}/receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify the actual GitHub ZIP format without claiming producer qualification
        env:
          GH_TOKEN: ${{ github.token }}
          SF_G08_ZIP_ID: ${{ steps.zip.outputs.artifact-id }}
          SF_G08_ZIP_DIGEST: ${{ steps.zip.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from "node:assert/strict"
          import { readFile, writeFile } from "node:fs/promises"
          import { verifyReceiptArchive, repository, repositoryId } from "./script/sf-ci/g08-proof-provenance.mjs"
          try {
            const id = process.env.SF_G08_ZIP_ID
            assert(/^[1-9][0-9]*$/.test(id), "CONTROL_ARTIFACT_ID_REQUIRED")
            const url = "https://api.github.com/repos/" + repository + "/actions/artifacts/" + id
            const headers = { Accept:"application/vnd.github+json", Authorization:"Bearer " + process.env.GH_TOKEN, "X-GitHub-Api-Version":"2022-11-28" }
            const metadataResponse = await fetch(url, { headers, redirect:"error", signal:AbortSignal.timeout(30000) })
            assert.equal(metadataResponse.status,200)
            const metadata = await metadataResponse.json()
            assert.equal(String(metadata.id),id)
            assert.equal(String(metadata.workflow_run.id),process.env.GITHUB_RUN_ID)
            assert.equal(String(metadata.workflow_run.repository_id),repositoryId)
            assert.equal(metadata.workflow_run.head_sha,process.env.GITHUB_SHA)
            assert.equal(metadata.digest,"sha256:" + process.env.SF_G08_ZIP_DIGEST)
            assert(metadata.size_in_bytes > 0 && metadata.size_in_bytes <= 2 * 1024 * 1024)
            const redirected = await fetch(url + "/zip", { headers, redirect:"manual", signal:AbortSignal.timeout(30000) })
            assert.equal(redirected.status,302)
            const storage = new URL(redirected.headers.get("location"))
            assert(storage.protocol === "https:" && !storage.username && !storage.password && !storage.hash &&
              (storage.hostname.endsWith(".blob.core.windows.net") || storage.hostname.endsWith(".actions.githubusercontent.com") ||
              storage.hostname.endsWith(".githubusercontent.com") || storage.hostname.endsWith(".s3.amazonaws.com") ||
              /^[a-z0-9.-]+\.s3\.[a-z0-9-]+\.amazonaws\.com$/.test(storage.hostname)))
            const download = await fetch(storage, { redirect:"error", signal:AbortSignal.timeout(60000) })
            assert.equal(download.status,200)
            let count=0; const chunks=[]
            for await (const chunk of download.body) { count+=chunk.length; assert(count<=metadata.size_in_bytes); chunks.push(Buffer.from(chunk)) }
            const receipt = await readFile(process.env.SF_G08_PROVENANCE_ZIPS + "/receipt.raw")
            const result = verifyReceiptArchive(Buffer.concat(chunks),receipt,{zipBytes:metadata.size_in_bytes,zipSha256:process.env.SF_G08_ZIP_DIGEST})
            await writeFile(process.env.SF_G08_PROVENANCE_EVIDENCE + "/zip-roundtrip.json", JSON.stringify({
              schema:"sf-g08-original-zip-control-v1",class:"CONTROL_ARTIFACT_BYTES_ONLY",artifactId:id,
              source:process.env.GITHUB_SHA,...result,installed:false,liveQualified:false,g08Closed:false
            }) + "\n", {flag:"wx",mode:0o600})
          } catch { throw new Error("G08_ORIGINAL_GITHUB_ZIP_CONTROL_FAILED") }
          JS
      - name: Require the exact control inventory and preserve the source receipt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, xml.etree.ElementTree as ET
          root=pathlib.Path.cwd(); output=pathlib.Path(os.environ["SF_G08_PROVENANCE_EVIDENCE"])
          report=(output/"controls.junit.xml").read_bytes(); tree=ET.fromstring(report)
          cases=tree.findall(".//testcase")
          if len(cases)!=125 or len({case.attrib.get("name") for case in cases})!=125 or any(case.find(tag) is not None for case in cases for tag in ["failure","error","skipped"]):
              raise SystemExit("G08_PROVENANCE_EXACT_125_PASS_REQUIRED")
          nonce=(output/"omni-nonce.txt").read_text().strip(); log=(output/"controls.log").read_text()
          if not re.fullmatch("[0-9a-f]{32}",nonce) or len(re.findall(r"omni positive control \["+nonce+r"\]: not applicable",log))!=1:
              raise SystemExit("G08_PROVENANCE_ORIGINAL_OMNI_CONTROL_REQUIRED")
          paths=["script/sf-ci/g08-proof-provenance.mjs","script/sf-ci/g08-proof-provenance.test.mjs",".github/workflows/g08-proof-provenance.yml"]
          if sorted((output/"changed-paths.txt").read_text().splitlines())!=sorted(paths):
              raise SystemExit("G08_PROVENANCE_EXCLUSIVE_PATH_INVENTORY_REQUIRED")
          roundtrip=json.loads((output/"zip-roundtrip.json").read_bytes())
          if roundtrip["class"]!="CONTROL_ARTIFACT_BYTES_ONLY" or roundtrip["source"]!=os.environ["GITHUB_SHA"] or roundtrip["installed"] or roundtrip["g08Closed"]:
              raise SystemExit("G08_PROVENANCE_ORIGINAL_ZIP_CONTROL_REQUIRED")
          receipt={"schema":"sf-g08-provenance-controls-v1","status":"CONTROLS_VERIFIED",
              "source":{"sha":(output/"source.sha").read_text().strip(),"tree":(output/"source.tree").read_text().strip()},
              "run":{"id":os.environ["GITHUB_RUN_ID"],"attempt":os.environ["GITHUB_RUN_ATTEMPT"],"workflowSha":os.environ["GITHUB_WORKFLOW_SHA"]},
              "controls":{"bun":125,"failures":0,"skips":0},"junitSha256":hashlib.sha256(report).hexdigest(),
              "sources":[{"path":name,"sha256":hashlib.sha256((root/name).read_bytes()).hexdigest()} for name in paths],
              "guardBase":(output/"guard-base.sha").read_text().strip(),"zipRoundtrip":roundtrip,
              "omni":"DECLARED_NOT_APPLICABLE_NO_SPAWNS","installed":False,"liveQualified":False,"g08Closed":False,"productionCutover":False}
          (output/"receipt.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps({"source":receipt["source"],"controls":receipt["controls"],"junitSha256":receipt["junitSha256"],"installed":False,"g08Closed":False}))
          PY
      - name: Preserve only controlled public evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g08-proof-controls-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.SF_G08_PROVENANCE_EVIDENCE }}/
          if-no-files-found: error
          retention-days: 14
