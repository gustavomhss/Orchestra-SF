name: sf-c12-seed-original-log
on:
  push:
    branches: [audit-c12-seed6-20261119]
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read completed C12 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --allow-escape-sequences repos/gustavomhss/Orchestra-SF/actions/artifacts/14578240289/zip > "$RUNNER_TEMP/c12.zip"
      - name: Extract bounded original seed error
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, re, zipfile
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          output = ["# C12 native6 original seed diagnostic", "", "Run 44620702918; artifact 14578240289. Original failure only; no test rerun.", ""]
          found = []
          sensitive = re.compile(r"authorization|cookie|password|credential|secret|bearer|nonce|access.token|[?&](?:code|token|key)=", re.I)
          def retain(raw, origin):
              lines = [line for line in str(raw).splitlines() if not sensitive.search(line) and re.search(r"C12_|error:|at .*c12-host|decision fixture|fixture.ts|status|outcome|reason", line, re.I)]
              found.append(origin)
              output.extend(["## " + origin, "", "\n".join(lines)[:12000], ""])
          def walk(value, origin):
              if isinstance(value,list):
                  for item in value: walk(item,origin)
              elif isinstance(value,dict):
                  if value.get("name") == "c12-initial-host.log" and isinstance(value.get("body"),str):
                      try: retain(base64.b64decode(value["body"]).decode("utf-8",errors="replace"),origin + " named attachment")
                      except Exception: pass
                  for item in value.values():
                      if isinstance(item,(dict,list)): walk(item,origin)
          with zipfile.ZipFile(root / "c12.zip") as archive:
              for member in archive.infolist():
                  if member.is_dir() or member.file_size > 16000000: continue
                  if "c12-initial-host" in member.filename and member.filename.endswith(".log"): retain(archive.read(member).decode("utf-8",errors="replace"),member.filename)
                  elif member.filename.endswith(".json"):
                      try: walk(json.loads(archive.read(member)),member.filename)
                      except Exception: pass
          if not found: raise RuntimeError("Original C12 attachment absent")
          text = "\n".join(output) + "\n"
          payload = {"message":"docs(sf): retain original C12 seed diagnostic","branch":"audit-c12-seed6-20261119","content":base64.b64encode(text.encode()).decode()}
          (root / "c12-seed-payload.json").write_text(json.dumps(payload))
          print("Original C12 seed diagnostic retained; no headers or authentication material.")
          PY
      - name: Persist diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT repos/gustavomhss/Orchestra-SF/contents/docs/handoff/observed-c12-seed6-20261119.md --input "$RUNNER_TEMP/c12-seed-payload.json" > /dev/null
