name: go-live-recovery-controls

on:
  push:
    branches:
      - go-live-recovery

permissions:
  contents: read

jobs:
  checkpoint-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Real file and SQLite controls
        id: controls
        env:
          G10_COMPONENT_RECEIPT: ${{ runner.temp }}/g10-component/receipt.json
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/g10-component"
          G10_COMPONENT_SOURCE_SHA="$(git rev-parse HEAD)"
          G10_COMPONENT_SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          export G10_COMPONENT_SOURCE_SHA G10_COMPONENT_SOURCE_TREE
          printf '%s\n' "$G10_COMPONENT_SOURCE_SHA" > "$RUNNER_TEMP/g10-component/source-sha.txt"
          printf '%s\n' "$G10_COMPONENT_SOURCE_TREE" > "$RUNNER_TEMP/g10-component/source-tree.txt"
          set +e
          sudo --preserve-env=G10_COMPONENT_RECEIPT,G10_COMPONENT_SOURCE_SHA,G10_COMPONENT_SOURCE_TREE,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT \
            python3 -B sf/azure/recovery/test_teams_checkpoint.py 2>&1 | tee "$RUNNER_TEMP/g10-component/tests.log"
          controls_status=("${PIPESTATUS[@]}")
          set -e
          ownership_status=0
          if [ -f "$G10_COMPONENT_RECEIPT" ]; then
            sudo chown --no-dereference "$(id -u):$(id -g)" "$G10_COMPONENT_RECEIPT" || ownership_status=$?
          fi
          if [ "${controls_status[0]}" -ne 0 ]; then
            exit "${controls_status[0]}"
          fi
          if [ "${controls_status[1]}" -ne 0 ]; then
            exit "${controls_status[1]}"
          fi
          exit "$ownership_status"
      - name: Setup Bun for canonical guards
        uses: ./.github/actions/setup-bun
      - name: Canonical guards
        run: |
          set -euo pipefail
          bun run check:spawn-imports
          bun run check:guards --base origin/dev
      - name: Publish component evidence
        if: always() && steps.controls.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g10-file-controls-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g10-component
          if-no-files-found: error
          retention-days: 14
