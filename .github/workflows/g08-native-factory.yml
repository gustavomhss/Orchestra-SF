name: g08-native-factory

on:
  push:
    branches: ["team-factory-hooks", "budget-source-read"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g08-native-factory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  component:
    if: github.repository == 'gustavomhss/Orchestra-SF' && github.repository_id == '1455724710'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ORCHESTRA_OMNI_CONTROL: declared
      ORCHESTRA_EXPERIMENTAL_OMNI_SPAWNER: strict
      ORCHESTRA_CHANNEL: prod
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15"
      - name: Bind source and original producer dependencies
        run: |
          set -euo pipefail
          proof_output="$RUNNER_TEMP/g08-native-factory-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$proof_output"
          printf 'SF_G08_FACTORY_EVIDENCE=%s\n' "$proof_output" >> "$GITHUB_ENV"
          printf 'G05_TEAM_RECEIPT=%s\n' "$proof_output/g05-default.json" >> "$GITHUB_ENV"
          printf 'G05_SOURCE_TREE=%s\n' "$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$proof_output/source.sha"
          git rev-parse 'HEAD^{tree}' > "$proof_output/source.tree"
          git rev-list --parents -n 1 HEAD > "$proof_output/source.parents"
          git rev-parse origin/dev > "$proof_output/guards-base.sha"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:modules/sucafina/Sucafinav1/runtime/application.ts)" = "27c21e4c1df0ee4748f762a324f52ff1a02f7105"
          test "$(git rev-parse HEAD:apps/cli/src/sucafina-product/team-native-domain.ts)" = "42337429dd7ecb6be8bb9496c955e3e73d2f0193"
          test "$(git rev-parse HEAD:apps/cli/src/sucafina-product/team-native-procurement.ts)" = "71f1b768a8b5969087b0400a64bc39930c7722af"
          test "$(git rev-parse HEAD:packages/client/src/sucafina/team-domain.ts)" = "db7df64e426d1fa59f0ceed63dae3e72f16dff2f"
      - uses: ./.github/actions/setup-bun
        id: install
        with:
          reuse-node: "true"
      - name: Prepare the original Omni addon and supervisor
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: ./.github/actions/omni-binaries
      - name: Exercise original Domain source reads and mutation fences
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/cli
        run: |
          set -euo pipefail
          export ORCHESTRA_OMNI_CONTROL_NONCE="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(16).toString("hex"))')"
          bun test --timeout 60000 --reporter=junit --reporter-outfile "$SF_G08_FACTORY_EVIDENCE/domain.junit.xml" ./test/team-native-domain.test.ts 2>&1 | tee "$SF_G08_FACTORY_EVIDENCE/domain.log"
      - name: Exercise original Team Client wire and read-only Budget source
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/client
        run: |
          set -euo pipefail
          export ORCHESTRA_OMNI_CONTROL_NONCE="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(16).toString("hex"))')"
          bun test --timeout 60000 --reporter=junit --reporter-outfile "$SF_G08_FACTORY_EVIDENCE/client.junit.xml" ./test/sucafina-team-domain.test.ts 2>&1 | tee "$SF_G08_FACTORY_EVIDENCE/client.log"
      - name: Exercise native factory and signed Microsoft HTTP paths
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: modules/sucafina/Sucafinav1
        run: |
          set -euo pipefail
          export ORCHESTRA_OMNI_CONTROL_NONCE="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(16).toString("hex"))')"
          bun test --timeout 60000 --reporter=junit --reporter-outfile "$SF_G08_FACTORY_EVIDENCE/native.junit.xml" ./test/team-native-domain-http.test.ts 2>&1 | tee "$SF_G08_FACTORY_EVIDENCE/native.log"
      - name: Preserve original Microsoft policy OIDC and F02 controls
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: modules/sucafina/Sucafinav1
        run: |
          set -euo pipefail
          export ORCHESTRA_OMNI_CONTROL_NONCE="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(16).toString("hex"))')"
          bun test --timeout 30000 --reporter=junit --reporter-outfile "$SF_G08_FACTORY_EVIDENCE/microsoft.junit.xml" ./test/microsoft-installation.test.ts 2>&1 | tee "$SF_G08_FACTORY_EVIDENCE/microsoft.log"
      - name: Preserve the original default HTTP fixture consumer
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: modules/sucafina/Sucafinav1
        run: |
          set -euo pipefail
          export ORCHESTRA_OMNI_CONTROL_NONCE="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(16).toString("hex"))')"
          bun test --timeout 60000 --reporter=junit --reporter-outfile "$SF_G08_FACTORY_EVIDENCE/default.junit.xml" ./test/g05-http-team-isolation.test.ts 2>&1 | tee "$SF_G08_FACTORY_EVIDENCE/default.log"
      - name: Typecheck the original CLI composition
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/cli
        run: |
          set -euo pipefail
          bun typecheck 2>&1 | tee "$SF_G08_FACTORY_EVIDENCE/cli-types.log"
      - name: Typecheck the original Client composition
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/client
        run: |
          set -euo pipefail
          bun typecheck 2>&1 | tee "$SF_G08_FACTORY_EVIDENCE/client-types.log"
      - name: Typecheck Microsoft runtime and all original test consumers
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: modules/sucafina/Sucafinav1
        run: |
          set -euo pipefail
          bun typecheck 2>&1 | tee "$SF_G08_FACTORY_EVIDENCE/sf-types.log"
      - name: Check original guards against origin dev
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail
          git diff --check origin/dev...HEAD
          bun run check:guards --base origin/dev 2>&1 | tee "$SF_G08_FACTORY_EVIDENCE/guards.log"
      - name: Require exact reports HTTP cleanup and source provenance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path(os.environ["GITHUB_WORKSPACE"])
          output = Path(os.environ["SF_G08_FACTORY_EVIDENCE"])
          prefix = "modules/sucafina/Sucafinav1/"
          suites = [
              ("domain", "apps/cli/test/team-native-domain.test.ts", 15),
              ("client", "packages/client/test/sucafina-team-domain.test.ts", 13),
              ("native", prefix + "test/team-native-domain-http.test.ts", 9),
              ("microsoft", prefix + "test/microsoft-installation.test.ts", 29),
              ("default", prefix + "test/g05-http-team-isolation.test.ts", 1),
          ]
          reports = []
          for name, source, expected_count in suites:
              source_text = (root / source).read_text()
              expected = re.findall(r'^test\("([^"]+)"', source_text, re.M)
              if name == "microsoft":
                  expected += ["Corporate Team context suppresses a late original business projection after " + value
                      for value in ["roles", "membership", "logout"]]
                  expected += ["Corporate Team context reads the actual private policy at " + value
                      for value in ["roles-before", "grants-before", "invalid-before", "roles-during", "grants-during"]]
              if len(expected) != expected_count or len(set(expected)) != expected_count or re.search(r'test\.(skip|todo|only)', source_text):
                  raise SystemExit("G08_FACTORY_SOURCE_INVENTORY_MISMATCH")
              report = output / (name + ".junit.xml")
              cases = ET.parse(report).getroot().findall(".//testcase")
              if sorted(x.attrib.get("name") for x in cases) != sorted(expected):
                  raise SystemExit("G08_FACTORY_JUNIT_INVENTORY_MISMATCH")
              if any(x.find(tag) is not None for x in cases for tag in ("failure", "error", "skipped")):
                  raise SystemExit("G08_FACTORY_NON_PASS_CASE")
              logs = (output / (name + ".log")).read_text()
              if len(re.findall(r'omni positive control \[[0-9a-f]{32}\]: (?:pass|not applicable)', logs)) != 1:
                  raise SystemExit("G08_FACTORY_OMNI_CONTROL_MISSING")
              reports.append({"suite": name, "tests": len(cases), "failures": 0, "skips": 0,
                  "source": source, "junitSha256": hashlib.sha256(report.read_bytes()).hexdigest()})
          cleanups = [json.loads(line.split("G08_NATIVE_FACTORY_CLEANUP ", 1)[1])
              for line in (output / "native.log").read_text().splitlines() if "G08_NATIVE_FACTORY_CLEANUP " in line]
          ids = ["native-readers", "native-writers", "native-negatives", "current-policy",
              "inflight-authority", "source-cas", "route-guards", "native-opt-in", "budget-source"]
          if sorted(item["id"] for item in cleanups) != sorted(ids) or any(
              item["cleanup"] is not True or not isinstance(item["requests"], int) or item["requests"] <= 0
              or item["loopbackPeers"] != item["requests"] or item["ingressRequests"] != item["requests"]
              or item["nativeWeb"] is not (item["id"] != "native-opt-in") for item in cleanups):
              raise SystemExit("G08_FACTORY_REAL_HTTP_OR_CLEANUP_REQUIRED")
          default = json.loads((output / "g05-default.json").read_text())
          if default["sourceSha"] != os.environ["GITHUB_SHA"] or default["sourceTree"] != (output / "source.tree").read_text().strip():
              raise SystemExit("G08_FACTORY_DEFAULT_SOURCE_MISMATCH")
          if default["summary"] != {"expected": 11, "pass": 11, "pending": 0} or default["cleanup"]["completed"] is not True:
              raise SystemExit("G08_FACTORY_DEFAULT_FIXTURE_REGRESSION")
          paths = [
              prefix + "runtime/team-business.ts", prefix + "local/microsoft-entry.ts",
              prefix + "test/fixture/microsoft-http.ts", prefix + "test/microsoft-installation.test.ts",
              prefix + "test/team-native-domain-http.test.ts", ".github/workflows/g08-native-factory.yml",
              prefix + "runtime/application.ts", prefix + "runtime/local-identity.ts",
              "apps/cli/src/sucafina-product/team-native-domain.ts", "apps/cli/test/team-native-domain.test.ts",
              "packages/client/src/sucafina/team-domain.ts", "packages/client/test/sucafina-team-domain.test.ts",
              "apps/cli/src/sucafina-product/team-native-procurement.ts",
          ]
          receipt = {
              "schema": "sf-g08-native-factory-component-v1", "status": "COMPONENT_CONTROLS_VERIFIED",
              "source": {"sha": (output / "source.sha").read_text().strip(),
                  "tree": (output / "source.tree").read_text().strip()},
              "run": {"id": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"]},
              "composition": {"parents": (output / "source.parents").read_text().split()[1:],
                  "integrationBase": "d9194fc04428da9a6c0ebf348e84633968f77b51",
                  "currentPolicySource": "b4d1315876cd03c358741bbe2e6438569c843e47",
                  "procurementSource": "ba521f92c5464dc9bee50223e8d3b4ea1b235c0a"},
              "files": [{"path": name, "sha256": hashlib.sha256((root / name).read_bytes()).hexdigest()} for name in paths],
              "reports": reports, "cleanup": cleanups,
              "defaultFixture": {"cases": 11, "receiptSha256": hashlib.sha256((output / "g05-default.json").read_bytes()).hexdigest()},
              "guardsBase": (output / "guards-base.sha").read_text().strip(),
              "proofScope": "HTTP_LOOPBACK_MICROSOFT_COMPONENT",
              "identityProvider": "CONTROLLED_ENTRA_JWKS_GRAPH",
              "runtimeFactory": "createMicrosoftInstallation",
              "budgetSource": {"capabilityId": "CAP03", "operationId": "domain.page.CAP03",
                  "nativeReadOnly": True, "periodSelection": "ORIGINAL_YEAR_MONTH_OPTIONAL"},
              "factoryHooksIntegrated": True, "installedTeamsProof": False, "finalCandidate": False,
              "g08Closed": False, "productionCutover": False,
          }
          (output / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps({"source": receipt["source"], "reports": reports,
              "factoryHooksIntegrated": True, "installedTeamsProof": False, "g08Closed": False}))
          PY
      - name: Preserve component evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g08-native-factory-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/g08-native-factory-${{ github.run_id }}-${{ github.run_attempt }}/
