name: g10-clone-observation-controls

on:
  push:
    branches: [clone-observation-ci]

permissions:
  contents: read

jobs:
  clone-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      G10_COMPONENT_SOURCE_SHA: "9714cd1819e2f0f5158210076268ac2bb0e5f9fb"
      G10_COMPONENT_SOURCE_TREE: "25139019a6152f771dfdcb977267f1c5d6b9146a"
      G10_COMPONENT_RECEIPT: ${{ runner.temp }}/g10-clone-controls/receipt.json
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: "9714cd1819e2f0f5158210076268ac2bb0e5f9fb"
          fetch-depth: 0
          persist-credentials: false
      - name: Observe source and validation base
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$G10_COMPONENT_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$G10_COMPONENT_SOURCE_TREE"
          test -z "$(git status --porcelain)"
          mkdir -m 700 "$RUNNER_TEMP/g10-clone-controls"
          git rev-parse HEAD 'HEAD^{tree}' origin/dev > "$RUNNER_TEMP/g10-clone-controls/refs.txt"
          git merge-base HEAD origin/dev > "$RUNNER_TEMP/g10-clone-controls/merge-base.txt"
          git diff --name-only "$(git merge-base HEAD origin/dev)" HEAD > "$RUNNER_TEMP/g10-clone-controls/changed-paths.txt"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/g10-clone-controls/workflow-sha.txt"
          cat "$RUNNER_TEMP/g10-clone-controls/refs.txt"
          cat "$RUNNER_TEMP/g10-clone-controls/changed-paths.txt"
      - name: Actual filesystem and clone binding controls
        run: |
          set -euo pipefail
          python3 -B sf/azure/recovery/test_teams_checkpoint.py 2>&1 | tee "$RUNNER_TEMP/g10-clone-controls/tests.log"
      - name: Bun for canonical guards
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Canonical spawn and repository guards
        run: |
          set -euo pipefail
          bun run check:spawn-imports 2>&1 | tee "$RUNNER_TEMP/g10-clone-controls/spawn-guard.log"
          bun run check:guards --base origin/dev 2>&1 | tee "$RUNNER_TEMP/g10-clone-controls/guards.log"
      - name: Preserve component evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g10-clone-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g10-clone-controls
          if-no-files-found: error
          retention-days: 14
