name: Team budget source controls
on:
  push:
    branches: ["budget-source-check"]
permissions:
  contents: read
concurrency:
  group: team-budget-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  component:
    if: github.repository == 'gustavomhss/Orchestra-SF' && github.repository_id == '1455724710'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ORCHESTRA_OMNI_CONTROL: declared
      ORCHESTRA_EXPERIMENTAL_OMNI_SPAWNER: strict
      ORCHESTRA_CHANNEL: prod
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: "5ef901242b5d7954562a8ed52dcc0e6b7a233561"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15"
      - name: Bind source, Client composition and original leaves
        run: |
          set -euo pipefail
          budget_output="$RUNNER_TEMP/team-budget-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$budget_output"
          printf 'SF_BUDGET_SOURCE_EVIDENCE=%s\n' "$budget_output" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "5ef901242b5d7954562a8ed52dcc0e6b7a233561"
          test "$(git rev-parse 'HEAD^{tree}')" = "6504484824bef41133c191c6006492346a114646"
          test "$(git rev-parse HEAD^)" = "3edf0514b82da20d9b9df84eae5bc63d6d4eaab9"
          test "$(git rev-parse '3edf0514b82da20d9b9df84eae5bc63d6d4eaab9^{tree}')" = "a8d243c920500e666e9a342e46688c4bdfc92330"
          test "$(git rev-parse '3edf0514b82da20d9b9df84eae5bc63d6d4eaab9^')" = "d9194fc04428da9a6c0ebf348e84633968f77b51"
          test "$(git rev-parse "$GITHUB_SHA^")" = "5ef901242b5d7954562a8ed52dcc0e6b7a233561"
          test "$(git diff --name-only '3edf0514b82da20d9b9df84eae5bc63d6d4eaab9' HEAD)" = "packages/client/src/sucafina/team-domain.ts"
          test "$(git diff --name-only HEAD "$GITHUB_SHA")" = ".github/workflows/team-budget-source-check.yml"
          git rev-parse origin/dev > "$budget_output/guard-base.sha"
          git merge-base HEAD origin/dev > "$budget_output/guard-merge-base.sha"
          python3 - <<'PY'
          import json, subprocess
          changed = subprocess.check_output(["git", "diff", "--name-only", "d9194fc04428da9a6c0ebf348e84633968f77b51", "3edf0514b82da20d9b9df84eae5bc63d6d4eaab9"], text=True).splitlines()
          if sorted(changed) != sorted(["packages/app-shell/src/orchestra/chapters/sucafina/host/team-domain-route.ts","packages/app-shell/src/orchestra/chapters/sucafina/host/team-domain.tsx","packages/app-shell/src/orchestra/chapters/sucafina/dashboard/executive/reader.ts","packages/app-shell/src/pages/team-profile.tsx","packages/app-shell/src/context/team-profile-navigation.ts","packages/app-shell/test-browser/team-budget-source.test.ts"]):
              raise SystemExit("BUDGET_SOURCE_SCOPE_CHANGED")
          expected = {"packages/app-shell/src/pages/team-profile.tsx":"a5834e9c46612696242cafe6d1e233d48c6faaeb","packages/app-shell/src/context/team-profile-navigation.ts":"ff2b065ec36492e92ffe62be912451a0d3e11a2e","packages/app-shell/test-browser/team-domain-hooks.test.ts":"dd26571d4a35fcba14ff818d6300a350fe2b6cc9","packages/app-shell/src/orchestra/chapters/sucafina/context/contracts.ts":"94dbe3ff84f9dedf7fef07385eaba8b2cd0885d9","packages/app-shell/src/orchestra/chapters/sucafina/context/drafts.ts":"9de81c9127a239f5a4be6a6b64a3288cccd0e61e","packages/app-shell/src/orchestra/chapters/sucafina/context/index.tsx":"7f04fd683aeea1ed5f135e336886491fa643ec75","packages/app-shell/src/orchestra/chapters/sucafina/host/draft-revalidation-availability.ts":"5dde06641ac705dabd072ea19fff03e78b91ee4c","packages/app-shell/src/orchestra/chapters/sucafina/host/draft-revalidation-budget.ts":"e4f3a9a2637255853da87618d3cefa3b9126eec1","packages/app-shell/src/orchestra/chapters/sucafina/host/draft-revalidation-vendor.ts":"dbea7c628542a9b54616849e7da780c3da1dd54c","packages/app-shell/src/orchestra/chapters/sucafina/host/team-domain-route.ts":"74710da54d03f6362811f10448417aa5f2c0b73a","packages/app-shell/src/orchestra/chapters/sucafina/host/team-domain.tsx":"5aac54351e7e95a5fabeb1f98c1ca3fd49386b5f","packages/app-shell/test-browser/sucafina-team-domain.test.ts":"14c2a2e29dbfa28937d3ba663ab3ffd991bf4992","packages/app-shell/src/orchestra/chapters/sucafina/procurement/contracts/index.tsx":"b5d8462a54e20082f99de70d97ef67168e5f0aea","packages/app-shell/src/orchestra/chapters/sucafina/dashboard/opex/surface.tsx":"e61340a944a735dc1906895036c70156b83c6500","packages/client/src/sucafina/team-domain.ts":"db7df64e426d1fa59f0ceed63dae3e72f16dff2f","packages/client/package.json":"672a2a3fd8aa2dbedf8c5c3afa870c30a77f37bf","packages/app-shell/test-browser/team-profile-navigation.test.ts":"9780153d3616a8eaec4c1ca830b97947fbca329d","packages/app-shell/test-browser/team-profile.test.ts":"5dcd04f422f337958c7882923646a53d113e538c","packages/app-shell/test-browser/team-session-page.test.ts":"7982fac4199c21b589700098a25b4fc14eabe04c","packages/app-shell/test-browser/team-profile-configuration.test.ts":"f3c6d56db2928d3fe8eee18c6597eda20ccf648b","packages/app-shell/src/orchestra/chapters/sucafina/dashboard/executive/reader.ts":"9a3fc718d498149ae39add068598858d831fa954","packages/app-shell/test-browser/team-budget-source.test.ts":"6574b20d15453df9159f0dc9caa3eb1c8d437107","packages/app-shell/src/orchestra/chapters/sucafina/dashboard/budget/index.tsx":"f82946f091f58090491b39adf36d97e45310dac2","packages/app-shell/src/orchestra/chapters/sucafina/host/dashboard-route.ts":"e7b542ba44f43d599906d3e1fd5f39be793da4e3"}
          for path, blob in expected.items():
              if subprocess.check_output(["git", "rev-parse", "HEAD:" + path], text=True).strip() != blob:
                  raise SystemExit("BUDGET_SOURCE_DEPENDENCY_CHANGED:" + path)
          reader = "packages/app-shell/src/orchestra/chapters/sucafina/dashboard/executive/reader.ts"
          before = subprocess.check_output(["git", "show", "d9194fc04428da9a6c0ebf348e84633968f77b51:" + reader], text=True)
          current = subprocess.check_output(["git", "show", "HEAD:" + reader], text=True)
          if before.replace('import { useSfContext } from "../../context"', 'import { useSfReadableContext as useSfContext } from "../../context"') != current:
              raise SystemExit("BUDGET_ORIGINAL_READER_BODY_CHANGED")
          print(json.dumps({"source": "3edf0514b82da20d9b9df84eae5bc63d6d4eaab9", "composition": "5ef901242b5d7954562a8ed52dcc0e6b7a233561", "verifiedBlobs": expected}))
          PY
          git diff --check origin/dev...HEAD 2>&1 | tee "$budget_output/whitespace.log"
      - uses: ./.github/actions/setup-bun
        id: install
        with:
          reuse-node: "true"
      - name: Exercise source journeys and preserve original Team UI controls
        id: dom
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/app-shell
        run: |
          set -euo pipefail
          export ORCHESTRA_OMNI_CONTROL_NONCE="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(16).toString("hex"))')"
          bun test --conditions=browser --preload ../../script/test-omni-control.ts --preload ./happydom.ts --timeout 15000 --reporter=junit --reporter-outfile "$SF_BUDGET_SOURCE_EVIDENCE/budget-dom.junit.xml" ./test-browser/team-budget-source.test.ts ./test-browser/sucafina-team-domain.test.ts ./test-browser/team-domain-hooks.test.ts ./test-browser/team-profile-navigation.test.ts ./test-browser/team-profile.test.ts ./test-browser/team-session-page.test.ts ./test-browser/team-profile-configuration.test.ts 2>&1 | tee "$SF_BUDGET_SOURCE_EVIDENCE/budget-dom.log"
      - name: Typecheck App Shell through its original package command
        id: app_types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/app-shell
        run: |
          set -euo pipefail
          bun typecheck 2>&1 | tee "$SF_BUDGET_SOURCE_EVIDENCE/app-shell-types.log"
      - name: Typecheck the explicitly composed Client
        id: client_types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/client
        run: |
          set -euo pipefail
          bun typecheck 2>&1 | tee "$SF_BUDGET_SOURCE_EVIDENCE/client-types.log"
      - name: Check canonical guards against origin dev
        id: guards
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail
          bun run check:guards --base origin/dev 2>&1 | tee "$SF_BUDGET_SOURCE_EVIDENCE/guards.log"
      - name: Preserve exact component receipt
        if: success() && steps.dom.outcome == 'success' && steps.app_types.outcome == 'success' && steps.client_types.outcome == 'success' && steps.guards.outcome == 'success'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          import xml.etree.ElementTree as ET
          output = Path(os.environ["SF_BUDGET_SOURCE_EVIDENCE"])
          expected = ["the public Team navigation seam preserves canonical domain deep links and drops record refs on owner change","the real Team shell preserves a closed CAP05 login return and admits its original leaf after F02","product links mount all three original Team leaves through the shell with fresh complete F02 reads","focus keeps the owner registry while Team picker cancellation retains drafts and confirmation drops old record intent","history hides a private leaf before consent and a cancelled traversal restores the same unsent draft","domain and real Chat navigation both honor the existing discard dialog without sending either draft","an uncertain domain POST survives focus without replay and logout retires the private owner","fresh revocation purges a domain draft and late old-Team page responses cannot publish in a replacement owner","the three context entry paths retain their closed selection and Team intent contract","foreign, duplicate, partial, legacy and malformed Team URLs are refused without a default intent","the URL writer changes only the admitted profile intent and never shares state between window URLs","native new-chat and Session ID paths require complete same-origin Team intent across login return URLs","logout suppresses focus revalidation and the next account starts without the old Team","an explicit Team deep link is revalidated before display and after a remount","A B A records only confirmed choices and history traversal rereads each intended owner","history navigation cancels a pending picker intent instead of preserving it into the new entry","a foreign history entry fences an in-flight Team response even when no popstate was delivered","a valid URL cannot authorize a different Team returned by the context producer","an administrator without a Team can enable, disable and remove profiles with the exact opaque CAS revision","a ready Team projection cannot substitute the principal in its business stamp","an administrative conflict requires an explicit new read and never reuses the revision from the conflict","a late administrative catalog cannot survive a principal change or open administration for the next account","logout aborts an administrative write and discards its late response before another account","the real native composer creates once and renders admitted messages plus namespace-checked stream text","Team A B A uses the native discard dialog, keeps a cancelled draft and never displays another Team's draft","focus quarantines a new draft until fresh context and namespace reads, then a changed generation removes it","history traversal rereads a session and keeps different same-Team in-memory drafts apart","an uncertain prompt survives ephemeral refresh, blocks leaving and reconciles only by reads before logout clears personal URL intent","revocation scrubs the real transcript and draft while retaining the explicit refused Team and session URL","late private HTTP data cannot reappear after the current principal changes","an administrator without a Team edits shared preferences with exact read revision and preserves agent settings","a missing document has no invented model and cannot save an empty configuration","configuration conflict invalidates the catalog and requires an explicit read without using the conflict revision","a connection lost after configuration POST keeps an unknown outcome and never resends","revoked administration on configuration read revalidates the page and exposes no form","navigation aborts a dispatched configuration write and rejects a late success","the configuration SDK refuses foreign profiles, retries and oversized writes before network dispatch","Team B survives overlapping selection and refresh on focus","Team B survives overlapping selection and refresh on pageshow","a final network response clears the pending Team intent","a final denied response clears the pending Team intent","a final unauthenticated response clears the pending Team intent","an invalid installation link remains refused across refresh without any Team context request","an invalid tenant link remains refused across refresh without any Team context request","an invalid duplicate link remains refused across refresh without any Team context request","an explicit URL intent survives a final network response without default selection","an explicit URL intent survives a final denied response without default selection","an explicit URL intent survives a final unauthenticated response without default selection","an explicit Team revoked projection preserves the URL and independent administration without business authority","an explicit Team denied projection preserves the URL and independent administration without business authority","an explicit Team no-teams projection preserves the URL and independent administration without business authority","administrative reads refuse a foreign-profile response without displaying a usable catalog","administrative reads refuse a status-mismatch response without displaying a usable catalog","an administrative POST interrupted by network keeps an unknown outcome until an explicit read without resending","an administrative POST interrupted by focus keeps an unknown outcome until an explicit read without resending","configuration read rejects foreign-team before exposing editable settings","configuration read rejects unknown-setting before exposing editable settings","configuration read rejects status-mismatch before exposing editable settings","a changed generation cannot submit the previously read configuration","a changed principal cannot submit the previously read configuration","Team domain URL intent reuses canonical refs and rejects partial, foreign, duplicate and invalid year selectors","original CAP14 leaf renders Team data and product-resolved F01 links with no mutation","original CAP04 leaf renders Team data and product-resolved F01 links with no mutation","original CAP05 leaf renders Team data and product-resolved F01 links with no mutation","CAP14 original review dispatches exact CAS/idempotency and rereads the confirmed Team projection","same-owner refresh revalidates and restores an unsent CAP14 draft without dispatching it","Team switch removes the old private draft and late old reads never populate the new leaf","loss of the original write grant purges the retained private draft before remount","a lost POST response survives refresh as unresolved and cannot dispatch a second command with a new key","source version drift becomes a retained conflict, and old owner handles cannot mutate after Team replacement","unadapted legacy consumers fail closed while the explicit readable hook preserves the real Team DTO","CAP03 public intent preserves the original optional period and refuses authority, aliases and unsupported paths","CAP03 login return, focus and Team change preserve the canonical month without creating a grant","the original CAP03 period selector and reset commit only public selection and render producer totals","a superseded CAP03 period signal cannot commit its URL after the navigation guard yields","fresh CAP03 read revocation removes its private values without borrowing another domain destination","late Team A CAP03 bytes cannot populate the original budget leaf after Team B is confirmed","CAP04 original View source opens the real read-only CAP03 leaf with a full current Team and year","CAP05 original View source opens the real read-only CAP03 leaf with a full current Team and year"]
          files = {"the public Team navigation seam preserves canonical domain deep links and drops record refs on owner change":"test-browser/team-domain-hooks.test.ts","the real Team shell preserves a closed CAP05 login return and admits its original leaf after F02":"test-browser/team-domain-hooks.test.ts","product links mount all three original Team leaves through the shell with fresh complete F02 reads":"test-browser/team-domain-hooks.test.ts","focus keeps the owner registry while Team picker cancellation retains drafts and confirmation drops old record intent":"test-browser/team-domain-hooks.test.ts","history hides a private leaf before consent and a cancelled traversal restores the same unsent draft":"test-browser/team-domain-hooks.test.ts","domain and real Chat navigation both honor the existing discard dialog without sending either draft":"test-browser/team-domain-hooks.test.ts","an uncertain domain POST survives focus without replay and logout retires the private owner":"test-browser/team-domain-hooks.test.ts","fresh revocation purges a domain draft and late old-Team page responses cannot publish in a replacement owner":"test-browser/team-domain-hooks.test.ts","the three context entry paths retain their closed selection and Team intent contract":"test-browser/team-profile-navigation.test.ts","foreign, duplicate, partial, legacy and malformed Team URLs are refused without a default intent":"test-browser/team-profile-navigation.test.ts","the URL writer changes only the admitted profile intent and never shares state between window URLs":"test-browser/team-profile-navigation.test.ts","native new-chat and Session ID paths require complete same-origin Team intent across login return URLs":"test-browser/team-profile-navigation.test.ts","Team B survives overlapping selection and refresh on focus":"test-browser/team-profile.test.ts","Team B survives overlapping selection and refresh on pageshow":"test-browser/team-profile.test.ts","a final network response clears th