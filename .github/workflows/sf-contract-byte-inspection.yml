name: sf-contract-byte-inspection
on:
  push:
    branches: [audit-freeze-20261119]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 713d5565663b01baec641e89b7ba57b713026125
          persist-credentials: false
      - name: Observe original contract pins against the exact candidate bytes
        env:
          CHECKED_SHA: 713d5565663b01baec641e89b7ba57b713026125
        run: |
          test "$(git rev-parse HEAD)" = "$CHECKED_SHA"
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib
          root = pathlib.Path.cwd()
          path = root / 'modules/sucafina/Sucafinav1/product/contracts/freeze-v1.json'
          manifest_bytes = path.read_bytes()
          manifest = json.loads(manifest_bytes)
          observations = []
          for name, expected in manifest['artifacts'].items():
              source = (path.parent / name).resolve()
              source.relative_to(root)
              observed = hashlib.sha256(source.read_bytes()).hexdigest() if source.is_file() else None
              observations.append({'path': str(source.relative_to(root)), 'expected': expected, 'observed': observed, 'matches': observed == expected})
          result = {'schema': 'sf-contract-byte-observation-v1', 'candidate': os.environ['CHECKED_SHA'], 'workflowRun': os.environ['GITHUB_RUN_ID'], 'originalRevision': manifest['revision'], 'originalManifestSha256': hashlib.sha256(manifest_bytes).hexdigest(), 'observations': observations, 'qualification': 'Read-only byte observation. No manifest, baseline, coverage or acceptance status was changed.'}
          target = pathlib.Path(os.environ['RUNNER_TEMP'])
          document = json.dumps(result, ensure_ascii=False, indent=2) + '\n'
          payload = {'message': 'docs(sf): retain actual contract byte observation', 'content': base64.b64encode(document.encode()).decode(), 'branch': 'audit-freeze-20261119'}
          (target / 'contract-observation-upload.json').write_text(json.dumps(payload))
          print(json.dumps({'artifacts': len(observations), 'matching': sum(item['matches'] for item in observations), 'changed': [item['path'] for item in observations if not item['matches']]}))
          PY
      - name: Retain the observation in the isolated audit branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT repos/gustavomhss/Orchestra-SF/contents/docs/handoff/contract-byte-observation.json --input "$RUNNER_TEMP/contract-observation-upload.json" --silent
