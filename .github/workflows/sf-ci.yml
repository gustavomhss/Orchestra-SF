name: sf-migration-decisions-composed

# Snapshot-only driver: this branch tree contains only this workflow.
# Product receipts bind the pinned source SHA/tree; the workflow SHA is separate.
# Only original Decisions5 and canonical static/contracts are selected; no shard or pool rerun.
on:
  push:
    branches: [migration-decisions-composed]
    paths: [.github/workflows/sf-ci.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: sf-migration-decisions-composed-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CI: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SF_FOCAL_SOURCE: 9612e7db0319c41ea0161e3924f332d9d76b0f9b
  SF_FOCAL_TREE: b1dc4bdc3b4a73667e9ee8011667616565d2f9bc
  SF_DRIVER_EVENT_SHA: ${{ github.sha }}
  SF_DRIVER_WORKFLOW_SHA: ${{ github.workflow_sha }}

jobs:
  ui:
    name: sf/test-${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        id: [CI-UI-DECISIONS]
    env:
      SF_SUITE_ID: ${{ matrix.id }}
      ORCHESTRA_EXPERIMENTAL_OMNI_SPAWNER: "1"
      PLAYWRIGHT_WORKERS: "1"
      PLAYWRIGHT_NO_VIDEO: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.SF_FOCAL_SOURCE }}
          persist-credentials: false
      - name: Verify exact candidate and restore reviewed Omni
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ env.SF_FOCAL_SOURCE }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY_ID" = 1455724710
          test "$GITHUB_REF_NAME" = migration-decisions-composed
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$SF_DRIVER_EVENT_SHA" = "$GITHUB_SHA"
          test "$SF_DRIVER_WORKFLOW_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$REQUESTED_SHA" = "$SF_FOCAL_SOURCE"
          test "$RUNNER_OS" = Linux && test "$RUNNER_ARCH" = X64
          test "$(git rev-parse HEAD)" = "$SF_FOCAL_SOURCE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SF_FOCAL_TREE"
          printf 'source=%s tree=%s workflow=%s run=%s attempt=%s\n' "$SF_FOCAL_SOURCE" "$SF_FOCAL_TREE" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          admission="$GITHUB_WORKSPACE/sf-ci-evidence/$SF_SUITE_ID"
          mkdir -p "$admission"
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync(process.argv[1], JSON.stringify({schema:"sf-source-driver-admission-v1",sourceSha:process.env.SF_FOCAL_SOURCE,sourceTree:process.env.SF_FOCAL_TREE,driverEventSha:process.env.SF_DRIVER_EVENT_SHA,driverWorkflowSha:process.env.SF_DRIVER_WORKFLOW_SHA,originalGithubSha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,runnerOs:process.env.RUNNER_OS,runnerArch:process.env.RUNNER_ARCH,eventName:process.env.GITHUB_EVENT_NAME,qualification:false},null,2)+"\n")' "$admission/driver-admission.json"
          archive="$RUNNER_TEMP/sf-focal-omni.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14740432844/zip" > "$archive"
          printf '6412fe6b130efd60f413f86041cfd5bd4eaf346d871a78822637ac0a0f93b49b  %s\n' "$archive" | sha256sum -c -
          dir="$GITHUB_WORKSPACE/native/omni/target/release"
          mkdir -p "$dir"
          unzip -oq "$archive" libhugr_omni_node.so hugr-omni-supervisor -d "$dir"
          test -s "$dir/libhugr_omni_node.so" && test -s "$dir/hugr-omni-supervisor"
          chmod +x "$dir/hugr-omni-supervisor"
          printf 'HUGR_OMNI_ADDON=%s\nHUGR_OMNI_SUPERVISOR=%s\n' "$dir/libhugr_omni_node.so" "$dir/hugr-omni-supervisor" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/ripgrep
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15"
      - name: Install Chromium for Linux only
        working-directory: packages/app-shell
        run: bunx playwright install --with-deps chromium
      - name: Qualify real loopback ClamD for Operations uploads
        if: ${{ matrix.id == 'CI-UI-OPERATIONS' }}
        shell: bash
        run: bash script/sf-ci/operations-clamd.sh
      - name: Run installed SF UI journey
        env:
          SF_OPERATIONS_CLAMD_PORT: ${{ matrix.id == 'CI-UI-OPERATIONS' && '3310' || '' }}
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_SHA="$SF_FOCAL_SOURCE"
          root="$GITHUB_WORKSPACE"
          evidence="$root/sf-ci-evidence/$SF_SUITE_ID"
          mkdir -p "$evidence"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$RUNNER_OS" = Linux && test "$RUNNER_ARCH" = X64
          SF_CHECKOUT_TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          export SF_CHECKOUT_TREE_SHA

          # UI spec comes exclusively from the same A2 selector as Bun suites.
          node script/sf-ci/gate.mjs select > "$evidence/selection.txt" || exit $?
          mapfile -t files < "$evidence/selection.txt"
          test "${#files[@]}" -eq 1 || exit 2
          suite_dir="$(node --input-type=module -e '
            import { readFileSync } from "node:fs"
            import { validateManifest } from "./script/sf-ci/gate.mjs"
            const suites = validateManifest(JSON.parse(readFileSync("sf/ci/suites.json", "utf8")))
            const suite = suites.find((entry) => entry.id === process.env.SF_SUITE_ID && entry.kind === "playwright")
            if (!suite) throw new Error("SF_CI_UNKNOWN_UI_SUITE")
            process.stdout.write(suite.directory)
          ')"
          test -f "$root/$suite_dir/${files[0]}"
          export PLAYWRIGHT_JSON_OUTPUT_NAME="$evidence/report.json"
          cd "$root/$suite_dir"
          set +e
          bun run test:e2e:local "${files[0]}" --config e2e/playwright.production.config.ts --workers 1 --retries 0 --reporter json,line 2>&1 | tee "$evidence/run.log"
          status=${PIPESTATUS[0]}
          set -e
          printf 'sourceSha=%s\ntreeSha=%s\nrunId=%s\nattempt=%s\nexitCode=%s\n' "$GITHUB_SHA" "$SF_CHECKOUT_TREE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$status" > "$evidence/execution.txt"
          sha256sum "$root/sf/ci/suites.json" >> "$evidence/execution.txt"
          if [ -s "$evidence/report.json" ]; then
            cp "$evidence/report.json" "$evidence/report.raw.json"
          fi
          test "$status" -eq 0
          cd "$root"
          node script/sf-ci/gate.mjs sanitize-playwright
          # The coverage gate needs a baseline versioned from an authentic successful
          # run and independently reviewed. Until that baseline exists in the
          # manifest, calling it here would only fail closed on every PR.
          SF_TEST_EXIT_CODE="$status" SF_CHECKOUT_SHA="$(git rev-parse HEAD)" node script/sf-ci/gate.mjs receipt
      - name: Preserve raw UI inventory for independent baseline review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sf-candidate-${{ matrix.id }}
          path: |
            sf-ci-evidence/${{ matrix.id }}/driver-admission.json
            sf-ci-evidence/${{ matrix.id }}/execution.txt
            sf-ci-evidence/${{ matrix.id }}/selection.txt
            sf-ci-evidence/${{ matrix.id }}/report.raw.json
            sf-ci-evidence/${{ matrix.id }}/run.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish only minimized JSON and receipt for a clean run
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sf-evidence-${{ matrix.id }}
          path: |
            sf-ci-evidence/${{ matrix.id }}/report.json
            sf-ci-evidence/${{ matrix.id }}/receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish UI failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sf-ui-failure-${{ matrix.id }}
          path: |
            packages/app-shell/e2e/test-results/**
          if-no-files-found: ignore
          retention-days: 7


  static:
    name: sf/static-and-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.SF_FOCAL_SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and record original driver identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY_ID" = 1455724710
          test "$GITHUB_REF_NAME" = migration-decisions-composed
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$SF_DRIVER_EVENT_SHA" = "$GITHUB_SHA"
          test "$SF_DRIVER_WORKFLOW_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$RUNNER_OS" = Linux && test "$RUNNER_ARCH" = X64
          test "$(git rev-parse HEAD)" = "$SF_FOCAL_SOURCE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SF_FOCAL_TREE"
          printf 'source=%s tree=%s event=%s workflow=%s run=%s attempt=%s\n' "$SF_FOCAL_SOURCE" "$SF_FOCAL_TREE" "$GITHUB_SHA" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          evidence="$RUNNER_TEMP/sf-e2e-typecheck-evidence"
          mkdir -p "$evidence"
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync(process.argv[1], JSON.stringify({schema:"sf-source-driver-admission-v1",sourceSha:process.env.SF_FOCAL_SOURCE,sourceTree:process.env.SF_FOCAL_TREE,driverEventSha:process.env.SF_DRIVER_EVENT_SHA,driverWorkflowSha:process.env.SF_DRIVER_WORKFLOW_SHA,originalGithubSha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,runnerOs:process.env.RUNNER_OS,runnerArch:process.env.RUNNER_ARCH,eventName:process.env.GITHUB_EVENT_NAME,qualification:false},null,2)+"\n")' "$evidence/driver-admission.json"
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/ripgrep
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15"

      - name: Verify generated business boundaries (generation and clean tree)
        run: |
          set -euo pipefail
          export GITHUB_SHA="$SF_FOCAL_SOURCE"
          # Do not replace the historical generator execution with check-only.
          (cd modules/atlas/boundary && bun run check:generated && bun run generate && git diff --exit-code -- .)
          (cd packages/client && bun run check:generated)

      - name: Typecheck runtime, host, product and app
        run: |
          set -euo pipefail
          export GITHUB_SHA="$SF_FOCAL_SOURCE"
          (cd modules/atlas/boundary && bun run typecheck)
          (cd modules/sucafina && bun run typecheck)
          (cd packages/core && bun run typecheck)
          (cd packages/server && bun run typecheck)
          (cd packages/client && bun run typecheck)
          (cd apps/cli && bun run typecheck)
          (cd packages/app-shell && bun run typecheck)
      - name: Prove Sucafina E2E compiler inclusion even after another typecheck RED
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_SHA="$SF_FOCAL_SOURCE"
          evidence="$RUNNER_TEMP/sf-e2e-typecheck-evidence"
          mkdir -p "$evidence"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$RUNNER_OS" = Linux && test "$RUNNER_ARCH" = X64
          SF_PRODUCT_TREE="$(git rev-parse 'HEAD^{tree}')"
          export SF_PRODUCT_TREE
          bun --version > "$evidence/bun-version.txt"
          cd packages/app-shell
          set +e
          bun run typecheck:sf-e2e --showConfig > "$evidence/effective-config.json" 2> "$evidence/config.stderr.log"
          config_status=$?
          bun run typecheck:sf-e2e --listFiles --pretty false > "$evidence/typecheck.log" 2>&1
          typecheck_status=$?
          set -e
          cd "$GITHUB_WORKSPACE"
          set +e
          node script/sf2h/final-bundle/verify-e2e-typecheck.mjs \
            --config "$evidence/effective-config.json" \
            --log "$evidence/typecheck.log" \
            --config-status "$config_status" \
            --typecheck-status "$typecheck_status" \
            --output "$evidence/inclusion.json"
          verification_status=$?
          set -e
          printf '{"config_status":%d,"typecheck_status":%d,"verification_status":%d}\n' \
            "$config_status" "$typecheck_status" "$verification_status" > "$evidence/command-statuses.json"
          sha256sum "$evidence/bun-version.txt" "$evidence/effective-config.json" \
            "$evidence/config.stderr.log" "$evidence/typecheck.log" > "$evidence/sha256sums.txt"
          grep -E 'error TS[0-9]+:' "$evidence/typecheck.log" || true
          test "$config_status" -eq 0 && test "$typecheck_status" -eq 0 && test "$verification_status" -eq 0
      - name: Publish E2E compiler inclusion proof (including RED evidence)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sf-e2e-inclusion-${{ env.SF_FOCAL_SOURCE }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sf-e2e-typecheck-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Verify Linux web production build
        run: |
          export GITHUB_SHA="$SF_FOCAL_SOURCE"
          (cd apps/web && bun run build)

      - name: Security and dependency guards for current dev and the candidate base
        if: ${{ !cancelled() }}
        env:
          GH_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_SHA="$SF_FOCAL_SOURCE"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          evidence_dir="$RUNNER_TEMP/guard-evidence"
          mkdir -p "$evidence_dir"
          # checkout has persist-credentials:false; the read-only token exists
          # only for this fetch and is never saved in git config or artifacts.
          auth="$(printf 'x-access-token:%s' "$GH_READ_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch --no-tags origin +refs/heads/dev:refs/remotes/origin/dev
          SF_PR_BASE="8bd7645767deb85b286b046a52a4e9f1db100262"
          git merge-base --is-ancestor "$SF_PR_BASE" HEAD
          unset auth GH_READ_TOKEN
          git cat-file -e "$SF_PR_BASE^{commit}"
          dev_sha="$(git rev-parse 'origin/dev^{commit}')"
          test -n "$dev_sha"
          set +e
          bun run check:spawn-imports > "$evidence_dir/spawn.log" 2>&1
          spawn_status=$?
          bun run check:guards --base origin/dev > "$evidence_dir/guard-dev.log" 2>&1
          dev_status=$?
          bun run check:guards --base "$SF_PR_BASE" > "$evidence_dir/guard-pr-base.log" 2>&1
          pr_status=$?
          set -e
          SF_GUARD_DEV_SHA="$dev_sha" SF_GUARD_PR_SHA="$SF_PR_BASE" \
          SF_SPAWN_STATUS="$spawn_status" SF_GUARD_DEV_STATUS="$dev_status" SF_GUARD_PR_STATUS="$pr_status" \
            node --input-type=module -e '
              import { writeFileSync } from "node:fs"
              import { execFileSync } from "node:child_process"
              const sha = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim()
              const tree = execFileSync("git", ["rev-parse", "HEAD^{tree}"], { encoding: "utf8" }).trim()
              if (sha !== process.env.GITHUB_SHA) process.exit(2)
              const receipt = {
                schema: "sf-ci-guard-bases-v1", candidate: sha, tree,
                run: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
                runner_os: process.env.RUNNER_OS, runner_arch: process.env.RUNNER_ARCH,
                canonical_base: process.env.SF_GUARD_DEV_SHA,
                pr_base: process.env.SF_GUARD_PR_SHA,
                commands: [
                  { command: "bun run check:spawn-imports", status: Number(process.env.SF_SPAWN_STATUS) },
                  { command: "bun run check:guards --base origin/dev", status: Number(process.env.SF_GUARD_DEV_STATUS) },
                  { command: "bun run check:guards --base <PR base SHA>", status: Number(process.env.SF_GUARD_PR_STATUS) },
                ],
              }
              writeFileSync(process.env.RUNNER_TEMP + "/guard-evidence/receipt.json", JSON.stringify(receipt, null, 2) + "\n")
            '
          sha256sum "$evidence_dir"/{spawn,guard-dev,guard-pr-base}.log "$evidence_dir"/receipt.json \
            > "$evidence_dir/sha256sums.txt"
          printf 'guards canonical dev=%s status=%s; PR base=%s status=%s; spawn=%s\n' \
            "$dev_sha" "$dev_status" "$SF_PR_BASE" "$pr_status" "$spawn_status"
          test "$spawn_status" -eq 0 && test "$dev_status" -eq 0 && test "$pr_status" -eq 0
      - name: Publish independent guard-base evidence (including RED)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sf-guard-bases-${{ env.SF_FOCAL_SOURCE }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/guard-evidence
          if-no-files-found: error
          retention-days: 14
