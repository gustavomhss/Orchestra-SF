name: sf-migration-monthly-focal

# Snapshot-only driver: this branch tree contains only this workflow.
# Product receipts bind the pinned source SHA/tree; the workflow SHA is separate.
# Focused real SQLite monthly recovery regression, separate from the six-job focal.
on:
  push:
    branches: [migration-monthly-focal]
    paths: [.github/workflows/sf-ci.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: sf-migration-monthly-focal-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CI: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SF_FOCAL_SOURCE: c6ee32d7071c2e06ba050d4d64470fc9af69e5cb
  SF_FOCAL_TREE: 5abe3f5b10eb0462e4efa3596376a46523f6c51b

jobs:
  monthly-recovery:
    name: sf/monthly-recovery-sqlite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SF_SUITE_ID: CI-SF
      ORCHESTRA_EXPERIMENTAL_OMNI_SPAWNER: "1"
      ORCHESTRA_OMNI_CONTROL: declared
      SF_CI_FOREIGN_OWNER_FIXTURE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.SF_FOCAL_SOURCE }}
          persist-credentials: false
      - name: Verify exact candidate and restore reviewed Omni
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ env.SF_FOCAL_SOURCE }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY_ID" = 1455724710
          test "$GITHUB_REF_NAME" = migration-monthly-focal
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$REQUESTED_SHA" = "$SF_FOCAL_SOURCE"
          test "$RUNNER_OS" = Linux && test "$RUNNER_ARCH" = X64
          test "$(git rev-parse HEAD)" = "$SF_FOCAL_SOURCE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SF_FOCAL_TREE"
          printf 'source=%s tree=%s workflow=%s run=%s attempt=%s\n' "$SF_FOCAL_SOURCE" "$SF_FOCAL_TREE" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          archive="$RUNNER_TEMP/sf-focal-omni.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14740432844/zip" > "$archive"
          printf '6412fe6b130efd60f413f86041cfd5bd4eaf346d871a78822637ac0a0f93b49b  %s\n' "$archive" | sha256sum -c -
          dir="$GITHUB_WORKSPACE/native/omni/target/release"
          mkdir -p "$dir"
          unzip -oq "$archive" libhugr_omni_node.so hugr-omni-supervisor -d "$dir"
          test -s "$dir/libhugr_omni_node.so" && test -s "$dir/hugr-omni-supervisor"
          chmod +x "$dir/hugr-omni-supervisor"
          printf 'HUGR_OMNI_ADDON=%s\nHUGR_OMNI_SUPERVISOR=%s\n' "$dir/libhugr_omni_node.so" "$dir/hugr-omni-supervisor" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/ripgrep
      - name: Execute only the existing monthly Planner runtime file
        shell: bash
        env:
          GITHUB_ACTIONS: "false"
        run: |
          set -euo pipefail
          export GITHUB_SHA="$SF_FOCAL_SOURCE"
          evidence="$GITHUB_WORKSPACE/sf-ci-evidence/monthly-recovery"
          mkdir -p "$evidence"
          test "$(id -u)" -ne 0
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$SF_FOCAL_TREE" = "$(git rev-parse 'HEAD^{tree}')"
          node script/sf-ci/gate.mjs select > "$evidence/manifest-inventory.txt"
          file=Sucafinav1/test/planner-runtime.test.ts
          rg -Fx "$file" "$evidence/manifest-inventory.txt"
          printf '%s\n' "$file" > "$evidence/selection.txt"
          cd modules/sucafina
          set +e
          bun test --timeout 30000 --reporter=junit "--reporter-outfile=$evidence/report.xml" "$file" 2>&1 | tee "$evidence/run.log"
          status=${PIPESTATUS[0]}
          set -e
          printf 'sourceSha=%s\ntreeSha=%s\ndriverSha=%s\nrunId=%s\nattempt=%s\nexitCode=%s\n' "$SF_FOCAL_SOURCE" "$SF_FOCAL_TREE" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$status" > "$evidence/execution.txt"
          test "$status" -eq 0
          cd "$GITHUB_WORKSPACE"
          python3 script/sf2h/final-bundle/verify-bun-report.py "$evidence/report.xml" > "$evidence/summary.json"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs"
          import { createHash } from "node:crypto"
          import { execFileSync } from "node:child_process"
          const root = "sf-ci-evidence/monthly-recovery/"
          const hash = (path) => createHash("sha256").update(readFileSync(path)).digest("hex")
          const summary = JSON.parse(readFileSync(root + "summary.json", "utf8"))
          const modes = ["restart", "restore", "edit", "legacy"]
          if (summary.status !== "PASS" || summary.counts.failures || summary.counts.errors || summary.counts.skipped ||
              summary.counts.todo_identified || summary.counts.executed < 4 ||
              modes.some((mode) => !summary.cases.some((entry) => entry.name === "monthly replay after " + mode + " preserves the consumed intent and acknowledges only its current result" && entry.executed === 1)) ||
              summary.cases.some((entry) => entry.file !== "Sucafinav1/test/planner-runtime.test.ts"))
            throw new Error("SF_MONTHLY_FOCAL_INCOMPLETE")
          const sourceSha = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim()
          const treeSha = execFileSync("git", ["rev-parse", "HEAD^{tree}"], { encoding: "utf8" }).trim()
          if (sourceSha !== process.env.SF_FOCAL_SOURCE || treeSha !== process.env.SF_FOCAL_TREE) throw new Error("SF_MONTHLY_CANDIDATE_CHANGED")
          const receipt = {
            schemaVersion: 1, status: "PASS", proofClass: "FOCUSED_MONTHLY_RECOVERY_REGRESSION",
            sourceSha, treeSha, driverSha: process.env.GITHUB_WORKFLOW_SHA,
            runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
            runnerOS: process.env.RUNNER_OS, runnerArch: process.env.RUNNER_ARCH,
            file: "modules/sucafina/Sucafinav1/test/planner-runtime.test.ts",
            testBlobSha: execFileSync("git", ["rev-parse", "HEAD:modules/sucafina/Sucafinav1/test/planner-runtime.test.ts"], { encoding: "utf8" }).trim(),
            executedTests: summary.counts.executed, recoveryVariants: modes,
            hashes: Object.fromEntries(["report.xml", "summary.json", "run.log", "execution.txt", "selection.txt"].map((name) => [name, hash(root + name)])),
            limitation: "Exact-file SQLite regression only. Not integrated gate, installed Teams, tar or production qualification.",
          }
          writeFileSync(root + "receipt.json", JSON.stringify(receipt, null, 2) + "\n", { flag: "wx" })
          console.log(JSON.stringify({ status: receipt.status, sourceSha, treeSha, executedTests: receipt.executedTests, recoveryVariants: modes }))
          NODE
      - name: Preserve exact-file evidence and any failure
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sf-monthly-recovery-evidence
          path: sf-ci-evidence/monthly-recovery/
          if-no-files-found: error
          retention-days: 14
