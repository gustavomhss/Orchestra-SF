name: sf-compiler-composed-190-guard

# Mission 190: second coherent W; native U15/U39/U40 185-186 plus real F04 fixture changed. Verify guards and E2E compiler without repeating old package errors.
# This is not an epic or product-test workflow; A45's paths and dispatcher are untouched.
on:
  push:
    branches: [sf-compiler-checks]

permissions:
  contents: read

concurrency:
  group: sf-compiler-190
  cancel-in-progress: false

env:
  SF_SOURCE_SHA: 4426445c05823ed4932b8a8e35391df024bf74f3
  SF_SOURCE_TREE: 61b5cfc0df910105a67a344706795b4c3b7d30b7
  SF_PLANNING_SHA: dbf9547211d9b0fade619790de7c19c0869b7c7d

jobs:
  compiler-composed-190-guard-batch-02:
    if: github.repository == 'gustavomhss/Orchestra-SF' && github.ref == 'refs/heads/sf-compiler-checks' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout pinned coherent integrated 189 product W, without stored credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: 4426445c05823ed4932b8a8e35391df024bf74f3
          fetch-depth: 0
          persist-credentials: false

      - name: Prove fixed checkout and resolve actual dev/merge-base
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/sf-compiler-190"
          mkdir -p "$EVIDENCE"
          printf '%s\n' "workflow_commit=$GITHUB_SHA" "source_sha=$SF_SOURCE_SHA" "expected_tree=$SF_SOURCE_TREE" > "$EVIDENCE/identity.txt"
          test "$(git rev-parse HEAD)" = "$SF_SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SF_SOURCE_TREE"
          git rev-parse --verify refs/remotes/origin/dev
          git merge-base HEAD origin/dev
          git rev-parse HEAD HEAD^{tree} origin/dev > "$EVIDENCE/revisions.txt"
          git merge-base HEAD origin/dev > "$EVIDENCE/merge-base.txt"
          printf "%s\\n" "candidate_sha=$SF_SOURCE_SHA" "candidate_tree=$SF_SOURCE_TREE" "selection_kind=compiler190-guards-e2e-06" "historic_c64_not_pass=true" > "$EVIDENCE/selection-identity.txt"
          git status --porcelain=v1 > "$EVIDENCE/status-before.txt"
          test ! -s "$EVIDENCE/status-before.txt"
          sha256sum bun.lock package.json packages/app-shell/package.json packages/app-shell/tsconfig.json packages/app-shell/tsconfig.sf-e2e.json \
            modules/sucafina/package.json packages/core/package.json apps/cli/package.json modules/atlas/boundary/package.json \
            packages/schema/package.json packages/client/package.json packages/client/script/build.ts \
            packages/protocol/package.json packages/server/package.json \
            modules/atlas/boundary/script/build.ts script/check-spawn-imports.ts script/spawn-allowlist.json \
            script/guards/run.ts script/sf2h/final-bundle/requests.json script/sf2h/final-bundle/verify-e2e-typecheck.mjs \
            .github/workflows/sf2-epic.yml .github/workflows/test-ci.yml \
            packages/schema/src/sucafina/context.ts packages/protocol/src/groups/sucafina.ts \
            modules/sucafina/Sucafinav1/test/native-ui-contract/sdk-query-repair.test.ts \
            packages/schema/src/sucafina/decisions/source-contracts.ts packages/schema/src/sucafina/reviews.ts \
            packages/schema/src/sucafina/work.ts packages/schema/src/sucafina/routines.ts \
            apps/cli/src/sucafina-product/native-ui/router.ts apps/cli/src/sucafina-product/native-ui/procurement.ts \
            packages/app-shell/src/orchestra/chapters/sucafina/shared/table/index.tsx \
            packages/app-shell/src/orchestra/chapters/sucafina/reviews/compare/index.tsx \
            packages/app-shell/src/orchestra/chapters/sucafina/imports/index.tsx \
            apps/cli/src/sucafina-product/native-ui/domain.ts apps/cli/src/sucafina-product/native-ui/people.ts \
            apps/cli/src/sucafina-product/native-ui/routines.ts apps/cli/src/sucafina-product/native-ui/desktop-enrollment.ts \
            apps/cli/src/sucafina-product/native-ui/live-context.ts apps/cli/src/sucafina-product/native-ui/work.ts \
            apps/cli/src/sucafina-product/host-context.ts apps/desktop/src/main/sucafina/protocol.ts \
            modules/sucafina/Sucafinav1/product/integration/product-authority.ts \
            modules/sucafina/Sucafinav1/test/native-ui-contract/live-context.test.ts \
            modules/sucafina/Sucafinav1/test/native-ui-contract/people.test.ts \
            modules/sucafina/Sucafinav1/test/native-ui-contract/work.test.ts \
            packages/app-shell/e2e/sucafina/native/fixture.ts \
            packages/app-shell/e2e/sucafina/native/fixture/scratch.ts \
            packages/app-shell/e2e/sucafina/native/fixture/installed-manifest.ts \
            packages/app-shell/e2e/sucafina/native/fixture/journeys.ts \
            packages/app-shell/e2e/sucafina/native/fixture/readiness.ts \
            packages/app-shell/e2e/sucafina/native/fixture/response-faults.ts \
            packages/app-shell/e2e/sucafina/native/journeys/u15.spec.ts \
            packages/app-shell/e2e/sucafina/native/journeys/u39.spec.ts \
            packages/app-shell/e2e/sucafina/native/journeys/u40.spec.ts \
            packages/app-shell/test-browser/sucafina-native/fixture/journeys.test.ts \
            packages/client/src/sucafina/transport.ts packages/client/src/sucafina/work.ts \
            packages/schema/src/sucafina/operation-registry.ts packages/schema/src/sucafina/work.ts > "$EVIDENCE/input-sha256.txt"

      - name: Setup pinned repository Bun and Node runtime
        uses: ./.github/actions/setup-bun

      - name: Import existing compiler tooling from the workflow commit without changing product checkout
        run: |
          set -euo pipefail
          TOOL_DIR="$RUNNER_TEMP/sf128-tools"
          EVIDENCE="$RUNNER_TEMP/sf-compiler-190"
          mkdir -p "$TOOL_DIR" "$EVIDENCE"
          git cat-file -e "$GITHUB_SHA^{commit}"
          git show "$GITHUB_SHA:script/sf2h/final-bundle/build-artifact.py" > "$TOOL_DIR/build-artifact.py"
          git show "$GITHUB_SHA:script/sf2h/final-bundle/verify-e2e-typecheck.mjs" > "$TOOL_DIR/verify-e2e-typecheck.mjs"
          cp script/sf2h/final-bundle/requests.json "$TOOL_DIR/requests.json"
          sha256sum "$TOOL_DIR/build-artifact.py" "$TOOL_DIR/verify-e2e-typecheck.mjs" "$TOOL_DIR/requests.json" > "$EVIDENCE/tooling-sha256.txt"
          printf '%s\n' "tooling_commit=$GITHUB_SHA" "tooling_source=git-show-at-workflow-sha" > "$EVIDENCE/tooling-identity.txt"
          git status --porcelain=v1 > "$EVIDENCE/status-after-tool-overlay.txt"
          echo "SF128_TOOL_DIR=$TOOL_DIR" >> "$GITHUB_ENV"

      - name: Run guards and causal installed E2E compilation on newly integrated U15 U39 U40; preserve exits
        run: |
          set -uo pipefail
          EVIDENCE="$RUNNER_TEMP/sf-compiler-190"
          mkdir -p "$EVIDENCE"
          : > "$EVIDENCE/exit-codes.tsv"
          printf "%s\\n" e2e-inventory guards sf-e2e-showConfig sf-e2e-listFiles sf-e2e-verify spawn-imports > "$EVIDENCE/ordered-selection.txt"
          bun --version > "$EVIDENCE/bun-version.txt" 2>&1
          node --version > "$EVIDENCE/node-version.txt" 2>&1
          git --version > "$EVIDENCE/git-version.txt" 2>&1
          record() {
            local name="$1"
            local directory="$2"
            shift 2
            printf '>>> %s | cwd=%s | argv=' "$name" "$directory"
            printf '%q ' "$@"
            printf '\n'
            local code=0
            (cd "$directory" && "$@") > "$EVIDENCE/$name.log" 2>&1 || code=$?
            printf '%s\t%s\t%s\n' "$name" "$code" "$directory" >> "$EVIDENCE/exit-codes.tsv"
            printf '<<< %s exit=%s\n' "$name" "$code"
            tail -n 60 "$EVIDENCE/$name.log" || true
            return 0
          }
          # W442 introduces U15/U39/U40 sources and F04 fixture; new guard findings are meaningful.
          # Do not repeat unchanged Schema/Client/CLI errors from W77e. No guard waiver/approval.
          record e2e-inventory . node "$SF128_TOOL_DIR/verify-e2e-typecheck.mjs" --inventory
          record guards . bun run check:guards --base origin/dev
          record sf-e2e-showConfig packages/app-shell bun run typecheck:sf-e2e --showConfig
          record sf-e2e-listFiles packages/app-shell bun run typecheck:sf-e2e --listFiles --pretty false
          config_exit="$(awk '$1 == "sf-e2e-showConfig" {print $2}' "$EVIDENCE/exit-codes.tsv")"
          program_exit="$(awk '$1 == "sf-e2e-listFiles" {print $2}' "$EVIDENCE/exit-codes.tsv")"
          export SF_PRODUCT_TREE="$SF_SOURCE_TREE"
          GITHUB_SHA="$SF_SOURCE_SHA" record sf-e2e-verify . node "$SF128_TOOL_DIR/verify-e2e-typecheck.mjs" \
            --config "$EVIDENCE/sf-e2e-showConfig.log" --config-status "$config_exit" \
            --log "$EVIDENCE/sf-e2e-listFiles.log" --typecheck-status "$program_exit" \
            --output "$EVIDENCE/e2e-inclusion.json"
          record spawn-imports . bun run check:spawn-imports
          git status --porcelain=v1 > "$EVIDENCE/status-after-checks.txt"
          git diff --name-status -- packages/client/src/generated packages/client/src/generated-effect > "$EVIDENCE/sdk-name-status.txt"

          printf '%s\n' "source_sha=$SF_SOURCE_SHA" "source_tree=$SF_SOURCE_TREE" \
            "effective_dev=$(git rev-parse origin/dev)" "merge_base=$(git merge-base HEAD origin/dev)" \
            "workflow_commit=$GITHUB_SHA" > "$EVIDENCE/identity-final.txt"
          if awk -F '\t' '$2 != 0 { failed++ } END { exit failed ? 0 : 1 }' "$EVIDENCE/exit-codes.tsv"; then
            echo 'FAIL: one or more real checks failed (see per-command exit codes)'
            exit 1
          fi
          test "$(wc -l < "$EVIDENCE/exit-codes.tsv")" -eq 6
          echo 'PASS: all 6 scoped guard/E2E compiler/import commands exit0 (not final C/G7 or D/G8 acceptance)'

      - name: Record SDK not-selected state and preserve original epic provenance
        if: always()
        run: |
          set -uo pipefail
          EVIDENCE="$RUNNER_TEMP/sf-compiler-190"
          mkdir -p "$EVIDENCE"
          node - "$EVIDENCE" <<'NODE'
          const fs = require("node:fs")
          const path = require("node:path")
          const crypto = require("node:crypto")
          const cp = require("node:child_process")
          const dir = process.argv[2]
          const roots = ["packages/client/src/generated", "packages/client/src/generated-effect"]
          const git = (...args) => cp.execFileSync("git", args, { encoding: "utf8" }).trim()
          const previous = git("ls-tree", "-r", "HEAD", "--", ...roots)
          const before = new Map(previous.split("\n").filter(Boolean).map((line) => {
            const match = /^100[0-7]{3} blob ([a-f0-9]{40})\t(.+)$/.exec(line)
            if (!match) throw new Error("UNEXPECTED_GENERATED_TREE_RECORD: " + line)
            return [match[2], match[1]]
          }))
          const after = new Map()
          const collect = (directory) => {
            if (!fs.existsSync(directory)) return
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const filename = path.posix.join(directory, entry.name)
              if (entry.isDirectory()) collect(filename)
              else {
                if (!entry.isFile()) throw new Error("NON_REGULAR_GENERATED: " + filename)
                const bytes = fs.readFileSync(filename)
                after.set(filename, {
                  blob: crypto.createHash("sha1").update(Buffer.from("blob " + bytes.length + "\0")).update(bytes).digest("hex"),
                  sha256: crypto.createHash("sha256").update(bytes).digest("hex"),
                  bytes: bytes.length
                })
              }
            }
          }
          roots.forEach(collect)
          const files = [...new Set([...before.keys(), ...after.keys()])].sort().map((file) => {
            const preimage_blob = before.get(file) ?? null
            const generated = after.get(file) ?? null
            const postimage_blob = generated?.blob ?? null
            return { path: file, change: preimage_blob === postimage_blob ? "UNCHANGED" :
              preimage_blob === null ? "ADDED" : postimage_blob === null ? "DELETED" : "MODIFIED",
              preimage_blob, postimage_blob, post_sha256: generated?.sha256 ?? null, post_bytes: generated?.bytes ?? null }
          })
          const exitFile = path.join(dir, "exit-codes.tsv")
          const exits = fs.existsSync(exitFile)
            ? Object.fromEntries(fs.readFileSync(exitFile, "utf8").trim().split("\n").filter(Boolean)
                .map((line) => { const [name, code] = line.split("\t"); return [name, Number(code)] }))
            : {}
          const source = {
            protocol_tree: git("rev-parse", "HEAD:packages/protocol"),
            server_tree: git("rev-parse", "HEAD:packages/server"),
            schema_tree: git("rev-parse", "HEAD:packages/schema"),
            client_tree: git("rev-parse", "HEAD:packages/client"),
            client_contract_blob: git("rev-parse", "HEAD:packages/client/src/contract.ts"),
            generator_script_blob: git("rev-parse", "HEAD:packages/client/script/build.ts")
          }
          const patchFile = path.join(dir, "sdk-generated.patch")
          const patch = fs.existsSync(patchFile) ? fs.readFileSync(patchFile) : null
          const manifest = {
            schema: "sf2h.compiler163.sdk-prepost.v1", campaign: "sf2h-integral-20261112",
            source_sha: process.env.SF_SOURCE_SHA, source_tree: process.env.SF_SOURCE_TREE,
            compiler_wrapper_sha: process.env.GITHUB_SHA, run_id: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT,
            generation_command: "NOT_SELECTED_PUBLIC_API_INPUTS_UNCHANGED; historical hosted patch artifact14182790522",
            generation_exit: exits["sdk-generate"] ?? null, capture_exit: exits["sdk-diff-capture"] ?? null,
            status: "SDK_NOT_REGENERATED_ON_W; HISTORICAL_PATCH_ARTIFACT14182790522_UNCONSUMED",
            sources: source,
            source_to_consumer: "packages/protocol and packages/server HttpApi -> packages/client/src/contract.ts -> packages/client/script/build.ts -> packages/client/src/generated and generated-effect",
            total_files: files.length,
            changed_files: files.filter((f) => f.change !== "UNCHANGED").length,
            sdk_patch_present: patch !== null,
            sdk_patch_sha256: patch === null ? null : crypto.createHash("sha256").update(patch).digest("hex"),
            files
          }
          fs.writeFileSync(path.join(dir, "sdk-generated-manifest.json"), JSON.stringify(manifest, null, 2) + "\n")
          const prior = path.join(dir, "sf2-epic.before.yml")
          const generated = path.join(dir, "sf2-epic.generated.yml")
          try {
            fs.writeFileSync(prior, cp.execFileSync("git", ["show", "HEAD:.github/workflows/sf2-epic.yml"]))
            if (fs.existsSync(generated)) {
              const result = cp.spawnSync("diff", ["-u", prior, generated], { encoding: "utf8" })
              if (result.status !== 0 && result.status !== 1) throw new Error("EPIC_DIFF_FAILED")
              fs.writeFileSync(path.join(dir, "sf2-epic.generated.patch"), result.stdout)
              fs.writeFileSync(path.join(dir, "sf2-epic.sha256.txt"), [prior, generated].map((file) => {
                const bytes = fs.readFileSync(file)
                return crypto.createHash("sha256").update(bytes).digest("hex") + "  " + path.basename(file)
              }).join("\n") + "\n")
            }
          } catch (error) {
            fs.writeFileSync(path.join(dir, "epic-capture-error.txt"), String(error))
            throw error
          }
          console.log(JSON.stringify({ status: manifest.status, source_sha: manifest.source_sha,
            total: manifest.total_files, changed: manifest.changed_files, patch_bytes: patch?.length ?? null }))
          NODE

      - name: Preserve unchanged epic YAML artifact provenance without rebuilding
        if: always()
        run: |
          EVIDENCE="$RUNNER_TEMP/sf-compiler-190"
          mkdir -p "$EVIDENCE"
          printf '%s\\n' 'bundle_status=HISTORICAL_ARTIFACT_REUSE_NOT_CURRENT_PASS' \
            'source_test_ci_blob=3185885e123f9bb13c16c670e4df2fcffab38290' \
            'source_requests_blob=3ff28507d6ae6b874f021fb8acf5088d61442c80' \
            'source_epic_yml_blob=b332d777e4465469e9e4869e29f4339a95853d21' \
            'historic_artifact=14171118214' \
            'generated_yaml_sha256=c6c0e2583a5be2bb393d3db832232c6625ceb28370bf1f7f815eb3a661b77394' > "$EVIDENCE/bundle-reuse.txt"

      - name: Upload compiler evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sf-compiler-190-guards-w442-02
          path: ${{ runner.temp }}/sf-compiler-190
          if-no-files-found: error
          retention-days: 14
