name: sf-teams-core-migration

# Explicit read-only execution of the repository's official Core migration generator.
# Source commits never self-publish generated code; the owner imports exact blobs.
on:
  push:
    branches: [tp-migration-*]

permissions:
  contents: read

concurrency:
  group: sf-teams-core-migration-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CI: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Require exact Linux source snapshot and a closed generation request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REPOSITORY" = gustavomhss/Orchestra-SF
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 2
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = ".ci-teams-core-migration.json"
          export SF_CODEGEN_PARENT="$(git rev-parse HEAD^)"
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from "node:fs"
          const request = JSON.parse(readFileSync(".ci-teams-core-migration.json", "utf8"))
          if (!request || Array.isArray(request) || Object.keys(request).sort().join(",") !== "mode,sourceSha" ||
            !["generate", "verify"].includes(request.mode) || !/^[a-f0-9]{40}$/.test(request.sourceSha) ||
            request.sourceSha !== process.env.SF_CODEGEN_PARENT) throw new Error("SF_CODEGEN_REQUEST_INVALID")
          appendFileSync(process.env.GITHUB_OUTPUT, "mode=" + request.mode + "\nsource=" + request.sourceSha + "\n")
          NODE
      - uses: ./.github/actions/setup-bun
      - name: Run official Core migration generation
        id: generation
        working-directory: packages/core
        env:
          SF_CODEGEN_MODE: ${{ steps.request.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sf-teams-core-migration"
          set +e
          if [ "$SF_CODEGEN_MODE" = verify ]; then
            bun run script/migration.ts --check
          else
            bun run script/migration.ts --name teams_session_owner
          fi
          result=$?
          set -e
          printf '%s\n' "$result" > "$RUNNER_TEMP/sf-teams-core-migration/command-exit"
          printf 'exit=%s\n' "$result" >> "$GITHUB_OUTPUT"
      - name: Record only allowed generated bytes and exact source evidence
        if: ${{ !cancelled() && steps.generation.outcome == 'success' }}
        env:
          SF_CODEGEN_SOURCE: ${{ steps.request.outputs.source }}
          SF_CODEGEN_MODE: ${{ steps.request.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only -z > "$RUNNER_TEMP/sf-teams-core-migration/tracked"
          git ls-files --others --exclude-standard -z > "$RUNNER_TEMP/sf-teams-core-migration/untracked"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/sf-teams-core-migration/snapshot-tree"
          git rev-parse "$SF_CODEGEN_SOURCE^{tree}" > "$RUNNER_TEMP/sf-teams-core-migration/source-tree"
          test -z "$(git diff --name-only --diff-filter=MD HEAD -- packages/core/src/database/migration)"
          git diff --binary -- packages/core/schema.json packages/core/src/database > "$RUNNER_TEMP/sf-teams-core-migration/working.diff"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, existsSync, lstatSync } from "node:fs"
          import { createHash } from "node:crypto"
          const directory = process.env.RUNNER_TEMP + "/sf-teams-core-migration"
          const names = [...new Set(["tracked", "untracked"].flatMap((name) =>
            readFileSync(directory + "/" + name, "utf8").split("\0").filter(Boolean)))].sort()
          const allowed = (path) => [
            "packages/core/schema.json", "packages/core/src/database/migration.gen.ts",
            "packages/core/src/database/schema.gen.ts", "packages/core/src/database/schema-board.gen.ts",
          ].includes(path) || path.startsWith("packages/core/src/database/migration/") &&
            /^[0-9]+_teams_session_owner[.]ts$/.test(path.split("/").at(-1))
          if (names.some((path) => !allowed(path))) throw new Error("SF_CODEGEN_UNEXPECTED_WRITE: " + names.filter((path) => !allowed(path)).join(","))
          const manifest = {
            sourceSha: process.env.SF_CODEGEN_SOURCE, sourceTree: readFileSync(directory + "/source-tree", "utf8").trim(),
            snapshotSha: process.env.GITHUB_SHA, snapshotTree: readFileSync(directory + "/snapshot-tree", "utf8").trim(),
            command: process.env.SF_CODEGEN_MODE === "verify" ? "bun run script/migration.ts --check" : "bun run script/migration.ts --name teams_session_owner",
            directory: "packages/core", commandExit: Number(readFileSync(directory + "/command-exit", "utf8")),
            runId: process.env.GITHUB_RUN_ID, files: [],
          }
          for (const path of names) {
            if (!existsSync(path)) {
              const entry = { path, deleted: true }
              manifest.files.push(entry)
              console.log("SF_CODEGEN_FILE " + JSON.stringify(entry))
              continue
            }
            if (!lstatSync(path).isFile() || lstatSync(path).isSymbolicLink()) throw new Error("SF_CODEGEN_NON_FILE")
            const bytes = readFileSync(path)
            if (!Buffer.from(bytes.toString("utf8"), "utf8").equals(bytes)) throw new Error("SF_CODEGEN_NON_UTF8")
            const gitBlobSha = createHash("sha1").update(Buffer.from("blob " + bytes.length + "\0")).update(bytes).digest("hex")
            const data = bytes.toString("base64")
            const entry = { path, deleted: false, gitBlobSha, byteLength: bytes.length, encoding: "base64", data }
            manifest.files.push(entry)
            const count = Math.max(1, Math.ceil(data.length / 16000))
            for (let index = 0; index < count; index++) console.log("SF_CODEGEN_CHUNK " + JSON.stringify({
              path, gitBlobSha, byteLength: bytes.length, encoding: "base64", index, count, data: data.slice(index * 16000, (index + 1) * 16000),
            }))
          }
          writeFileSync(directory + "/manifest.json", JSON.stringify(manifest, null, 2) + "\n")
          console.log("SF_CODEGEN_MANIFEST " + JSON.stringify({ ...manifest, files: manifest.files.map(({ data, ...file }) => file) }))
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: sf-teams-core-migration-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sf-teams-core-migration/manifest.json
            ${{ runner.temp }}/sf-teams-core-migration/working.diff
          if-no-files-found: error
          retention-days: 14
      - name: Require official command success
        if: ${{ !cancelled() }}
        env:
          SF_CODEGEN_EXIT: ${{ steps.generation.outputs.exit }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SF_CODEGEN_EXIT" = 0
