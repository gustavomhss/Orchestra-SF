name: g09-host-boundary
run-name: Observe saved-permission exclusion in the frozen Microsoft v2 package

on:
  push:
    branches:
      - g09-host-boundary

concurrency:
  group: g09-host-boundary
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  g09-host-boundary:
    name: g09-host-boundary
    if: github.repository == 'gustavomhss/Orchestra-SF' && github.ref == 'refs/heads/g09-host-boundary'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout the separate observation source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout the exact producer source for unchanged helpers
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 83f1283f8e39cd5863d9806b9a48f0573f44eaff
          path: producer-source
          persist-credentials: false

      - name: Set up Node for the observation helper
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15"

      - name: Prepare separate Git identities and source-pinned parser
        run: |
          set -euo pipefail
          umask 077
          boundary="$RUNNER_TEMP/g09-host-boundary"
          mkdir -m 0700 "$boundary"
          cp .github/ci/g09-host-boundary-input.json "$boundary/expected.json"
          git cat-file commit HEAD > "$boundary/examination-commit.raw"
          git ls-tree -rz --full-tree HEAD > "$boundary/examination-tracked.z"
          git -C producer-source cat-file commit HEAD > "$boundary/producer-commit.raw"
          git -C producer-source ls-tree -rz --full-tree HEAD > "$boundary/producer-tracked.z"
          boundary_ts="$(node --input-type=module -e '
            import assert from "node:assert/strict"
            import fs from "node:fs"
            const value = JSON.parse(fs.readFileSync("producer-source/package.json", "utf8")).workspaces.catalog.typescript
            assert.match(value, /^[0-9]+\.[0-9]+\.[0-9]+$/)
            console.log(value)
          ')"
          npm install --prefix "$RUNNER_TEMP/g09-host-boundary-parser" --ignore-scripts --no-audit --no-fund --no-package-lock "typescript@$boundary_ts"
          mkdir -p producer-source/node_modules
          ln -s "$RUNNER_TEMP/g09-host-boundary-parser/node_modules/typescript" producer-source/node_modules/typescript
          node --input-type=module -e '
            import assert from "node:assert/strict"
            import fs from "node:fs"
            import ts from "./producer-source/node_modules/typescript/lib/typescript.js"
            assert.equal(ts.version, JSON.parse(fs.readFileSync("producer-source/package.json", "utf8")).workspaces.catalog.typescript)
          '
          python3 - "$boundary" <<'PY'
          import json, os, re, sys
          from pathlib import Path
          value = json.loads((Path(sys.argv[1]) / "expected.json").read_bytes())
          fields = {
              "BOUNDARY_PRODUCER_RUN": value["producer"]["runId"],
              "BOUNDARY_PRODUCER_ATTEMPT": value["producer"]["runAttempt"],
              "BOUNDARY_ARTIFACT_ID": value["artifact"]["id"],
          }
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for key, value in fields.items():
                  assert isinstance(value, str) and re.fullmatch(r"[1-9][0-9]*", value)
                  output.write(key + "=" + value + "\n")
          PY

      - name: Acquire the original product ZIP and both run identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          boundary="$RUNNER_TEMP/g09-host-boundary"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$BOUNDARY_ARTIFACT_ID" > "$boundary/producer-artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BOUNDARY_PRODUCER_RUN/attempts/$BOUNDARY_PRODUCER_ATTEMPT" > "$boundary/producer-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BOUNDARY_PRODUCER_RUN/attempts/$BOUNDARY_PRODUCER_ATTEMPT/jobs?per_page=100" > "$boundary/producer-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" > "$boundary/examination-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$boundary/examination-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$BOUNDARY_ARTIFACT_ID/zip" > "$boundary/product.zip"

      - name: Verify the original ZIP before extracting it
        env:
          CHECK_RUN_ID: ${{ job.check_run_id }}
        run: |
          set -euo pipefail
          boundary="$RUNNER_TEMP/g09-host-boundary"
          node .github/ci/g09-host-boundary.mjs metadata "$boundary" "$GITHUB_WORKSPACE/producer-source"
          python3 - "$boundary" <<'PY'
          import os, stat, sys, zipfile
          from pathlib import Path, PurePosixPath
          root = Path(sys.argv[1])
          destination = root / "package"
          destination.mkdir(mode=0o700)
          os.umask(0o077)
          with zipfile.ZipFile(root / "product.zip") as archive:
              members = archive.infolist()
              assert len(members) <= 1000
              assert sum(member.file_size for member in members) <= 1024 * 1024 * 1024
              seen = set()
              for member in members:
                  name = member.filename
                  relative = PurePosixPath(name)
                  assert name and "\\" not in name and "\x00" not in name and not relative.is_absolute()
                  assert ".." not in relative.parts and "." not in relative.parts
                  assert name not in seen
                  seen.add(name)
                  kind = stat.S_IFMT(member.external_attr >> 16)
                  assert kind in (0, stat.S_IFREG, stat.S_IFDIR)
                  target = destination.joinpath(*relative.parts)
                  assert target.resolve().is_relative_to(destination.resolve())
                  if member.is_dir():
                      target.mkdir(parents=True, exist_ok=True, mode=0o700)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True, mode=0o700)
                      with target.open("xb") as output:
                          output.write(archive.read(member))
          PY
          node .github/ci/g09-host-boundary.mjs archive "$boundary" "$GITHUB_WORKSPACE/producer-source"

      - name: Verify and temporarily install the exact archived package
        run: |
          set -euo pipefail
          boundary="$RUNNER_TEMP/g09-host-boundary"
          packaged="$boundary/package"
          archive="$packaged/orchestra-sf-entra-linux-x64-baseline.tar.gz"
          native_receipt="$packaged/orchestra-sf-entra-package-receipt.json"
          release="$RUNNER_TEMP/g09-host-boundary-release"
          python3 -B producer-source/sf/azure/vm/install-factory-distribution.py verify \
            --artifact "$archive" --receipt "$native_receipt" \
            --candidate 83f1283f8e39cd5863d9806b9a48f0573f44eaff \
            --sha256 af312871e79307bd281e7d46a162feeb44bc0112db0e67cb59f8be55db20a109 \
            > "$boundary/installer-verification.json"
          mkdir -m 0700 "$release"
          tar -xzf "$archive" --directory "$release" --no-same-owner --no-same-permissions
          python3 -B producer-source/.github/ci/g09-installation-modes.py \
            "$release" "$native_receipt" \
            "$GITHUB_WORKSPACE/producer-source/sf/azure/vm/install-factory-distribution.py" \
            "$boundary/installation-modes.json"

      - name: Observe route exclusion, real Team context and Core database absence
        env:
          CHECK_RUN_ID: ${{ job.check_run_id }}
        run: |
          set -euo pipefail
          node .github/ci/g09-host-boundary.mjs probe \
            "$RUNNER_TEMP/g09-host-boundary" "$GITHUB_WORKSPACE/producer-source" \
            "$RUNNER_TEMP/g09-host-boundary-release"

      - name: Preserve the unsigned cross-run observation and exact inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g09-host-boundary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/g09-host-boundary/*.json
            ${{ runner.temp }}/g09-host-boundary/*-commit.raw
            ${{ runner.temp }}/g09-host-boundary/*-tracked.z
            ${{ runner.temp }}/g09-host-boundary/package/g09-artifact-receipt.json
            ${{ runner.temp }}/g09-host-boundary/package/orchestra-sf-entra-package-receipt.json
            ${{ runner.temp }}/g09-host-boundary/package/compile-provenance.json
          if-no-files-found: error
          retention-days: 30
