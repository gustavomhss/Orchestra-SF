name: Astra WP08 checks

on:
  push:
    branches: [astra-check-wp08]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact product commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Record checked source and base
        env:
          PRODUCT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          git rev-parse --verify origin/dev
          git merge-base HEAD origin/dev
          mkdir -p "$RUNNER_TEMP/wp08-check-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/wp08-check-evidence/product-sha.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/wp08-check-evidence/product-tree.txt"
          git rev-parse origin/dev > "$RUNNER_TEMP/wp08-check-evidence/guard-base.txt"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Package typecheck
        id: typecheck
        working-directory: modules/sucafina
        run: |
          set -o pipefail
          bun typecheck 2>&1 | tee "$RUNNER_TEMP/wp08-check-evidence/typecheck.log"

      - name: Repository guards
        id: guards
        if: always() && steps.typecheck.outcome != 'skipped'
        run: |
          set -o pipefail
          bun run check:guards --base origin/dev 2>&1 | tee "$RUNNER_TEMP/wp08-check-evidence/guards.log"

      - name: Upload check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: astra-wp08-check-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wp08-check-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Require both checks
        if: always()
        env:
          TYPECHECK_RESULT: ${{ steps.typecheck.outcome }}
          GUARDS_RESULT: ${{ steps.guards.outcome }}
        run: |
          test "$TYPECHECK_RESULT" = success
          test "$GUARDS_RESULT" = success
