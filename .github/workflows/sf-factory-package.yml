name: sf-factory-package

on:
  push:
    branches: [sfa-factory-package]

permissions:
  contents: read

concurrency:
  group: sf-factory-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-factory:
    name: linux-factory (compiled + extracted)
    if: github.repository == 'gustavomhss/Orchestra-SF' && github.ref == 'refs/heads/sfa-factory-package'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch HEAD
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15"
      - name: Setup Bun 1.3.14 x64 baseline
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64-baseline.zip
          no-cache: true
      - name: Install pinned dependencies
        run: bun install --frozen-lockfile
      - name: Build real native Omni companions
        working-directory: native/omni
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          rustup show active-toolchain || rustup toolchain install
          cargo build --locked --release -p hugr-omni-node -p omni-supervisor
      - name: Compile, package, archive, extract outside checkout, and load factory
        working-directory: apps/cli
        env:
          ORCHESTRA_OMNI_CONTROL: suite
          ORCHESTRA_EXPERIMENTAL_OMNI_SPAWNER: strict
        run: bun test ./test/factory-distribution-linux.test.ts --timeout 1800000
      - name: Upload factual proof receipt
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sf-factory-package-${{ github.sha }}
          path: distribution-logs/factory-package-receipt.json
          if-no-files-found: error
          retention-days: 7
