name: corporate-recovery-policy

on:
  push:
    branches: [recovery-policy-ci]

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      ORCHESTRA_EXPERIMENTAL_OMNI_SPAWNER: strict
      ORCHESTRA_OMNI_CONTROL: declared
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact recovery policy source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: "a2b6ebe9ccc2e6547a19229156600dd32f810581"
          fetch-depth: 0
          persist-credentials: false
      - name: Record source and changed paths
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "a2b6ebe9ccc2e6547a19229156600dd32f810581"
          test "$(git rev-parse 'HEAD^{tree}')" = "cc99d26a6230429bf8e9dc56d37b1cd2337d59de"
          mkdir -m 700 "$RUNNER_TEMP/recovery-policy-controls"
          git rev-parse HEAD 'HEAD^{tree}' origin/dev > "$RUNNER_TEMP/recovery-policy-controls/refs.txt"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/recovery-policy-controls/workflow-sha.txt"
          git diff --name-only "$(git merge-base HEAD origin/dev)" HEAD > "$RUNNER_TEMP/recovery-policy-controls/changed-paths.txt"
          git diff --check "$(git merge-base HEAD origin/dev)" HEAD
          while IFS= read -r file; do sha256sum "$file"; done < "$RUNNER_TEMP/recovery-policy-controls/changed-paths.txt" > "$RUNNER_TEMP/recovery-policy-controls/source.sha256"
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/ripgrep
      - uses: ./.github/actions/omni-binaries
      - name: Own the invocation nonce
        run: |
          set -euo pipefail
          nonce=$(node -e "process.stdout.write(require('node:crypto').randomBytes(16).toString('hex'))")
          printf '%s\n' "$nonce" > "$RUNNER_TEMP/recovery-policy-controls/omni-nonce.txt"
          printf 'ORCHESTRA_OMNI_CONTROL_NONCE=%s\n' "$nonce" >> "$GITHUB_ENV"
      - name: Exercise current Team policy and real restore boundaries
        working-directory: modules/sucafina
        run: |
          set -euo pipefail
          GITHUB_ACTIONS=false bun test \
            ./Sucafinav1/test/corporate-checkpoint-http.test.ts \
            ./Sucafinav1/test/local-backups.test.ts \
            ./Sucafinav1/test/corporate-restore-retention.test.ts \
            ./Sucafinav1/test/corporate-recovery-register.test.ts \
            --timeout 30000 --reporter=junit "--reporter-outfile=$RUNNER_TEMP/recovery-policy-controls/report.xml" \
            2>&1 | tee "$RUNNER_TEMP/recovery-policy-controls/bun.log"
      - name: Typecheck module
        working-directory: modules/sucafina
        run: |
          set -euo pipefail
          bun typecheck 2>&1 | tee "$RUNNER_TEMP/recovery-policy-controls/typecheck.log"
      - name: Canonical guards
        run: |
          set -euo pipefail
          bun run check:guards --base origin/dev 2>&1 | tee "$RUNNER_TEMP/recovery-policy-controls/guards.log"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Verify original test report and write bounded component receipt
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, xml.etree.ElementTree as ET
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "recovery-policy-controls"
          cases = list(ET.parse(root / "report.xml").getroot().iter("testcase"))
          assert cases and not any(c.find("failure") is not None or c.find("error") is not None for c in cases)
          skipped = [c.attrib.get("name") for c in cases if c.find("skipped") is not None]
          assert skipped == ["foreign-owned existing root rejects (requires root fixture privileges)"]
          selected = [c for c in cases if c.attrib.get("name", "").startswith("corporate recovery ")]
          assert len(selected) == 8 and not any(c.find("skipped") is not None for c in selected)
          retained = [c for c in cases if c.attrib.get("name", "").startswith("external restore comparison rejects")]
          assert len(retained) == 1 and retained[0].find("skipped") is None
          nonce = (root / "omni-nonce.txt").read_text().strip()
          verdicts = re.findall(r"omni positive control \[" + re.escape(nonce) + r"\]: ([^\r\n]+)", (root / "bun.log").read_text())
          assert len(verdicts) == 1 and (verdicts[0].startswith("pass ") or verdicts[0].startswith("not applicable "))
          receipt = {"schema": "sf-corporate-recovery-policy-controls-v1", "sourceSha": "a2b6ebe9ccc2e6547a19229156600dd32f810581",
              "sourceTree": "cc99d26a6230429bf8e9dc56d37b1cd2337d59de", "workflowSha": os.environ["GITHUB_SHA"],
              "runId": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "tests": len(cases), "newPolicyCases": len(selected), "originalRetentionCases": len(retained), "skipped": skipped,
              "class": "HTTP_POLICY_AND_FILESYSTEM_COMPONENT_CONTROLS", "identityProvider": "CONTROLLED_RECOVERY_ADMISSION",
              "productSeed": "DECLARED_SQLITE_FIXTURE", "policyMutations": "ORIGINAL_POLICY_STORE_SQLITE",
              "installedTeamsProof": False, "independentApproval": False,
              "g10Closed": False, "productionCutover": False,
              "hashes": {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir() if p.is_file()}}
          (root / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps({"tests": len(cases), "newPolicyCases": len(selected), "originalRetentionCases": len(retained), "skipped": skipped}))
          PY
      - name: Preserve original evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: corporate-recovery-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-policy-controls
          if-no-files-found: error
          retention-days: 14
