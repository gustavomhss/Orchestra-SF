name: astra-operations-check

on:
  push:
    branches: [astra-check-operations-*]

permissions:
  contents: read

concurrency:
  group: astra-operations-check
  cancel-in-progress: false

jobs:
  scoped-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout check envelope
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify product SHA and unchanged product tree
        id: product
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const input = JSON.parse(readFileSync('.astra-operations-check.json', 'utf8'))
          const keys = Object.keys(input).sort().join(',')
          if (keys !== (input.mode === 'guards' ? 'devSha,mode,productSha,typecheckSha' : 'devSha,productSha') ||
              (input.mode !== undefined && input.mode !== 'guards') ||
              (input.mode === 'guards' && (typeof input.typecheckSha !== 'string' || !/^[a-f0-9]{40}$/.test(input.typecheckSha))) ||
              ![input.productSha, input.devSha].every(value => typeof value === 'string' && /^[a-f0-9]{40}$/.test(value)))
            throw new Error('Invalid operations check envelope')
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim()
          if (git('rev-parse', 'HEAD') !== process.env.GITHUB_SHA || git('rev-parse', 'HEAD^') !== input.productSha)
            throw new Error('Check snapshot must descend directly from product')
          if (git('diff-tree', '--no-commit-id', '--name-status', '-r', input.productSha, 'HEAD') !== 'A\t.astra-operations-check.json')
            throw new Error('Product blobs changed in check snapshot')
          git('merge-base', '--is-ancestor', '91e1f60bc6f7e85517e2b4f963eec5ac7da13e62', input.productSha)
          git('merge-base', '--is-ancestor', 'e7fd8ff797441681f360e7775155a8cc2830280c', input.productSha)
          if (input.mode === 'guards') {
            git('merge-base', '--is-ancestor', input.typecheckSha, input.productSha)
            const paths = git('diff', '--name-only', input.typecheckSha, input.productSha).split('\n').filter(Boolean)
            if (paths.some(path => !/^modules\/sucafina\/Sucafinav1\/docs\/sf2h\/receipts\/WP(?:04|06)\/operations-20261114\/[^\n]+\.(?:md|json|patch|log|txt)$/.test(path)))
              throw new Error('Guard-only mode requires unchanged product, tests, fixtures and configuration')
            console.log(`Reusing recorded typecheck result for unchanged code at ${input.typecheckSha}`)
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `sha=${input.productSha}\ndev=${input.devSha}\nmode=${input.mode ?? 'all'}\n`)
          NODE

      - name: Checkout exact product
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ steps.product.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record product and guard base
        env:
          PRODUCT_SHA: ${{ steps.product.outputs.sha }}
          DEV_SHA: ${{ steps.product.outputs.dev }}
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git rev-parse origin/dev)" = "$DEV_SHA"
          mkdir -p "$RUNNER_TEMP/astra-operations-evidence"
          git merge-base HEAD origin/dev > "$RUNNER_TEMP/astra-operations-evidence/merge-base.txt"
          git rev-parse HEAD HEAD^{tree} origin/dev > "$RUNNER_TEMP/astra-operations-evidence/revisions.txt"

      - name: Setup Bun
        id: setup
        uses: ./.github/actions/setup-bun

      - name: Typecheck Sucafina
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.product.outputs.mode != 'guards' }}
        working-directory: modules/sucafina
        run: |
          set -o pipefail
          bun typecheck 2>&1 | tee "$RUNNER_TEMP/astra-operations-evidence/sucafina-typecheck.log"

      - name: Typecheck CLI consumers
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.product.outputs.mode != 'guards' }}
        working-directory: apps/cli
        run: |
          set -o pipefail
          bun typecheck 2>&1 | tee "$RUNNER_TEMP/astra-operations-evidence/cli-typecheck.log"

      - name: Guard product against origin/dev
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -o pipefail
          bun run check:guards --base origin/dev 2>&1 | tee "$RUNNER_TEMP/astra-operations-evidence/guards.log"

      - name: Upload check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: astra-operations-check-${{ github.run_attempt }}
          path: ${{ runner.temp }}/astra-operations-evidence
          if-no-files-found: error
          retention-days: 14
