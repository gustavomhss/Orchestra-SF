name: g08-domain-bridge

on:
  push:
    branches: ["team-domain-bridge"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g08-domain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  component:
    if: github.repository == 'gustavomhss/Orchestra-SF' && github.repository_id == '1455724710'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ORCHESTRA_OMNI_CONTROL: declared
      ORCHESTRA_EXPERIMENTAL_OMNI_SPAWNER: strict
      ORCHESTRA_CHANNEL: prod
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15"
      - name: Bind the component source
        run: |
          set -euo pipefail
          proof_output="$RUNNER_TEMP/g08-domain-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$proof_output"
          printf 'SF_G08_DOMAIN_EVIDENCE=%s\n' "$proof_output" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$proof_output/source.sha"
          git rev-parse 'HEAD^{tree}' > "$proof_output/source.tree"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: ./.github/actions/setup-bun
        id: install
        with:
          reuse-node: "true"
      - name: Exercise original Application Domain CAS and durable Team partitions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/cli
        run: |
          set -euo pipefail
          export ORCHESTRA_OMNI_CONTROL_NONCE="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(16).toString("hex"))')"
          bun test --timeout 30000 --reporter=junit --reporter-outfile "$SF_G08_DOMAIN_EVIDENCE/producer.junit.xml" ./test/team-native-domain.test.ts 2>&1 | tee "$SF_G08_DOMAIN_EVIDENCE/producer.log"
      - name: Exercise browser wire ownership and ambiguous-result fences
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/client
        run: |
          set -euo pipefail
          export ORCHESTRA_OMNI_CONTROL_NONCE="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(16).toString("hex"))')"
          bun test --preload ../../script/test-omni-control.ts --timeout 10000 --reporter=junit --reporter-outfile "$SF_G08_DOMAIN_EVIDENCE/client.junit.xml" ./test/sucafina-team-domain.test.ts 2>&1 | tee "$SF_G08_DOMAIN_EVIDENCE/client.log"
      - name: Typecheck Client through its package command
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/client
        run: |
          set -euo pipefail
          bun typecheck 2>&1 | tee "$SF_G08_DOMAIN_EVIDENCE/client-types.log"
      - name: Typecheck the original CLI composition through its package command
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/cli
        run: |
          set -euo pipefail
          bun typecheck 2>&1 | tee "$SF_G08_DOMAIN_EVIDENCE/cli-types.log"
      - name: Check guards against origin dev
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail
          bun run check:guards --base origin/dev 2>&1 | tee "$SF_G08_DOMAIN_EVIDENCE/guards.log"
      - name: Require complete focal inventories and preserve source receipts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path(os.environ["GITHUB_WORKSPACE"])
          output = Path(os.environ["SF_G08_DOMAIN_EVIDENCE"])
          suites = [
              ("producer", "apps/cli/test/team-native-domain.test.ts", 9),
              ("client", "packages/client/test/sucafina-team-domain.test.ts", 11),
          ]
          reports = []
          for name, source, expected_count in suites:
              expected = re.findall(r'^test\("([^"]+)"', (root / source).read_text(), re.M)
              if len(expected) != expected_count or len(set(expected)) != expected_count:
                  raise SystemExit("G08_DOMAIN_SOURCE_INVENTORY_MISMATCH")
              report = output / (name + ".junit.xml")
              cases = ET.parse(report).getroot().findall(".//testcase")
              if sorted(x.attrib.get("name") for x in cases) != sorted(expected):
                  raise SystemExit("G08_DOMAIN_JUNIT_INVENTORY_MISMATCH")
              if any(x.find(tag) is not None for x in cases for tag in ("failure", "error", "skipped")):
                  raise SystemExit("G08_DOMAIN_NON_PASS_CASE")
              logs = (output / (name + ".log")).read_text()
              if len(re.findall(r'omni positive control \[[0-9a-f]{32}\]: (?:pass|not applicable)', logs)) != 1:
                  raise SystemExit("G08_DOMAIN_OMNI_CONTROL_MISSING")
              reports.append({"suite": name, "tests": len(cases), "failures": 0, "skips": 0,
                  "source": source, "junitSha256": hashlib.sha256(report.read_bytes()).hexdigest()})
          paths = [
              "apps/cli/src/sucafina-product/team-native-domain.ts",
              "apps/cli/test/team-native-domain.test.ts",
              "packages/client/src/sucafina/team-domain.ts",
              "packages/client/test/sucafina-team-domain.test.ts",
              ".github/workflows/g08-domain-bridge.yml",
          ]
          receipt = {
              "schema": "sf-g08-domain-bridge-component-v1",
              "status": "COMPONENT_CONTROLS_VERIFIED",
              "source": {"sha": (output / "source.sha").read_text().strip(),
                  "tree": (output / "source.tree").read_text().strip()},
              "run": {"id": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"]},
              "files": [{"path": name, "sha256": hashlib.sha256((root / name).read_bytes()).hexdigest()} for name in paths],
              "reports": reports,
              "proofScope": ["original Application/Domain HTTP Request/Response and SQLite", "controlled browser wire/lifecycle"],
              "microsoftObservation": "CONTROLLED_COMPONENT_BOUNDARY",
              "factoryHooksIntegrated": False, "installed": False, "g08Closed": False,
              "productionCutover": False,
          }
          (output / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps({"source": receipt["source"], "reports": reports, "installed": False, "g08Closed": False}))
          PY
      - name: Preserve component evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g08-domain-component-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/g08-domain-${{ github.run_id }}-${{ github.run_attempt }}/
