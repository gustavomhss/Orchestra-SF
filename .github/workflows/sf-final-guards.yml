name: sf-final-guards

on:
  push:
    branches: [sf-final-guards]

permissions:
  contents: read

concurrency:
  group: sf-final-guards-once
  cancel-in-progress: false

env:
  CI: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SF_FINAL_SHA: "__FROZEN_SHA__"

jobs:
  guards:
    name: sf/final-guards-exact
    if: github.repository == 'gustavomhss/Orchestra-SF' && github.event.repository.id == 1455724710 && github.ref == 'refs/heads/sf-final-guards' && github.event.created == true && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify first driver creation and direct frozen parent
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'
          const event = JSON.parse(await readFile(process.env.GITHUB_EVENT_PATH, 'utf8'))
          const expected = process.env.SF_FINAL_SHA
          const driver = process.env.GITHUB_SHA
          const requireState = (ok, message) => { if (!ok) throw new Error(message) }
          requireState(/^[a-f0-9]{40}$/.test(expected || '') && /^[a-f0-9]{40}$/.test(driver || ''),
            'A real frozen SHA and driver SHA are required')
          requireState(process.env.GITHUB_EVENT_NAME === 'push' &&
            process.env.GITHUB_REPOSITORY === 'gustavomhss/Orchestra-SF' &&
            event.repository?.id === 1455724710 &&
            process.env.GITHUB_REF === 'refs/heads/sf-final-guards' &&
            event.ref === process.env.GITHUB_REF && event.created === true &&
            event.deleted !== true && event.forced !== true &&
            event.before === '0'.repeat(40) && event.after === driver &&
            process.env.GITHUB_RUN_ATTEMPT === '1',
            'Only the first creation of this guard driver branch is admitted')
          const response = await fetch('https://api.github.com/repos/gustavomhss/Orchestra-SF/git/commits/' + driver, {
            redirect: 'error', signal: AbortSignal.timeout(10000),
            headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + process.env.GH_READ_TOKEN,
              'X-GitHub-Api-Version': '2022-11-28' },
          })
          if (response.status !== 200) throw new Error('Guard driver commit unavailable')
          const commit = await response.json()
          requireState(commit.sha === driver && Array.isArray(commit.parents) &&
            commit.parents.length === 1 && commit.parents[0].sha === expected,
            'The guard driver must be a direct child of the frozen candidate')
          NODE
      - name: Checkout the frozen candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.SF_FINAL_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen checkout and select its Bun version
        id: bun
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SF_FINAL_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(git rev-parse HEAD)" = "$SF_FINAL_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          guard_bun_version="$(node -p "require('./package.json').packageManager.replace(/^bun@/, '')")"
          [[ "$guard_bun_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'url=https://github.com/oven-sh/bun/releases/download/bun-v%s/bun-linux-x64-baseline.zip\n' "$guard_bun_version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-download-url: ${{ steps.bun.outputs.url }}
      - name: Fetch the actual origin dev without persisting credentials
        shell: bash
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          guard_fetch_auth="$(printf 'x-access-token:%s' "$GH_READ_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $guard_fetch_auth" git fetch --no-tags origin +refs/heads/dev:refs/remotes/origin/dev
          unset guard_fetch_auth GH_READ_TOKEN
          git cat-file -e 'origin/dev^{commit}'
          test "$(git rev-parse HEAD)" = "$SF_FINAL_SHA"
      - name: Verify the integration branch is still frozen
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://api.github.com/repos/gustavomhss/Orchestra-SF/git/ref/heads/sf-join-four', {
            redirect: 'error',
            headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + process.env.GH_READ_TOKEN,
              'X-GitHub-Api-Version': '2022-11-28' },
          })
          if (response.status !== 200) throw new Error('Frozen integration reference unavailable')
          const ref = await response.json()
          if (ref.ref !== 'refs/heads/sf-join-four' || ref.object?.type !== 'commit' || ref.object.sha !== process.env.SF_FINAL_SHA)
            throw new Error('Integration moved after the candidate was frozen')
          NODE
      - name: Run exact canonical guards and retain the original exit status
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SF_FINAL_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          unset GUARDRAIL_APPROVED GUARDRAIL_BASE_REF
          guard_evidence="$RUNNER_TEMP/sf-final-guards"
          mkdir -p "$guard_evidence"
          {
            printf 'candidate=%s\n' "$(git rev-parse HEAD)"
            printf 'tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
            printf 'origin_dev=%s\n' "$(git rev-parse 'origin/dev^{commit}')"
            printf 'merge_base=%s\n' "$(git merge-base origin/dev HEAD)"
            printf 'workflow_commit=%s\n' "$GITHUB_SHA"
            printf 'run=%s\nattempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'bun=%s\n' "$(bun --version)"
            printf 'command=bun run check:guards --base origin/dev\n'
          } > "$guard_evidence/identity.txt"
          set +e
          bun run check:guards --base origin/dev > "$guard_evidence/guards.log" 2>&1
          guard_status=$?
          set -e
          printf '%s\n' "$guard_status" > "$guard_evidence/exit-code.txt"
          sha256sum "$guard_evidence/guards.log" "$guard_evidence/identity.txt" "$guard_evidence/exit-code.txt" > "$guard_evidence/SHA256SUMS"
          cat "$guard_evidence/guards.log"
          exit "$guard_status"
      - name: Retain guard evidence including inherited GATE findings
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sf-final-guards-${{ env.SF_FINAL_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sf-final-guards/
          if-no-files-found: error
          retention-days: 14
