name: go-live-package

on:
  push:
    branches: [go-live-package]
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/go-live-package.yml
      - script/sf-ci/go-live-package*
      - script/sf-ci/test_go_live_package_archive.py
      - sf/azure/vm/install-factory-distribution.py
  workflow_dispatch:
    inputs:
      request_revision:
        description: Commit SHA containing the observed confirmations and producer artifact request
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact verifier
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15"
      - name: Bun for repository guards
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Source admission controls
        run: node --test script/sf-ci/go-live-package.test.mjs
      - name: Actual archive and existing installer controls
        run: python3 -B script/sf-ci/test_go_live_package_archive.py
      - name: Repository guards
        run: bun run check:guards --base origin/dev

  qualify:
    needs: controls
    if: github.event_name == 'workflow_dispatch' && github.repository == 'gustavomhss/Orchestra-SF' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout reviewed verifier
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15"
      - name: Read pinned request
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_REVISION: ${{ inputs.request_revision }}
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'JS'
          import assert from "node:assert/strict"
          import { createHash } from "node:crypto"
          import { writeFile } from "node:fs/promises"
          const revision = process.env.REQUEST_REVISION
          assert(/^[0-9a-f]{40}$/.test(revision), "full request commit SHA required")
          const path = "docs/qa/sucafina/go-live/g07-request.json"
          const response = await fetch("https://api.github.com/repos/gustavomhss/Orchestra-SF/contents/" + path + "?ref=" + revision, {
            headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + process.env.GH_TOKEN,
              "X-GitHub-Api-Version": "2022-11-28" },
            redirect: "error", signal: AbortSignal.timeout(30000)
          })
          assert(response.ok, "versioned G07 request unavailable")
          const item = await response.json()
          assert(item.type === "file" && item.path === path && item.encoding === "base64" && item.size <= 131072,
            "invalid request identity or size")
          const bytes = Buffer.from(item.content, "base64")
          assert.equal(bytes.length, item.size, "request byte count mismatch")
          const blob = createHash("sha1").update("blob " + bytes.length + "\0").update(bytes).digest("hex")
          assert.equal(blob, item.sha, "request Git blob mismatch")
          await writeFile(process.env.RUNNER_TEMP + "/g07-request.json", bytes, { flag: "wx", mode: 0o600 })
          await writeFile(process.env.RUNNER_TEMP + "/g07-request-source.json", JSON.stringify({
            repository: "gustavomhss/Orchestra-SF", revision, path, blobSha: item.sha,
            sha256: createHash("sha256").update(bytes).digest("hex")
          }, null, 2) + "\n", { flag: "wx", mode: 0o600 })
          JS
      - name: Verify both confirmations and actual producer metadata
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tooling/script/sf-ci/go-live-package.mjs admit "$RUNNER_TEMP/g07-request.json" "$RUNNER_TEMP/g07-admission.json"
          node --input-type=module <<'JS'
          import assert from "node:assert/strict"
          import { appendFile, readFile } from "node:fs/promises"
          const result = JSON.parse(await readFile(process.env.RUNNER_TEMP + "/g07-admission.json", "utf8"))
          assert(/^[0-9a-f]{40}$/.test(result.candidate.sha) && /^[0-9a-f]{40}$/.test(result.candidate.tree))
          await appendFile(process.env.GITHUB_OUTPUT, "candidate=" + result.candidate.sha + "\ntree=" + result.candidate.tree + "\n")
          JS
      - name: Download the original producer ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/script/sf-ci/go-live-package.mjs download "$RUNNER_TEMP/g07-admission.json" "$RUNNER_TEMP/g07-artifact.zip"
      - name: Checkout exact admitted candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ steps.admission.outputs.candidate }}
          path: candidate
          persist-credentials: false
      - name: Verify candidate tree and original tar without installation
        env:
          CANDIDATE_SHA: ${{ steps.admission.outputs.candidate }}
          CANDIDATE_TREE: ${{ steps.admission.outputs.tree }}
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          test -z "$(git -C candidate status --porcelain)"
          python3 -B tooling/script/sf-ci/go-live-package-archive.py \
            --zip "$RUNNER_TEMP/g07-artifact.zip" \
            --admission "$RUNNER_TEMP/g07-admission.json" \
            --installer "$GITHUB_WORKSPACE/candidate/sf/azure/vm/install-factory-distribution.py" \
            --out "$RUNNER_TEMP/g07-verification"
      - name: Recheck live confirmations before publishing evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tooling/script/sf-ci/go-live-package.mjs admit "$RUNNER_TEMP/g07-request.json" "$RUNNER_TEMP/g07-admission-final.json"
          node --input-type=module <<'JS'
          import assert from "node:assert/strict"
          import { readFile } from "node:fs/promises"
          const first = JSON.parse(await readFile(process.env.RUNNER_TEMP + "/g07-admission.json", "utf8"))
          const final = JSON.parse(await readFile(process.env.RUNNER_TEMP + "/g07-admission-final.json", "utf8"))
          delete first.verifier.observedAt
          delete final.verifier.observedAt
          assert.deepEqual(first, final, "live source changed during package verification")
          JS
      - name: Publish package evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g07-qualification-${{ steps.admission.outputs.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/g07-verification/g07-package-receipt.json
            ${{ runner.temp }}/g07-verification/g07-zip-inventory.json
            ${{ runner.temp }}/g07-admission.json
            ${{ runner.temp }}/g07-admission-final.json
            ${{ runner.temp }}/g07-request-source.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: State proof boundary
        run: |
          printf '%s\n' \
            '### G07 package verification' \
            '' \
            'The original Release archive, its components and both source confirmations were verified.' \
            'Installation evidence is still required: installation=null, g07Closed=false, productionCutover=false.' \
            >> "$GITHUB_STEP_SUMMARY"
