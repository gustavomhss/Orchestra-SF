name: go-live-package

on:
  push:
    branches: [go-live-package, g07-qualify-*]
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/go-live-package.yml
      - .github/workflows/g09-final.yml
      - script/sf-ci/go-live-package*
      - script/sf-ci/test_go_live_package_archive.py
      - sf/azure/vm/install-factory-distribution.py
  workflow_dispatch:
    inputs:
      request_revision:
        description: Commit SHA containing the observed confirmations and producer artifact request
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact verifier
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15"
      - name: Bun for repository guards
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Source admission controls
        run: |
          set -euo pipefail
          node --test --test-reporter=tap script/sf-ci/go-live-package.test.mjs 2>&1 | tee "$RUNNER_TEMP/g07-controls-node.log"
      - name: Actual archive and existing installer controls
        run: |
          set -euo pipefail
          python3 -B script/sf-ci/test_go_live_package_archive.py 2>&1 | tee "$RUNNER_TEMP/g07-controls-python.log"
      - name: Repository guards
        run: |
          set -euo pipefail
          bun run check:guards --base origin/dev 2>&1 | tee "$RUNNER_TEMP/g07-controls-guards.log"
      - name: Bind component controls to their actual checkout
        env:
          CHECK_RUN_ID: ${{ job.check_run_id }}
        run: |
          set -euo pipefail
          export SOURCE_SHA="$(git rev-parse HEAD)"
          export SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          export BASE_SHA="$(git rev-parse origin/dev)"
          export MERGE_BASE="$(git merge-base HEAD origin/dev)"
          export BUN_VERSION="$(bun --version)"
          export PYTHON_VERSION="$(python3 --version)"
          node --input-type=module <<'JS'
          import assert from "node:assert/strict"
          import { createHash } from "node:crypto"
          import { readFile, writeFile } from "node:fs/promises"
          const hash = (bytes) => createHash("sha256").update(bytes).digest("hex")
          const temp = process.env.RUNNER_TEMP
          const node = await readFile(temp + "/g07-controls-node.log", "utf8")
          const python = await readFile(temp + "/g07-controls-python.log", "utf8")
          const counts = Object.fromEntries(["tests", "pass", "fail", "cancelled", "skipped", "todo"].map((name) => {
            const match = node.match(new RegExp("^# " + name + " (\\d+)$", "m"))
            assert(match, "missing Node control summary: " + name)
            return [name, Number(match[1])]
          }))
          assert(counts.tests > 0 && counts.pass === counts.tests)
          for (const name of ["fail", "cancelled", "skipped", "todo"]) assert.equal(counts[name], 0)
          const pythonCount = Number(python.match(/^Ran (\d+) tests? in /m)?.[1])
          assert(pythonCount > 0)
          assert.match(python, /^OK$/m)
          const source = { sha: process.env.SOURCE_SHA, tree: process.env.SOURCE_TREE,
            base: process.env.BASE_SHA, mergeBase: process.env.MERGE_BASE }
          for (const value of Object.values(source)) assert(/^[0-9a-f]{40}$/.test(value))
          const paths = [
            ".github/workflows/g09-final.yml", ".github/workflows/go-live-package.yml",
            "script/sf-ci/go-live-package.mjs", "script/sf-ci/go-live-package.test.mjs",
            "script/sf-ci/go-live-package-archive.py", "script/sf-ci/test_go_live_package_archive.py",
            "sf/azure/vm/install-factory-distribution.py"
          ]
          const files = []
          for (const path of paths) files.push({ path, sha256: hash(await readFile(path)) })
          const logs = []
          for (const name of ["node", "python", "guards"]) {
            const path = "g07-controls-" + name + ".log"
            logs.push({ path, sha256: hash(await readFile(temp + "/" + path)) })
          }
          const receipt = {
            schema: "sf-g07-controls-v1", status: "COMPONENT_CONTROLS_PASSED", source, files, logs,
            execution: { eventSha: process.env.GITHUB_SHA, workflowRef: process.env.GITHUB_WORKFLOW_REF,
              runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
              job: process.env.GITHUB_JOB, checkRunId: process.env.CHECK_RUN_ID },
            toolchain: { node: process.version, bun: process.env.BUN_VERSION, python: process.env.PYTHON_VERSION },
            controls: { node: counts, python: pythonCount,
              guards: { command: "bun run check:guards --base origin/dev", status: "PASSED" } },
            scope: "synthetic-source-and-fixture-archive-controls",
            releaseTarProduced: false, installation: null, g07Closed: false, productionCutover: false
          }
          await writeFile(temp + "/g07-controls-receipt.json", JSON.stringify(receipt, null, 2) + "\n",
            { flag: "wx", mode: 0o600 })
          JS
      - name: Preserve component evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g07-route-controls-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/g07-controls-node.log
            ${{ runner.temp }}/g07-controls-python.log
            ${{ runner.temp }}/g07-controls-guards.log
            ${{ runner.temp }}/g07-controls-receipt.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

  qualify:
    needs: controls
    if: github.repository == 'gustavomhss/Orchestra-SF' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev') || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/g07-qualify-')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout reviewed verifier
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15"
      - name: Read pinned request
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_REVISION: ${{ inputs.request_revision }}
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'JS'
          import { writeFile } from "node:fs/promises"
          import { readQualificationRequest } from "./tooling/script/sf-ci/go-live-package.mjs"
          const loaded = await readQualificationRequest({
            repository: process.env.GITHUB_REPOSITORY, eventName: process.env.GITHUB_EVENT_NAME,
            ref: process.env.GITHUB_REF, sha: process.env.GITHUB_SHA, requestRevision: process.env.REQUEST_REVISION
          })
          await writeFile(process.env.RUNNER_TEMP + "/g07-request.json", loaded.raw, { flag: "wx", mode: 0o600 })
          await writeFile(process.env.RUNNER_TEMP + "/g07-request-source.json",
            JSON.stringify(loaded.source, null, 2) + "\n", { flag: "wx", mode: 0o600 })
          JS
      - name: Verify both confirmations and actual producer metadata
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tooling/script/sf-ci/go-live-package.mjs admit "$RUNNER_TEMP/g07-request.json" "$RUNNER_TEMP/g07-admission.json"
          node --input-type=module <<'JS'
          import assert from "node:assert/strict"
          import { appendFile, readFile } from "node:fs/promises"
          const result = JSON.parse(await readFile(process.env.RUNNER_TEMP + "/g07-admission.json", "utf8"))
          assert(/^[0-9a-f]{40}$/.test(result.candidate.sha) && /^[0-9a-f]{40}$/.test(result.candidate.tree))
          await appendFile(process.env.GITHUB_OUTPUT, "candidate=" + result.candidate.sha + "\ntree=" + result.candidate.tree + "\n")
          JS
      - name: Download the original producer ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/script/sf-ci/go-live-package.mjs download "$RUNNER_TEMP/g07-admission.json" "$RUNNER_TEMP/g07-artifact.zip"
      - name: Checkout exact admitted candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ steps.admission.outputs.candidate }}
          path: candidate
          persist-credentials: false
      - name: Verify candidate tree and original tar without installation
        env:
          CANDIDATE_SHA: ${{ steps.admission.outputs.candidate }}
          CANDIDATE_TREE: ${{ steps.admission.outputs.tree }}
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          test -z "$(git -C candidate status --porcelain)"
          python3 -B tooling/script/sf-ci/go-live-package-archive.py \
            --zip "$RUNNER_TEMP/g07-artifact.zip" \
            --admission "$RUNNER_TEMP/g07-admission.json" \
            --installer "$GITHUB_WORKSPACE/candidate/sf/azure/vm/install-factory-distribution.py" \
            --out "$RUNNER_TEMP/g07-verification"
      - name: Recheck live confirmations before publishing evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tooling/script/sf-ci/go-live-package.mjs admit "$RUNNER_TEMP/g07-request.json" "$RUNNER_TEMP/g07-admission-final.json"
          node --input-type=module <<'JS'
          import { readFile } from "node:fs/promises"
          import { sameAdmission } from "./tooling/script/sf-ci/go-live-package.mjs"
          const first = JSON.parse(await readFile(process.env.RUNNER_TEMP + "/g07-admission.json", "utf8"))
          const final = JSON.parse(await readFile(process.env.RUNNER_TEMP + "/g07-admission-final.json", "utf8"))
          sameAdmission(first, final)
          JS
      - name: Publish package evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g07-qualification-${{ steps.admission.outputs.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/g07-verification/g07-package-receipt.json
            ${{ runner.temp }}/g07-verification/g07-zip-inventory.json
            ${{ runner.temp }}/g07-admission.json
            ${{ runner.temp }}/g07-admission-final.json
            ${{ runner.temp }}/g07-request-source.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: State proof boundary
        run: |
          printf '%s\n' \
            '### G07 package verification' \
            '' \
            'The original Release archive, its components and both source confirmations were verified.' \
            'Installation evidence is still required: installation=null, g07Closed=false, productionCutover=false.' \
            >> "$GITHUB_STEP_SUMMARY"
