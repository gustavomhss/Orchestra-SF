name: g08-restart-observer

on:
  push:
    branches: ["az02-host-restart"]

permissions:
  contents: read

concurrency:
  group: g08-restart-observer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controls:
    if: github.repository == 'gustavomhss/Orchestra-SF' && github.repository_id == '1455724710'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15"
      - name: Bind the observer control source
        run: |
          set -euo pipefail
          proof_output="$RUNNER_TEMP/g08-restart-controls-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$proof_output"
          printf 'SF_RESTART_CONTROLS=%s\n' "$proof_output" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$proof_output/source-sha.txt"
          git rev-parse 'HEAD^{tree}' > "$proof_output/source-tree.txt"
          git rev-parse origin/dev > "$proof_output/guard-base.txt"
      - name: Exercise the original AZ02 producer controls
        run: |
          set -euo pipefail
          node --test --test-reporter=tap sf/azure/identity/az02-proof.test.cjs 2>&1 | tee "$SF_RESTART_CONTROLS/az02.tap"
      - name: Exercise original host controls and restart transition refusals
        run: |
          set -euo pipefail
          python3 script/sf-ci/test_g08_installed_preflight.py -v 2>&1 | tee "$SF_RESTART_CONTROLS/observer.txt"
      - uses: ./.github/actions/setup-bun
        with:
          reuse-node: "true"
      - name: Check all guards against origin dev
        run: |
          set -euo pipefail
          bun run check:guards --base origin/dev 2>&1 | tee "$SF_RESTART_CONTROLS/guards.log"
          git diff --check origin/dev...HEAD
      - name: Bind only control results to this source
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict"
          import { readFileSync, readdirSync, writeFileSync } from "node:fs"
          import { createHash } from "node:crypto"
          const root = process.env.SF_RESTART_CONTROLS
          const digest = (value) => createHash("sha256").update(value).digest("hex")
          const read = (name) => readFileSync(root + "/" + name, "utf8")
          const tap = read("az02.tap"), python = read("observer.txt")
          const total = Number(tap.match(/^# tests (\d+)$/m)?.[1])
          assert(total === 42, "AZ02_ORIGINAL_CONTROLS_REQUIRED")
          for (const [name, count] of [["pass", total], ["fail", 0], ["cancelled", 0], ["skipped", 0], ["todo", 0]])
            assert(new RegExp("^# " + name + " " + count + "$", "m").test(tap), "AZ02_CONTROL_" + name)
          assert(/Ran 49 tests in [0-9.]+s\s+OK\s*$/m.test(python), "OBSERVER_EXACT_49_CONTROLS_REQUIRED")
          const source = { sha: read("source-sha.txt").trim(), tree: read("source-tree.txt").trim() }
          assert.equal(source.sha, process.env.GITHUB_SHA)
          const paths = ["script/sf-ci/g08-installed-preflight.py", "script/sf-ci/test_g08_installed_preflight.py",
            ".github/workflows/g08-restart-observer.yml", "sf/azure/identity/az02-proof.cjs",
            "sf/azure/identity/az02-proof.test.cjs", "sf/azure/vm/install-factory-distribution.py"]
          const sources = paths.map((path) => ({ path, sha256: digest(readFileSync(path)) }))
          const files = readdirSync(root).sort().map((path) => ({ path, sha256: digest(readFileSync(root + "/" + path)) }))
          const receipt = { schema: "sf-g08-restart-observer-controls-v1", status: "PASS", source, sources, files,
            run: { id: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
              workflowSha: process.env.GITHUB_WORKFLOW_SHA }, guardBase: read("guard-base.txt").trim(),
            controls: { node: total, python: 49, failures: 0, skipped: 0 },
            proofClass: "CONTROLLED_OBSERVER_CONTRACTS", installed: false, restartExecuted: false,
            liveQualified: false, finalCandidate: false, g08Closed: false, productionCutover: false,
            limits: ["Private bytes and original source-bound parser/orchestration controls only.",
              "The current OS/process/HTTPS ports are controlled in orchestration tests; no reserved host was observed.",
              "The canonical installed job must run original AZ02 and bind all six phases plus raw artifacts.",
              "This workflow never restarts, installs, qualifies LIVE or decides go/no-go."] }
          writeFileSync(root + "/receipt.json", JSON.stringify(receipt, null, 2) + "\n")
          console.log("Restart observer controls PASS; installed and LIVE remain false")
          NODE
      - name: Preserve only original control evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g08-restart-controls-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g08-restart-controls-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 14
          if-no-files-found: error
