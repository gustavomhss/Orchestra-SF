name: sf-wp4-original-observations
on:
  push:
    branches: [audit-wp4-observations-20261119]
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read completed WP4 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --allow-escape-sequences repos/gustavomhss/Orchestra-SF/actions/artifacts/14569559143/zip > "$RUNNER_TEMP/wp4.zip"
      - name: Extract bounded original diagnostics
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, re, zipfile
          from urllib.parse import urlsplit, parse_qs
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          sensitive = re.compile(r"authorization|set.cookie|cookie:|password|credential|secret|bearer|nonce|access.token|[?&](?:code|token|key)=", re.I)
          output = ["# WP4 diagnostics from the original Actions artifact", "", "Original run 44602654358; artifact 14569559143. No test rerun. Only bounded failure text, visible page snapshot and fixed observer fields are retained. No headers, authentication material or request/response bodies.", ""]
          found, reports = [], []
          def clean(value, limit=12000):
              return "\n".join(line for line in str(value).splitlines() if not sensitive.search(line))[:limit]
          def path_only(value):
              parsed = urlsplit(str(value))
              mode = parse_qs(parsed.query).get("sf", [])
              return parsed.path + ("?sf=" + mode[0] if mode and not sensitive.search(mode[0]) else "")
          def observer(value, origin):
              if not isinstance(value, dict) or value.get("schema") != "wp10-real-composition-v1": return
              safe = {k: value.get(k) for k in ["schema","executedSnapshotCommit","productCommit","workflowRunId","workflowRunAttempt","startedAt","stage","authenticated","serverExitCode"]}
              safe["failure"] = clean(value.get("failure"))
              safe["observations"] = [{k: clean(item.get(k), 10000) for k in ["flow","outcome","failure"]} for item in value.get("observations", []) if isinstance(item, dict)]
              safe["http"] = [{"method": item.get("method"), "route": path_only(item.get("route","")), "status": item.get("status")} for item in value.get("http", [])[:200] if isinstance(item, dict)]
              safe["browserEvents"] = [{"kind": item.get("kind"), "message": clean(item.get("message"), 1500)} for item in value.get("browserEvents", [])[:100] if isinstance(item, dict)]
              found.append((origin,safe))
          def walk(value, origin):
              if isinstance(value, list):
                  for item in value: walk(item, origin)
              elif isinstance(value, dict):
                  if value.get("name") == "wp10-composition-observations" and isinstance(value.get("body"), str):
                      try: observer(json.loads(base64.b64decode(value["body"])), origin + " named attachment")
                      except Exception: pass
                  if isinstance(value.get("errors"), list):
                      for item in value["errors"]:
                          if isinstance(item, dict):
                              text = clean(item.get("message") or item.get("stack") or "", 10000)
                              if text and text not in reports: reports.append(text)
                  for item in value.values():
                      if isinstance(item, (dict,list)): walk(item,origin)
          inspected = []
          with zipfile.ZipFile(root / "wp4.zip") as archive:
              for member in archive.infolist():
                  if member.is_dir() or member.file_size > 16000000: continue
                  name = member.filename
                  if name.endswith("error-context.md"):
                      raw = archive.read(member).decode("utf-8", errors="replace")
                      if "# Page snapshot" in raw: raw = raw[raw.index("# Page snapshot"):]
                      if "# Test source" in raw: raw = raw[:raw.index("# Test source")]
                      output += ["## " + name, "", clean(raw,18000), ""]
                  if name.endswith(".json"):
                      inspected.append(name)
                      try: value = json.loads(archive.read(member))
                      except Exception: continue
                      observer(value,name)
                      walk(value,name)
          output += [f"JSON files inspected: {len(inspected)}", f"WP10 observers found: {len(found)}", ""]
          for origin,value in found: output += ["## " + origin, "", json.dumps(value,ensure_ascii=False,indent=2), ""]
          output += ["## Original Playwright failure messages", ""]
          for item in reports[:10]: output += [item,""]
          if not found: output += ["## Inspected JSON paths", "", "\n".join(inspected[:60]), ""]
          text = "\n".join(output) + "\n"
          payload = {"message":"docs(sf): retain bounded original WP4 observations","branch":"audit-wp4-observations-20261119","content":base64.b64encode(text.encode()).decode()}
          (root / "wp4-observations-payload.json").write_text(json.dumps(payload))
          print(f"Original WP10 observers: {len(found)}; failures: {len(reports)}. Only bounded diagnostic fields retained.")
          PY
      - name: Persist original diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT repos/gustavomhss/Orchestra-SF/contents/docs/handoff/observed-wp4-original-20261119.md --input "$RUNNER_TEMP/wp4-observations-payload.json" > /dev/null
