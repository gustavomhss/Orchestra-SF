name: astra-collaboration-check

on:
  push:
    branches: [astra-check-collaboration]

permissions:
  contents: read

concurrency:
  group: astra-collaboration-check
  cancel-in-progress: false

jobs:
  scoped-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout check envelope
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify product SHA and unchanged product tree
        id: product
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const input = JSON.parse(readFileSync('.astra-collaboration-check.json', 'utf8'))
          if (Object.keys(input).sort().join(',') !== 'devSha,productSha' ||
              ![input.productSha, input.devSha].every(value => typeof value === 'string' && /^[a-f0-9]{40}$/.test(value)))
            throw new Error('Invalid collaboration check envelope')
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim()
          if (git('rev-parse', 'HEAD') !== process.env.GITHUB_SHA || git('rev-parse', 'HEAD^') !== input.productSha)
            throw new Error('Check snapshot must descend directly from product')
          if (git('diff-tree', '--no-commit-id', '--name-status', '-r', input.productSha, 'HEAD') !== 'A\t.astra-collaboration-check.json')
            throw new Error('Product blobs changed in check snapshot')
          git('merge-base', '--is-ancestor', 'afe42b6be10b9e9251309d94d743c0254d728e84', input.productSha)
          appendFileSync(process.env.GITHUB_OUTPUT, `sha=${input.productSha}\ndev=${input.devSha}\n`)
          NODE

      - name: Checkout exact product
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ steps.product.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record product and guard base
        env:
          PRODUCT_SHA: ${{ steps.product.outputs.sha }}
          DEV_SHA: ${{ steps.product.outputs.dev }}
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git rev-parse origin/dev)" = "$DEV_SHA"
          mkdir -p "$RUNNER_TEMP/astra-collaboration-evidence"
          git merge-base HEAD origin/dev > "$RUNNER_TEMP/astra-collaboration-evidence/merge-base.txt"
          git rev-parse HEAD HEAD^{tree} origin/dev > "$RUNNER_TEMP/astra-collaboration-evidence/revisions.txt"

      - name: Setup Bun
        id: setup
        uses: ./.github/actions/setup-bun

      - name: Typecheck Sucafina
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: modules/sucafina
        run: |
          set -o pipefail
          bun typecheck 2>&1 | tee "$RUNNER_TEMP/astra-collaboration-evidence/sucafina-typecheck.log"

      - name: Guard product against origin/dev
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -o pipefail
          bun run check:guards --base origin/dev 2>&1 | tee "$RUNNER_TEMP/astra-collaboration-evidence/guards.log"

      - name: Generate WP07 export inspection fixtures
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          WP07_EXPORT_DIR: ${{ runner.temp }}/astra-collaboration-evidence/exports
          WP07_PRODUCT_SHA: ${{ steps.product.outputs.sha }}
        run: bun run modules/sucafina/Sucafinav1/test/product/wp07/generate-export-fixtures.ts

      - name: Upload check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: astra-collaboration-check-${{ github.run_attempt }}
          path: ${{ runner.temp }}/astra-collaboration-evidence
          if-no-files-found: error
          retention-days: 14

